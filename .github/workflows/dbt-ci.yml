name: dbt CI/CD

on:
  pull_request:
    # `closed` : suppression du dataset dbt_ci_pr_<N> (job cleanup-ci-dataset).
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
    paths:
      # models/** except models/exposures/** (meta objects, not materialized)
      - 'models/staging/**'
      - 'models/intermediate/**'
      - 'models/marts/**'
      - 'models/apps/**'
      - 'data/**'
      - 'snapshots/**'
      - 'macros/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'profiles.yml'
      - 'packages.yml'
      - 'selectors.yml'
      # Runtime de prod (image dbt-runner) : une PR qui le touche doit être
      # validée avant que `cd` ne reconstruise l'image au merge.
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - '.sqlfluff'
      - '.github/workflows/dbt-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'models/**'
      - 'data/**'
      - 'snapshots/**'
      - 'macros/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'selectors.yml'
      - 'profiles.yml'
      - 'packages.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - '.github/workflows/dbt-ci.yml'

permissions:
  contents: write
  pages: write
  id-token: write

# Authentification GCP par Workload Identity Federation : aucune clé JSON dans
# GitHub. dbt-ci (PR) n'écrit jamais dans prod_* ; dbt-deployer (master) si.
# Cf. infra/dbt_environments.tf.
env:
  WIF_PROVIDER: projects/200066244815/locations/global/workloadIdentityPools/github-pool/providers/github
  DBT_BIGQUERY_PROJECT: evs-datastack-prod
  DBT_BIGQUERY_DATASET_PROD: prod
  DBT_STATE_URI: gs://evs-datastack-dbt-state/dbt-state/manifest.json

# ============================================================
# PR CHECK — runs on every pull_request targeting master
# ============================================================
jobs:
  pr-check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    env:
      DBT_TARGET: ci
      DBT_BIGQUERY_DATASET_CI: dbt_ci_pr_${{ github.event.number }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Authenticate to Google Cloud (WIF, dbt-ci)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: dbt-ci@evs-datastack-prod.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Dataset éphémère de la PR. Expiration des tables à 3 jours : filet si le
      # job cleanup-ci-dataset ne passe pas. Idempotent (re-run, nouveau push).
      - name: Create PR dataset
        run: |
          bq --project_id="$DBT_BIGQUERY_PROJECT" show --dataset "$DBT_BIGQUERY_DATASET_CI" >/dev/null 2>&1 \
            || bq --project_id="$DBT_BIGQUERY_PROJECT" mk --dataset --location=europe-west1 \
                 --default_table_expiration=259200 --label=env:ci \
                 --description="Build de la PR #${{ github.event.number }}, supprimé à sa fermeture" \
                 "$DBT_BIGQUERY_DATASET_CI"

      - name: dbt deps + debug
        run: |
          dbt deps
          dbt debug --target ci

      # `dbt lint` (natif v2, lit .sqlfluff) sur les seuls modèles modifiés.
      # Bloque sur une erreur, pas sur un warning.
      - name: dbt lint (changed models)
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }} HEAD -- 'models/**/*.sql' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "No SQL model files changed, skipping lint"
          else
            echo "Linting changed files: $CHANGED"
            dbt lint $CHANGED --format github-annotation
          fi

      - name: dbt parse (check for warnings)
        run: |
          dbt parse --target ci 2>&1 | tee dbt_parse_output.txt
          if grep -i "\[WARNING\]" dbt_parse_output.txt; then
            echo "::warning::dbt parse produced warnings — review the output above"
          fi

      # Analyse statique v2 : type-check le projet ENTIER contre les schémas réels
      # de BigQuery (écart entre type réel et `data_type` déclaré en YAML). Portée
      # globale voulue : une dérive de type vient du raw, pas de la PR.
      # Bloquant : s'il devient bruyant, corriger la cause plutôt que le désarmer.
      - name: dbt static analysis (strict)
        run: dbt compile --static-analysis strict --target ci

      - name: Download manifest from GCS
        continue-on-error: true
        run: |
          mkdir -p state/
          gcloud storage cp "$DBT_STATE_URI" state/manifest.json \
            || echo "No manifest found in GCS, will run full build"

      - name: dbt build
        run: |
          if [[ -f "state/manifest.json" ]]; then
            echo "SELECTIVE build (state:modified+) + --defer: snapshots & unbuilt refs resolve to PROD"
            dbt build --target ci --select state:modified+ --defer --state state/ --exclude resource_type:snapshot
          else
            # Snapshots exclus même ici : leur target_schema est `snapshots` (prod),
            # où dbt-ci n'a que la lecture.
            echo "No prod manifest to defer to -> full build in the PR dataset (snapshots excluded)"
            dbt build --target ci --exclude resource_type:snapshot
          fi

# ============================================================
# CD — runs on push to master
# ============================================================
  cd:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Un seul déploiement prod à la fois, dans l'ordre des push. Sans ce verrou,
    # deux merges rapprochés lancent deux `cd` en parallèle : le second peut
    # construire contre l'ancien manifest et déposer une carte antérieure au
    # premier merge. cancel-in-progress: false, car un build prod interrompu
    # laisserait prod_* à moitié à jour et le manifest non déposé.
    concurrency:
      group: dbt-cd-prod
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Authenticate to Google Cloud (WIF, dbt-deployer)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: dbt-deployer@evs-datastack-prod.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Target prod en ADC (identifiants WIF) ; Cloud Run garde la clé montée.
      - name: Export env variables for dbt
        run: echo "DBT_BIGQUERY_METHOD=oauth" >> $GITHUB_ENV

      - name: dbt deps + debug
        run: |
          dbt deps
          dbt debug --target prod

      - name: Download manifest from GCS
        continue-on-error: true
        run: |
          mkdir -p state/
          gcloud storage cp "$DBT_STATE_URI" state/manifest.json \
            || echo "No manifest found in GCS, will run full build"

      - name: dbt build
        run: |
          if [[ -f "state/manifest.json" ]]; then
            echo "Running SELECTIVE build (state:modified+), excluding snapshots..."
            dbt build --target prod --select state:modified+ --exclude resource_type:snapshot --state state/
          else
            echo "Running FULL build (no state available), excluding snapshots..."
            dbt build --target prod --exclude resource_type:snapshot
          fi

      - name: dbt docs generate
        run: dbt docs generate --target prod

      - name: Upload manifest to GCS
        run: gcloud storage cp target/manifest.json "$DBT_STATE_URI"

      - name: Authenticate to Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push dbt-runner image
        run: |
          docker build -t europe-west1-docker.pkg.dev/evs-datastack-prod/data-pipelines/dbt-runner:latest .
          docker push europe-west1-docker.pkg.dev/evs-datastack-prod/data-pipelines/dbt-runner:latest

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/
          retention-days: 90

# ============================================================
# CLEANUP — supprime le dataset de la PR à sa fermeture (merge ou abandon)
# ============================================================
  cleanup-ci-dataset:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (WIF, dbt-ci)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: dbt-ci@evs-datastack-prod.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # dbt-ci est OWNER des datasets qu'il a créés (bigquery.user), et de
      # ceux-là seulement. Absent = PR sans build (paths non modèle) : pas d'erreur.
      - name: Drop PR dataset
        run: |
          DS="dbt_ci_pr_${{ github.event.number }}"
          case "$DS" in dbt_ci_pr_[0-9]*) ;; *) echo "refus: $DS"; exit 1 ;; esac
          bq --project_id="$DBT_BIGQUERY_PROJECT" rm -r -f --dataset "$DS" || echo "$DS absent"

# ============================================================
# DEPLOY DOCS — runs after cd, deploys to GitHub Pages
# ============================================================
  deploy-docs:
    needs: cd
    runs-on: ubuntu-latest

    steps:
      - name: Download docs artifacts
        uses: actions/download-artifact@v4
        with:
          name: dbt-docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
