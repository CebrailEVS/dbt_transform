# dbt_project.yml
name: dbt_warehouse
version: '1.0.0'
profile: dbt_warehouse
config-version: 2
# Bascule v2 assumee : un moteur 1.x ne doit plus construire ce projet.
require-dbt-version: [">=2.0.0", "<3.0.0"]

flags:
  use_colors: true
  send_anonymous_usage_stats: false
  # Volontairement FALSE. Le chemin "batch" (metadata TABLE_STORAGE) ne concerne que
  # les sources sans loaded_at_field : ici il n'y en a aucune, il tourne donc sur 0
  # source et plante dans get_relation_last_modified ("list object has no element 0").
  # Sous dbt 1.11 l'erreur etait cosmetique, le calcul par source suivait quand meme.
  # Sous 1.12 elle fait SKIP les 55 sources : freshness aveugle, exit 1. A remettre a
  # true seulement si une source passe un jour en freshness sans loaded_at_field.
  bigquery_use_batch_source_freshness: false

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
log-path: "logs"
packages-install-path: "dbt_packages"

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  dbt_warehouse:
    +materialized: view
    +persist_docs:
      relation: true
      columns: true

    staging:
      +schema: staging
      +tags: ['staging']

      apptech:
        +tags: ['staging', 'apptech']

      yuman:
        +tags: ['staging', 'yuman']

      yuman_evs_sftp:
        +tags: ['staging', 'yuman_evs_sftp']

      nesp_co:
        +tags: ['staging', 'nesp_co']

      nesp_tech:
        +tags: ['staging', 'nesp_tech']

      oracle_neshu:
        +tags: ['staging', 'oracle_neshu']

      oracle_lcdp:
        +tags: ['staging', 'oracle_lcdp']

      oracle_neshu_gcs:
        +tags: ['staging', 'oracle_neshu_gcs']

      oracle_lcdp_gcs:
        +tags: ['staging', 'oracle_lcdp_gcs']

      mssql_sage:
        +tags: ['staging', 'mssql_sage']

      gac:
        +tags: ['staging', 'gac']

      zoho_desk:
        +tags: ['staging', 'zoho_desk']

      powerbi_activity:
        +tags: ['staging', 'powerbi_activity']

    intermediate:
      +schema: intermediate
      +tags: ['intermediate']

      yuman:
        +tags: ['intermediate', 'yuman']

      oracle_neshu:
        +tags: ['intermediate', 'oracle_neshu']

      oracle_lcdp:
        +tags: ['intermediate', 'oracle_lcdp']

      mssql_sage:
        +tags: ['intermediate', 'mssql_sage']

      nesp_co:
        +tags: ['intermediate', 'nesp_co']

      nesp_tech:
        +tags: ['intermediate', 'nesp_tech']

      zoho_desk:
        +tags: ['intermediate', 'zoho_desk']

      gac:
        +tags: ['intermediate', 'gac']

    marts:
      +schema: marts
      +tags: ['marts']

      technique:
        +tags: ['marts', 'technique']

      commerce:
        +tags: ['marts', 'commerce']

      finance:
        +tags: ['marts', 'finance']

      services_generaux:
        +tags: ['marts', 'services_generaux']

      supply_chain:
        +tags: ['marts', 'supply_chain']

      neshu:
        +tags: ['marts', 'neshu']

      lcdp:
        +tags: ['marts', 'lcdp']

      bi:
        +tags: ['marts', 'bi']

    # Couche de service des APPLICATIONS (2026-10-08, cf. docs/conventions/apps.md) :
    # modèles taillés pour une seule application, lus tels quels par elle. Hors
    # schéma en étoile (règles marts non applicables), un dataset par application.
    apps:
      +tags: ['apps']

      cockpit_supply:
        +schema: app_cockpit_supply   # prod -> prod_app_cockpit_supply ; dev/ci -> dataset du target
        +tags: ['apps', 'cockpit_supply']

seeds:
  dbt_warehouse:
    +schema: reference
    +tags: ['reference']

# Configuration des snapshots
# Les snapshots sont un artefact de PROD (historique SCD2 continu, maintenu par
# Cloud Run). En dev on ne les reconstruit pas : les builds dev les lisent depuis
# prod via --defer (cf. dim_neshu__device_history).
snapshots:
  dbt_warehouse:
    +target_schema: snapshots
    +tags: ['snapshots']

# Vars
vars:
  # Projet GCP du data lake (prod_raw, historic…), lu par les sources via
  # database: "{{ var('raw_project') }}". Tous les targets vivent désormais dans
  # ce projet (infra/dbt_environments.tf) ; la var reste pour pouvoir pointer un
  # build de test vers un autre lac sans toucher aux sources.
  raw_project: 'evs-datastack-prod'
  # Coût du paiement sans contact, en part du CA télémétrie. Le rapport finance
  # de Distrilog l'écrit en dur à 2 % ; aucune trace de ce taux en base, et aucun
  # paramétrage côté ERP. Exposé ici pour qu'il se change sans toucher au SQL.
  taux_cout_cashless: 0.02
  # Required by dbt_date (transitive dep of dbt_expectations) for recency checks.
  # Cf. docs/freshness.md méthode B.
  'dbt_date:time_zone': 'Europe/Paris'
  # Plancher de date des écritures à ventiler (fct_finance__ecriture_non_ventilee).
  ecriture_non_ventilee_floor: '2025-01-01'
  # Plafond de surstock du point de commande NESHU (fct_supply_chain__point_commande_neshu) :
  # stock_max = point de commande + N semaines de demande. Règle logistique du 2026-10-01 : les
  # fournisseurs livrent avec au moins un mois de DLUO, donc au-delà de 4 semaines de stock le
  # risque de périmés devient réel -> 4 par défaut (toute famille non listée, y compris une
  # nouvelle famille : on reste prudent).
  surstock_semaines: 4
  # Exceptions : café, thé et non périssables gardent 8 semaines. Valeur ENTIÈRE, sans
  # guillemets (sinon CASE STRING/INT64 refusé par BigQuery). Clé = dim_neshu__product.product_family.
  surstock_semaines_par_famille:
    'CAFE CAPSULES': 8
    'CAFE CAPSULES PREMIUM': 8
    'CAFE GRAIN': 8
    'CAFE LYOPHILISE': 8
    'THE': 8
    'GOBELETS': 8
    'MELANGEURS': 8
    
