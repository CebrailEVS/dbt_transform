name: dbt_warehouse
version: '1.0.0'
profile: dbt_warehouse
config-version: 2
# Projet dbt v2 : un moteur 1.x refuse de le construire.
require-dbt-version: [">=2.0.0", "<3.0.0"]

flags:
  use_colors: true
  send_anonymous_usage_stats: false
  # Garder false : le chemin "batch" ne sert qu'aux sources sans loaded_at_field. Il
  # n'y en a aucune, et sur une liste vide il plante et rend la freshness aveugle.
  bigquery_use_batch_source_freshness: false

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
log-path: "logs"
packages-install-path: "dbt_packages"

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  dbt_warehouse:
    +materialized: view
    +persist_docs:
      relation: true
      columns: true

    staging:
      +schema: staging
      +tags: ['staging']

      apptech:
        +tags: ['apptech']

      yuman:
        +tags: ['yuman']

      yuman_evs_sftp:
        +tags: ['yuman_evs_sftp']

      nesp_co:
        +tags: ['nesp_co']

      nesp_tech:
        +tags: ['nesp_tech']

      oracle_neshu:
        +tags: ['oracle_neshu']

      oracle_lcdp:
        +tags: ['oracle_lcdp']

      oracle_neshu_gcs:
        +tags: ['oracle_neshu_gcs']

      oracle_lcdp_gcs:
        +tags: ['oracle_lcdp_gcs']

      mssql_sage:
        +tags: ['mssql_sage']

      gac:
        +tags: ['gac']

      zoho_desk:
        +tags: ['zoho_desk']

      powerbi_activity:
        +tags: ['powerbi_activity']

    intermediate:
      +schema: intermediate
      +tags: ['intermediate']

      apptech:
        +tags: ['apptech']

      yuman:
        +tags: ['yuman']

      oracle_neshu:
        +tags: ['oracle_neshu']

      oracle_lcdp:
        +tags: ['oracle_lcdp']

      mssql_sage:
        +tags: ['mssql_sage']

      nesp_co:
        +tags: ['nesp_co']

      nesp_tech:
        +tags: ['nesp_tech']

      zoho_desk:
        +tags: ['zoho_desk']

      gac:
        +tags: ['gac']

    marts:
      +schema: marts
      +tags: ['marts']

      technique:
        +tags: ['technique']

      commerce:
        +tags: ['commerce']

      finance:
        +tags: ['finance']

      services_generaux:
        +tags: ['services_generaux']

      supply_chain:
        +tags: ['supply_chain']

      neshu:
        +tags: ['neshu']

      lcdp:
        +tags: ['lcdp']

      bi:
        +tags: ['bi']

    # Couche de service des applications (docs/conventions/apps.md) : modèles taillés
    # pour une seule application, hors schéma en étoile, un dataset par application.
    apps:
      +tags: ['apps']

      cockpit_supply:
        +schema: app_cockpit_supply   # prod -> prod_app_cockpit_supply ; dev/ci -> dataset du target
        +tags: ['cockpit_supply']

seeds:
  dbt_warehouse:
    +schema: reference
    +tags: ['reference']

# Snapshots : artefact de prod (historique SCD2 continu, exécuté par Cloud Workflows).
# Jamais construits hors prod : dev et CI les lisent en prod via --defer.
snapshots:
  dbt_warehouse:
    +target_schema: snapshots
    +tags: ['snapshots']

vars:
  # Projet GCP du lac (prod_raw, historic), lu par les sources via
  # database: "{{ var('raw_project') }}". Surchargeable pour pointer un build de
  # test vers un autre lac sans toucher aux sources.
  raw_project: 'evs-datastack-prod'
  # Coût du paiement sans contact, en part du CA télémétrie. Le rapport finance
  # de Distrilog l'écrit en dur à 2 % ; aucune trace de ce taux en base, et aucun
  # paramétrage côté ERP. Exposé ici pour qu'il se change sans toucher au SQL.
  taux_cout_cashless: 0.02
  # Requis par dbt_date (dépendance de dbt_expectations) pour les tests de récence
  # (docs/freshness.md, méthode B).
  'dbt_date:time_zone': 'Europe/Paris'
  # Plancher de date des écritures à ventiler (fct_finance__ecriture_non_ventilee).
  ecriture_non_ventilee_floor: '2025-01-01'
  # Plafond de surstock du point de commande NESHU (fct_supply_chain__point_commande_neshu) :
  # stock_max = point de commande + N semaines de demande. Règle de la logistique : les
  # fournisseurs livrent avec au moins un mois de DLUO, donc au-delà de 4 semaines le risque
  # de périmés devient réel. 4 par défaut, y compris pour une famille nouvelle ou non listée.
  surstock_semaines: 4
  # Exceptions : café, thé et non périssables gardent 8 semaines. Valeur ENTIÈRE, sans
  # guillemets (sinon CASE STRING/INT64 refusé par BigQuery). Clé = dim_neshu__product.product_family.
  surstock_semaines_par_famille:
    'CAFE CAPSULES': 8
    'CAFE CAPSULES PREMIUM': 8
    'CAFE GRAIN': 8
    'CAFE LYOPHILISE': 8
    'THE': 8
    'GOBELETS': 8
    'MELANGEURS': 8
