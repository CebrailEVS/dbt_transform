# Pre-commit guardrails — run regardless of who (or what) wrote the code.
# Mirrors the Claude Code PostToolUse hooks (.claude/hooks/) so a human editing
# without the AI cannot bypass linting.
#
# Install once per clone (isolated, ne pollue pas dbt_venv) :
#   pipx install pre-commit
#   pre-commit install        # installe TOUS les hooks ci-dessous (cf. default_install_hook_types)
#
# Hooks call ./dbt_venv/bin/* directly — single source of truth for tool versions
# (dbt pinned in requirements-lock.txt). No duplicated tool install here.

# Un seul `pre-commit install` pose les quatre types de hooks git.
default_install_hook_types: [pre-commit, pre-push, post-merge, post-checkout]
# Un hook sans `stages:` ne tourne qu'au commit (sinon dbt lint s'afficherait aussi à chaque
# changement de branche).
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # --- commit stage : lint SQL models (dbt lint, natif v2) ---
      # SQLFluff n'est pas compatible dbt v2. `dbt lint` lit le meme .sqlfluff
      # et les memes `-- noqa`. Il ne se connecte pas a BigQuery, mais profiles.yml
      # resout des env_var() : on source .env comme avant.
      - id: dbt-lint
        name: dbt lint (models)
        language: system
        entry: bash -c 'set -a; [ -f .env ] && . ./.env; set +a; exec ./dbt_venv/bin/dbt lint "$@"' --
        files: ^models/.*\.sql$
        pass_filenames: true

      # --- pre-push stage : full dbt parse (slow + needs .env, shows dbt warnings) ---
      - id: dbt-parse
        name: dbt parse (whole project)
        language: system
        entry: bash -c 'set -a; [ -f .env ] && . ./.env; set +a; exec ./dbt_venv/bin/dbt parse'
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # --- post-merge / post-checkout : manifest prod pour le --defer ---
      # Après un `git pull` ou un changement de branche, met state/manifest.json au
      # niveau de la prod (téléchargement seulement si la prod a changé). Ne bloque
      # jamais git : en cas de problème, un avertissement et c'est tout.
      - id: pull-dbt-state
        name: manifest prod (defer)
        language: system
        entry: scripts/pull-state.sh --hook
        pass_filenames: false
        always_run: true
        verbose: true   # affiche « mis à jour » ou l'avertissement, même quand le hook passe
        stages: [post-merge, post-checkout]
