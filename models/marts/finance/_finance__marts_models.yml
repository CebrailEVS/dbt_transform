version: 2

models:
  - name: fct_finance__pnl_bu
    description: |
      [QUOI MÉTIER] P&L mensuel par Business Unit analytique, avec scénarios avec/sans provisions congés payés.
      [COMMENT CONSTRUITE] Issu des écritures comptables Sage (int_sage__pnl) agrégées par BU et KPI ; deux scénarios calculés : AVEC_PROVISIONS_CP (toutes écritures) et SANS_PROVISIONS_CP (exclut comptes 645800, 641200). Enrichi des valeurs YTD, N-1 et écarts/évolutions.
      [GRAIN] 1 ligne par (scenario, annee, mois, bu, kpi).
      [NOTES] Les KPI couvrent : CA, CONSOMMATION_MP_SSTT, MASSE_SALARIALE, FRAIS_DIRECTS_AMORTISSEMENTS, MARGE_BRUTE, MARGE_NETTE. BU_NON_RENSEIGNEE pour les écritures sans imputation analytique.

    columns:
      - name: scenario
        description: >
          Scénario financier appliqué aux données.
          - AVEC_PROVISIONS_CP : inclut les provisions congés payés
          - SANS_PROVISIONS_CP : exclut certains comptes généraux (ex. 645800, 641200)
        tests:
          - not_null

      - name: annee
        description: Année comptable issue de la date de facturation
        tests:
          - not_null

      - name: mois
        description: Mois comptable (1–12)
        tests:
          - not_null

      - name: bu
        description: Business Unit analytique (ou BU_NON_RENSEIGNEE si absente)
        tests:
          - not_null

      - name: kpi
        description: Type de KPI financier
        tests:
          - accepted_values:
              arguments:
                values:
                  - CA
                  - CONSOMMATION_MP_SSTT
                  - MASSE_SALARIALE
                  - FRAIS_DIRECTS_AMORTISSEMENTS
                  - MARGE_BRUTE
                  - MARGE_NETTE

      - name: valeur
        description: Valeur mensuelle du KPI

      - name: valeur_ytd
        description: Valeur cumulée Year-To-Date du KPI

      - name: valeur_n_1
        description: Valeur du KPI pour la même période en année N-1

      - name: valeur_ytd_n_1
        description: Valeur cumulée YTD du KPI en année N-1

      - name: pct_du_ca
        description: Pourcentage du KPI par rapport au chiffre d'affaires du mois

      - name: pct_du_ca_ytd
        description: Pourcentage du KPI par rapport au chiffre d'affaires YTD

      - name: pct_du_ca_n_1
        description: Pourcentage du KPI par rapport au chiffre d'affaires N-1

      - name: pct_du_ca_n_1_ytd
        description : Pourcentage du KPI par rapport au chiffre d'affaires N-1 YTD

      - name: ecart_n_vs_n_1
        description: Écart absolu entre l'année N et N-1 (mensuel)

      - name: evolution_pct
        description: Évolution en pourcentage entre N et N-1 (mensuel)

      - name: ecart_n_vs_n_1_ytd
        description: Écart absolu entre YTD N et YTD N-1

      - name: evolution_pct_ytd
        description: Évolution en pourcentage entre YTD N et YTD N-1

  - name: fct_finance__ecriture_non_ventilee
    description: |
      [QUOI MÉTIER] Liste des écritures comptables de charge (classe 6) ou produit (classe 7) sans aucune ventilation analytique dans Sage — la file des écritures restant à ventiler par la comptabilité, consommée par l'app compta.
      [COMMENT CONSTRUITE] int_mssql_sage__ecriture_non_ventilee : f_ecriturec filtré aux classes 6/7 et >= var('ecriture_non_ventilee_floor', défaut 2025-01-01), en anti-jointure sur les écritures analytiques f_ecriturea (ec_no absents). date_facturation = jm_date + (ec_jour-1) jours.
      [GRAIN] 1 ligne par écriture comptable (ecriture_comptable_id).
      [NOTES] Matérialisée en **view** (et non table) : déviation assumée à la convention marts, justifiée par un petit volume (~27k lignes), une conso opérationnelle par l'app compta (/mnt/data/project/compta) sensible à la fraîcheur et un requêtage peu fréquent. montant brut non signé ; sens_ecriture (0 = débit, 1 = crédit) pour l'interpréter.

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "substr(numero_compte_general, 1, 1) in ('6', '7')"

    columns:
      - name: date_facturation
        description: Date de facturation reconstruite (jm_date + (ec_jour-1) jours). Axe temporel principal.
        tests:
          - not_null
      - name: ecriture_comptable_id
        description: Numéro de l'écriture comptable Sage. Clé primaire / grain.
        tests:
          - unique
          - not_null
      - name: numero_compte_general
        description: Numéro de compte général (classe 6 = charges, 7 = produits).
        tests:
          - not_null
      - name: libelle_ecriture
        description: Libellé libre de l'écriture comptable.
      - name: sens_ecriture
        description: "Sens comptable de l'écriture : 0 = débit, 1 = crédit."
      - name: date_ecriture_comptable
        description: Date de l'écriture comptable Sage (ec_date).
      - name: montant
        description: Montant (€) de l'écriture, brut non signé (toujours positif).
      - name: montant_signe
        description: >
          Montant (€) orienté selon le sens comptable : positif au crédit (sens_ecriture = 1),
          négatif au débit (sens_ecriture = 0). Même convention que le P&L (somme = produits − charges).
      - name: extracted_at
        description: Timestamp d'extraction de la source (fraîcheur de la donnée exposée à l'app).

  - name: fct_finance__pnl_client_mensuel
    description: |
      [QUOI MÉTIER] Compte de résultat mensuel par client Neshu (codes CN), du chiffre d'affaires à la marge nette. Reprise du rapport que les développeurs de Distrilog produisent par une requête SQL de 457 lignes, portée dans notre stack.
      [COMMENT CONSTRUITE] Assemble int_oracle_neshu__ca_client_mensuel (6 composantes de CA), __cout_produits_mensuel (produits chargés et livrés), __temps_appro_mensuel (temps et passages), __charges_sociales (enveloppe à répartir), __amortissement_machines, __telemetrie_parc et __contrat_client, enrichi de la signalétique de dim_neshu__company. Chaînage : CA − coûts produits = marge brute ; − amortissement − coût de main-d'oeuvre − télémétrie = marge nette.
      [GRAIN] 1 ligne par (mois, company_id), restreint aux clients dont le code commence par CN.
      [NOTES] ÉCARTS CONNUS AVEC LE RAPPORT DISTRILOG — à lire avant de conclure à une erreur de calcul. Validation du 2026-09-15 sur août 2026, 180 clients.
        (1) EXACTS À 180/180 : CA Nayax, CA négoce, CA lave-verres, coût des produits chargés, coût des produits livrés, coût cashless, temps RM, coût RM, coût minute, passages machines et clients, temps moyens, coût télémétrie.
        (2) LATENCE DE PURGE (177/180, +566 € sur le CA total d'août) : le raw conserve les lignes supprimées dans l'ERP jusqu'à la purge du dimanche (CONVENTIONS.md règle 9, latence acceptée ≤ 7 jours). L'écart croît du dimanche au samedi puis retombe. Il touche le CA vending, presta et fontaines, donc la marge brute. Ce n'est pas un défaut de modèle : c'est le délai de propagation des suppressions.
        (3) AMORTISSEMENT (97/180, +841 € sur août 2026) : écart VOLONTAIRE et élucidé le 2026-09-15. La requête Distrilog groupe les sous-équipements par la VALEUR de leur dotation et non par leur identifiant, ce qui produit deux défauts opposés. Sur 105 machines dont les sous-équipements ont la même dotation, ils sont fusionnés en un seul groupe : trois accessoires n'en comptent qu'un, la dotation est SOUS-évaluée. Sur 662 machines dont les sous-équipements ont des dotations distinctes, chaque valeur crée un groupe portant AUSSI la dotation de la machine, comptée autant de fois : elle est SUR-évaluée. Les deux effets se compensent partiellement, le net vaut −841 € face à un calcul correct. Ici chaque sous-équipement compte une fois et chaque machine une fois (agrégation avant jointure). Ce modèle est donc plus juste que le rapport d'origine, et la marge nette hérite de l'écart. S'y ajoute, marginalement, la latence de purge du point (2), qui fait entrer des machines vues sur des tâches depuis supprimées.
        (4) TYPOLOGIE, écart volontaire : un client est GET s'il a signé dans l'année DU MOIS ANALYSÉ. Distrilog compare à l'année du jour où la requête tourne, ce qui fait basculer l'historique chaque 1er janvier. Le choix d'ici rend le mart rejouable.
        (5) FUITE DE RÉPARTITION, reproduite volontairement : le dénominateur du coût RM couvre tous les clients ayant reçu un passage, y compris ceux absents du rapport faute de CA. La somme des coûts RM affichés est donc inférieure aux charges saisies — 87 € sur 153 946 € en juin 2026, soit 0,06 %. Corriger le dénominateur ferait diverger tous les clients de Distrilog pour récupérer 0,06 % : non retenu.
        (6) COÛT RM À ZÉRO : les charges sociales sont saisies manuellement dans l'ERP, une tâche par mois. Rien n'est saisi depuis juin 2026, donc cout_rm_eur vaut 0 sur juillet et août et la marge nette est surévaluée d'autant. Le rapport Distrilog porte le même trou. Donnée absente à la source, pas erreur de calcul.
        (7) Le mart RECALCULE tout à chaque run : l'ERP retouche des mois clos (1,4 % des tâches de juillet 2026 modifiées après sa clôture). Un mois publié peut donc changer. La colonne calcule_le date le calcul ; deux exports qui diffèrent s'expliquent par là.
        Taux de coût cashless : var('taux_cout_cashless'), 2 % comme chez Distrilog, sans trace de ce taux en base.

    columns:
      - name: mois
        description: "Premier jour du mois analysé. Clé de partitionnement."
        tests:
          - not_null
      - name: company_id
        description: "Identifiant du client."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_neshu__company')
                field: company_id
              config:
                severity: warn
      - name: company_code
        description: "Code client, toujours préfixé CN sur ce mart."
        tests:
          - not_null
      - name: typologie
        description: "GET si le client a signé son premier contrat dans l'année du mois analysé, OTHER sinon. Voir [NOTES] (4)."
        tests:
          - accepted_values:
              arguments:
                values: ['GET', 'OTHER']
      - name: effectif
        description: "Effectif saisi dans le XML de la société, et non la tranche déclarée par label. Additif : non."
      - name: ca_total_ht_eur
        description: "Somme des six composantes de CA. Additif."
        tests:
          - not_null
      - name: cout_produits_total_ht_eur
        description: "Produits chargés + produits livrés + cashless. Additif."
      - name: marge_brute_eur
        description: "CA total − coûts produits. Additif."
      - name: pct_marge_brute
        description: "Marge brute rapportée au CA total, en %. NON additif : à recalculer, jamais à sommer."
      - name: nb_min_rm
        description: "Temps de présence des approvisionneurs, en minutes. AMPLITUDE de la journée chez le client (première arrivée à dernier départ), pas somme des durées de tâches. Additif."
      - name: cout_rm_eur
        description: "Quote-part des charges sociales du mois, au prorata du temps. Vaut 0 quand rien n'est saisi — voir [NOTES] (6). Additif."
      - name: cout_minute_eur
        description: "Charges du mois divisées par le temps total. Identique pour tous les clients d'un même mois. NON additif."
      - name: nb_passages_machine
        description: "Nombre de tâches d'approvisionnement, une par machine servie. Additif."
      - name: nb_passages_client
        description: "Nombre de jours distincts de visite. Additif."
      - name: montant_amortissement_eur
        description: "Dotation du mois, machine et sous-équipements. Écart connu avec Distrilog, voir [NOTES] (3). Additif."
      - name: marge_nette_eur
        description: "Marge brute − amortissement − coût RM − coût télémétrie. Additif."
      - name: pct_marge_nette
        description: "Marge nette rapportée au CA total, en %. NON additif."
      - name: calcule_le
        description: "Horodatage du run qui a produit la ligne. Voir [NOTES] (7)."
