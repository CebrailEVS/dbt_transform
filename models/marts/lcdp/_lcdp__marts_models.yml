# models/marts/oracle_lcdp/_oracle_lcdp__marts_models.yml
version: 2

models:
  # COMPANY
  - name: dim_lcdp__company
    description: |
      [QUOI MÉTIER] Dimension client (company) LCDP enrichie des labels métier et de la localisation.
      [COMMENT CONSTRUITE] Issu de stg_oracle_lcdp__company joint à stg_oracle_lcdp__location pour les coordonnées, et pivot des labels via stg_oracle_lcdp__label_company (vue aplatie lcdp_v_label_company) sur les familles : ZGEO, DOMACT, BUSMOD, GC, ISACTIVE, MODEH, MODEOF, MODER, PROPRIO, REPRES, BL_GRP, MEF, Gestion reliquat.
      [GRAIN] 1 ligne par company_id.
      [NOTES] parent_company_id permet la hiérarchie société-mère/fille. Les attributs label exposent désormais le libellé FR (label_text_fr) au lieu du code. Exception : is_active reste basé sur le code (YES/NO) pour la conversion booléenne (TRUE si label ISACTIVE='yes').
    columns:
      - name: company_id
        description: "Identifiant unique de la société"
        tests:
          - not_null
          - unique
        
      - name: parent_company_id
        description: "ID de la comapny parente (hiérarchie)"

      - name: company_type_id
        description: "ID Type de société (ex : client, fournisseur...)"

      - name: company_code
        description: "Code client"

      - name: company_name
        description: "Nom de la société"

      - name: geo_zone
        description: "Zone géographique de la société (label ZGEO)"

      - name: activity_domain
        description: "Domaine d'activité (label DOMACT)"

      - name: business_model
        description: "Modèle business (label BUSMOD)"

      - name: key_account
        description: "Grand compte (label GC)"

      - name: is_active
        description: >
          Indique si la société est active (label ISACTIVE).
          TRUE si 'yes', sinon FALSE.

      - name: model_horeca
        description: "Modèle HORECA (label MODEH)"

      - name: model_office
        description: "Modèle Office (label MODEOF)"

      - name: model_revendeur
        description: "Modèle Revendeur (label MODER)"

      - name: owner
        description: "Propriétaire de la société (label PROPRIO)"

      - name: representative
        description: "Représentant commercial (label REPRES)"

      - name: bl_group
        description: "Groupe de bon de livraison (label BL_GRP)"

      - name: invoice_delivery_mode
        description: "Mode d'envoi de facture (label MEF)"

      - name: remainder_management
        description: "Gestion du reliquat (label Gestion reliquat)"

      - name: address1
        description: "Adresse principale (ligne 1)"

      - name: address2
        description: "Adresse complémentaire (ligne 2)"

      - name: city
        description: "Ville"

      - name: postal_code
        description: "Code postal"

      - name: country
        description: "Pays"

      - name: created_at
        description: "Date de création de la société"

      - name: updated_at
        description: "Date de dernière modification"

  # PRODUCT
  - name: dim_lcdp__product
    description: |
      [QUOI MÉTIER] Dimension produit LCDP enrichie des labels métier (famille, groupe, marque, bio).
      [COMMENT CONSTRUITE] Issu de stg_oracle_lcdp__product filtré sur product_type_id IN (1, 5), enrichi par pivot des labels via stg_oracle_lcdp__label_product (vue aplatie lcdp_v_label_product) : FAMIPRO, GROUPRO, MARQPRO, BIO, ISACTIVE. created_at corrigé si NULL pour idproduct=1 (fallback updated_at).
      [GRAIN] 1 ligne par product_id.
      [NOTES] product_type_id : 1 = produit, 5 = ligne de prix. Les attributs label exposent désormais le libellé FR (label_text_fr) au lieu du code. Exception : is_active reste basé sur le code (YES/NO) pour la conversion booléenne.
    columns:
      - name: product_id
        description: "Identifiant unique du produit"
        tests:
          - not_null
          - unique

      - name: product_type_id
        description: "ID Type de produit (1=produit, 5=ligne de prix)"

      - name: product_code
        description: "Code métier du produit"

      - name: product_name
        description: "Nom du produit"

      - name: purchase_unit_price
        description: "Prix d'achat unitaire hors taxe"

      - name: product_family
        description: "Famille du produit (label FAMIPRO)"

      - name: product_group
        description: "Groupe du produit (label GROUPRO)"

      - name: product_brand
        description: "Marque du produit (label MARQPRO)"

      - name: product_bio
        description: "Indicateur produit bio (label BIO)"

      - name: is_active
        description: >
          Indique si le produit est actif (label ISACTIVE).
          TRUE si 'yes', sinon FALSE.

      - name: created_at
        description: "Date de création du produit"

      - name: updated_at
        description: "Date de dernière modification"

  # DEVICE
  - name: dim_lcdp__device
    description: |
      [QUOI MÉTIER] Dimension machine LCDP enrichie des labels métier (catégorie, état, types fontaine/broyeur/percolateur/SP).
      [COMMENT CONSTRUITE] Issu de stg_oracle_lcdp__device joint à stg_oracle_lcdp__company (company_code, company_name) et stg_oracle_lcdp__location (access_info → device_location). Pivot des labels via stg_oracle_lcdp__label_device (vue aplatie lcdp_v_label_device) sur les familles : CATMACH, MARQUE, ETAT_MACHINE, STATUT_MATERIEL, TYPEAUDIT, TYDA, LCDPMON, TYPFONT, TYPBROY, TYPPERCO, TYPSP, TYPDASA, MODSP, MARQSP, BADGE, ISACTIVE. ROADMAN AFFECTÉ (assigned_roadman_id / _code / _name) : résolu depuis stg_oracle_lcdp__contact_has_device → stg_oracle_lcdp__contact → dim_lcdp__resource, la jointure se faisant sur le CODE (contact.code = resources_code, resources_type='PERSON') car la source ne porte aucune FK idresources ; jointure sur la dim (et non le staging) pour garantir que la FK exposée résout dans la dimension à laquelle la BI se relie.
      [GRAIN] 1 ligne par device_id.
      [NOTES] device_iddevice = parent device (hiérarchie). Les attributs label exposent désormais le libellé FR (label_text_fr, ex. "DA CHAUD") au lieu du code (ex. "CATMACH01"). Exception : is_active reste basé sur le code (YES/NO) pour la conversion booléenne. is_active converti en booléen. ROADMAN AFFECTÉ — état COURANT, non historisable : contact_has_device ne porte ni date de création ni date de modification, on ne connaît donc que l'affectation d'aujourd'hui (une historisation nécessiterait un snapshot). À NE PAS CONFONDRE avec le roadman OBSERVÉ de fct_lcdp__chargement_sortie (celui qui a réellement chargé la machine dans la semaine) : les deux coïncident sur 82,6 % des lignes comparables sur 90 jours, les écarts sont un signal métier (réaffectation de secteur, remplacement congés non répercuté dans l'ERP). COUVERTURE : renseigné sur 730 machines / 2 758 (26,5 % du parc) mais 99,4 % du périmètre DA FROID Nayax — la colonne est donc majoritairement NULL sur le parc complet, c'est attendu. DÉPARTAGE : 2 machines portent 2 affectations dans l'ERP (M7077, M5114, machines à café hors périmètre DA FROID) ; on retient le code le plus petit pour garantir 1 ligne par machine et une valeur stable d'un rebuild à l'autre (contact.ismain vaut 0 partout, inexploitable comme critère). Le test assert_lcdp__device_single_assigned_roadman (warn) rend ce nombre visible : s'il grimpe, la règle ne suffit plus et il faudra arbitrer avec l'exploitation.
    columns:
      - name: device_id
        description: "Identifiant unique du device"
        tests:
          - not_null
          - unique

      - name: device_iddevice
        description: "ID du device parent (hiérarchie)"

      - name: device_type_id
        description: "ID Type de device"

      - name: company_id
        description: "ID de l'entreprise cliente"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__company')
                field: company_id

      - name: location_id
        description: "ID de la localisation"

      - name: device_code
        description: "Code métier du device"

      - name: device_name
        description: "Nom du device"

      - name: company_code
        description: "Code de l'entreprise cliente"

      - name: company_name
        description: "Nom de l'entreprise cliente"

      - name: device_category
        description: "Catégorie de la machine (label CATMACH)"

      - name: device_brand
        description: "Marque du device (label MARQUE)"

      - name: device_state
        description: "État de la machine (label ETAT_MACHINE)"

      - name: device_material_status
        description: "Statut du matériel (label STATUT_MATERIEL)"

      - name: audit_type
        description: "Type d'audit - cashless, télémétrie nayax, etc. (label TYPEAUDIT)"

      - name: typology_da
        description: "Typologie DA (label TYDA)"

      - name: currency_mode
        description: "Mode monnaie - avec ou sans (label LCDPMON)"

      - name: fountain_type
        description: "Type de fontaine (label TYPFONT)"

      - name: grinder_type
        description: "Type de broyeur (label TYPBROY)"

      - name: percolator_type
        description: "Type de percolateur (label TYPPERCO)"

      - name: type_sp
        description: "Type SP (label TYPSP)"

      - name: type_dasa
        description: "Type DASA (label TYPDASA)"

      - name: model_sp
        description: "Modèle SP (label MODSP)"

      - name: brand_sp
        description: "Marque SP (label MARQSP)"

      - name: badge
        description: "Badge (label BADGE)"

      - name: device_location
        description: "Informations d'accès de la localisation"

      - name: assigned_roadman_id
        description: >
          Roadman AFFECTÉ à la machine (FK vers dim_lcdp__resource) — état COURANT
          déclaré dans l'ERP (contact_has_device), c'est-à-dire qui a la charge de la
          machine aujourd'hui. Répond au besoin BI « vision secteur / tournée ».
          NON HISTORISÉ : la source ne porte aucune date, on ne sait donc rien de
          l'affectation passée. À NE PAS CONFONDRE avec le roadman OBSERVÉ de
          fct_lcdp__chargement_sortie (celui qui a réellement chargé sur la semaine) :
          les deux coïncident sur 82,6 % des lignes comparables de
          fct_lcdp__chargement_sortie sur 90 jours (846 / 1 024). Au grain machine le
          taux monte à 92,4 % (97 / 105) : un roadman de remplacement sur une semaine
          isolée casse la concordance de cette ligne sans changer qui tient la machine
          sur la période. NULL sur ~73 % du parc (affectation
          renseignée sur 730 machines / 2 758) mais sur 0,6 % seulement du périmètre
          DA FROID Nayax. Départage sur le code le plus petit quand une machine porte
          2 affectations (2 cas au 2026-07-29, cf. test
          assert_lcdp__device_single_assigned_roadman).
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__resource')
                field: resources_id
              config:
                severity: warn

      - name: assigned_roadman_code
        description: "Code du roadman affecté (ex. APPRO01) — valeur d'affichage/slicer, alignée sur dim_lcdp__resource.resources_code. NULL si aucune affectation."

      - name: assigned_roadman_name
        description: "Nom du roadman affecté — valeur d'affichage aplatie depuis dim_lcdp__resource (évite une jointure côté BI). NULL si aucune affectation."

      - name: is_active
        description: >
          Indique si le device est actif (label ISACTIVE).
          TRUE si 'yes', sinon FALSE.

      - name: last_installation_date
        description: "Dernière date d'installation"

      - name: created_at
        description: "Date de création"

      - name: updated_at
        description: "Date de dernière modification"

  # RESOURCE
  - name: dim_lcdp__resource
    description: |
      [QUOI MÉTIER] Dimension ressource Oracle LCDP : personnes (PERSON) + véhicules (VEHICLE) avec hiérarchie.
      [COMMENT CONSTRUITE] Issu de stg_oracle_lcdp__resources, pivot des labels via stg_oracle_lcdp__label_has_resources : ISACTIVE, Fonction. Miroir de dim_neshu__resource sans l'enrichissement GEA (pas de seed côté LCDP).
      [GRAIN] 1 ligne par resources_id.
      [NOTES] Hiérarchie : resources_idresources d'un VEHICLE pointe vers l'ID de la PERSON associée ; NULL pour les personnes. code_status_record conservé (1=actif) sans filtre — filtrage à la volée côté BI. is_active converti en booléen.
    columns:
      - name: resources_id
        description: "Identifiant unique de la ressource dans Oracle"
        tests:
          - not_null
          - unique

      - name: resources_type_id
        description: "Identifiant du type de ressource (clé vers resources_type)"

      - name: resources_idresources
        description: >
          Lien vers la ressource associée. Pour un véhicule (VEHICLE) : pointe vers l'ID de la personne (PERSON) associée.
          Pour une personne (PERSON) : NULL.

      - name: company_id
        description: "Identifiant de l'entreprise à laquelle est rattachée la ressource"
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__company')
                field: company_id

      - name: company_storehouse_id
        description: "Identifiant de l'entreprise entrepôt associée à la ressource"
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__company')
                field: company_id

      - name: location_id
        description: "Identifiant de la localisation de la ressource"

      - name: resources_code
        description: "Code métier de la ressource (ex : code personne ou immatriculation véhicule)"
        tests:
          - not_null

      - name: resources_name
        description: "Nom de la ressource"

      - name: resources_type
        description: "Type de ressource : PERSON (personne) ou VEHICLE (véhicule)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PERSON', 'VEHICLE']

      - name: is_active
        description: >
          Indique si la ressource est active (label ISACTIVE).
          Converti en booléen : TRUE si 'yes', FALSE sinon.
        tests:
          - not_null

      - name: fonction
        description: "Fonction de la personne (label Fonction, ex : APPRO, DIRECT). NULL pour les véhicules."

      - name: cost
        description: "Coût associé à la ressource"

      - name: arrival
        description: "Date d'arrivée de la ressource dans l'entreprise"

      - name: departure
        description: "Date de départ de la ressource (NULL si toujours en poste/en service)"

      - name: code_status_record
        description: >
          Code de statut de l'enregistrement Oracle (1 = actif, autre = inactif).
          Non filtré dans ce modèle — utilisable côté BI pour exclure les inactifs.

      - name: created_at
        description: "Date de création de la ressource dans Oracle"

      - name: updated_at
        description: "Date de dernière mise à jour de la ressource dans Oracle"

  # CHARGEMENT vs SORTIE (taux d'écoulement Nayax)
  - name: fct_lcdp__chargement_sortie
    description: |
      [QUOI MÉTIER] Taux d'écoulement (VOLUME) hebdomadaire des machines LCDP télémétrées Nayax FULL NAYAX (sans monnayeur) — comparaison entrées (quantités chargées) vs sorties (nombre de ventes Nayax). Modèle volume pur, sans mesure monétaire (le CA est porté par fct_lcdp__ca_mensuel).
      [COMMENT CONSTRUITE] Tâches de chargement retenues aux statuts FAIT / VALIDE uniquement (filtre posé ici : l'intermediate remonte aussi ANNULE et ANOMALIE), comme les invendus et la télémétrie en amont. Périmètre filtré sur dim_lcdp__device.audit_type='1- AUDIT TELEMETRIE (NAYAX)' AND device_category='DA FROID' AND currency_mode='SANS MONNAIE' (full Nayax). Les machines à monnayeur (currency_mode='AVEC MONNAIE') sont EXCLUES : une partie de leurs ventes est encaissée en espèces (invisible côté Nayax) → le taux d'écoulement volume y serait faussé ; leur suivi CA passe par fct_lcdp__ca_mensuel. PÉRIMÈTRE PRODUIT (invariant du modèle) : toutes les mesures de quantité sont restreintes aux groupes de produits VENDABLES via dim_lcdp__product × seed ref_oracle_lcdp__product_group_vendable (is_vendable=true → 3 groupes SNACK / BOISSON FROIDE / PRODUIT FRAIS) ; ce filtre s'applique à tout le modèle, il n'est donc PAS répété dans le nom des colonnes. Entrées issues de int_oracle_lcdp__chargement_tasks, classées par movement_type (sens dérivé du SIGNE de la quantité, pas du label) : les LOADING alimentent qty_chargee, les REMOVING (retraits de stock, ex. péremption) alimentent qty_retiree. Sorties issues de int_oracle_lcdp__telemetry_tasks (1 event = 1 vente). Invendus issus de int_oracle_lcdp__invendus_tasks (task_type 11, produits retirés car invendus : péremption/casse), exposés à part (qty_invendus). Contexte de réassort (nb_passages_appro) issu de int_oracle_lcdp__appro_tasks_enriched (task_type 32, passages réalisés is_done), rattaché en LEFT JOIN sur device×semaine (n'ajoute pas de ligne). Agrégation par device × semaine ISO (lundi), FULL OUTER JOIN entre les trois flux de stock. Rolling 4 semaines (W-3 à W incluse) calculé via window function bornée à 21 jours. ROADMAN OBSERVÉ (resources_roadman_id / roadman_code / roadman_name) : roadman ayant réalisé le plus de tâches de chargement sur la machine dans la semaine, calculé depuis les mêmes tâches que qty_chargee (CTE chargement_tasks_scoped partagée) ; départage nb de chargements → volume chargé → identifiant le plus petit ; nom aplati depuis dim_lcdp__resource.
      [GRAIN] 1 ligne par device_id × week_start_date.
      [NOTES] Pas de dimension client ici (volontaire) : ~21% des devices changent de client dans le temps et le company_peer vit côté tâche ; l'ajout d'une vue par client est à arbitrer avec le métier (cf. semaines de transfert où chargé et ventes peuvent tomber sur 2 clients). Hors périmètre : DA CHAUD, DA SEMI-AUTO, BORNE/BROYEUR (chargement non commensurable aux events) et machines à monnayeur (volume faussé — voir fct_lcdp__ca_mensuel pour leur CA). Backfill depuis 2025-01-01. taux_ecoulement_volume = NULL si chargement = 0 (vidange de stock historique attendue). COMMENSURABILITÉ : le taux nb_ventes / qty_chargee n'a de sens que parce que 1 event télémétrie Nayax = 1 unité vendue (telemetry_quantity = 1 en amont) ; nb_ventes est un count(*) d'events (entier), comparé à une quantité chargée DÉCLARÉE (somme en unités de base) — deux systèmes de mesure distincts. CONVENTION MESURES : préfixe qty_ = somme de quantités physiques en unités de base ; nb_ = compte d'événements (count). MODÈLE VOLUME PUR : aucune mesure monétaire (CA, coût, marge) n'est exposée ici (décision 2026-06-17) — le suivi repose uniquement sur le rapport quantités chargées / nombre de ventes. Le CA full-Nayax est disponible dans fct_lcdp__ca_mensuel (grain mensuel). RETRAITS DE STOCK VENDABLE — deux canaux distincts, de même nature (produit sorti de la machine, ex. péremption), SANS double comptage : (1) qty_retiree = REMOVING du chargement (movement_type, signe de la quantité, cf. int_oracle_lcdp__chargement_tasks) ; (2) qty_invendus = constat dédié INVENDUS (task_type 11, cf. int_oracle_lcdp__invendus_tasks). Le taux d'écoulement NET déduit LES DEUX du dénominateur (taux_ecoulement_volume_net_4wk = ventes / (chargé − retiré − invendus), décision métier 2026-06-26) → il mesure la part vendue du stock réellement resté disponible (ni retiré, ni constaté invendu). qty_invendus (et qty_invendus_4wk) restent exposés à part pour le suivi de la casse/pertes. CONTEXTE RÉASSORT : nb_passages_appro = nombre de passages approvisionneurs RÉALISÉS dans la semaine (combien de fois la machine a été servie) — indicateur INFORMATIF lu à côté du taux (ex. sur-service = beaucoup de passages + faible écoulement), n'entre dans aucun ratio. 1 tâche appro ≈ 1 visite (vérifié : 99% des jours = 1 tâche par machine/roadman). Le détail passage (roadman, durée, statut) vit dans fct_lcdp__passage_appro (grain passage). ROADMAN OBSERVÉ vs AFFECTÉ — la colonne roadman de ce mart est le roadman qui a EFFECTIVEMENT chargé (dérivé des tâches), à ne pas confondre avec le roadman AFFECTÉ à la machine dans l'ERP (contact_has_device, staging depuis PR #187) : 90,9 % de concordance sur 90 jours. Les écarts sont un signal métier (réaffectation de secteur, remplacement congés non répercuté côté affectation), pas un défaut de la chaîne data. Le roadman observé est NULL sur ~17 % des lignes (semaine vendue sans réassort) ; le roadman affecté, lui, couvre 99,9 % des lignes — c'est donc lui qu'il faudra exposer si le besoin BI est un slicer toujours renseigné (vision secteur/tournée), demande à traiter séparément.
    config:
      contract:
        enforced: false
    columns:
      - name: device_id
        description: "Identifiant de la machine (FK vers dim_lcdp__device)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__device')
                field: device_id

      - name: week_start_date
        description: "Lundi de la semaine ISO (date_trunc week monday) de la mesure"
        tests:
          - not_null

      - name: resources_roadman_id
        description: >
          Roadman OBSERVÉ de la semaine (FK vers dim_lcdp__resource) : celui qui a
          réalisé le plus de tâches de chargement sur la machine dans la semaine.
          Calculé sur le même périmètre de tâches que qty_chargee / qty_retiree
          (produits vendables) → qualifie exactement l'activité de chargement mesurée
          sur la ligne. Départage déterministe en cas d'égalité sur le nombre de
          chargements (5,6 % des device×semaine) : volume chargé, puis identifiant le
          plus petit. NULL sur les semaines sans chargement (~17 % des lignes : machine
          qui a vendu sans être rechargée) — attendu, il n'y a personne à nommer.
          À NE PAS CONFONDRE avec le roadman AFFECTÉ à la machine dans l'ERP
          (contact_has_device, exposé sur dim_lcdp__device) : les deux coïncident sur
          82,6 % des lignes comparables sur 90 jours, une réaffectation de
          secteur ou un remplacement ne remonte pas toujours côté affectation.
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__resource')
                field: resources_id
              config:
                severity: warn

      - name: roadman_code
        description: "Code du roadman observé (ex. APPRO01) — valeur d'affichage/slicer, alignée sur dim_lcdp__resource.resources_code. NULL si aucun chargement dans la semaine."

      - name: roadman_name
        description: "Nom du roadman observé — valeur d'affichage aplatie depuis dim_lcdp__resource (évite une jointure côté BI). NULL si aucun chargement dans la semaine."

      - name: qty_chargee
        description: "Quantité chargée sur la semaine (movement_type='LOADING'), en unités de base. Périmètre vendable (invariant du modèle). Mesure additive."
        tests:
          - not_null

      - name: qty_retiree
        description: "Quantité retirée des machines sur la semaine (movement_type='REMOVING', ex. péremption), en valeur positive et en unités de base. Périmètre vendable. Mesure additive."
        tests:
          - not_null

      - name: nb_ventes
        description: "Nombre d'events télémétrie Nayax (= nombre de ventes, count) sur la semaine. 1 event = 1 unité vendue (telemetry_quantity = 1) → commensurable avec qty_chargee. Mesure additive."
        tests:
          - not_null

      - name: qty_invendus
        description: "Quantité de produits constatés invendus et retirés sur la semaine (task_type 11 INVENDUS, ex. péremption/casse), en unités de base. Périmètre vendable. Second canal de retrait de stock vendable, distinct de qty_retiree (pas de double comptage) ; déduit du dénominateur du taux net. Exposé à part pour le suivi de la casse/pertes. Mesure additive."
        tests:
          - not_null

      - name: nb_passages_appro
        description: "Nombre de passages approvisionneurs RÉALISÉS (is_done = FAIT/ENCOURS) sur la machine dans la semaine — contexte de réassort (combien de fois la machine a été servie). Source int_oracle_lcdp__appro_tasks_enriched (task_type 32). 1 tâche ≈ 1 visite (99% des jours = 1 tâche par machine/roadman). 0 si aucun passage. INFORMATIF : n'entre dans aucun ratio d'écoulement ; à lire à côté du taux (sur-service = beaucoup de passages + faible écoulement). Détail passage (roadman/durée/statut) dans fct_lcdp__passage_appro. Mesure additive (count)."
        tests:
          - not_null

      - name: taux_ecoulement_volume_hebdo
        description: "Ratio nb_ventes / qty_chargee sur la semaine (non additif). NULL si chargement = 0."

      - name: qty_chargee_4wk
        description: "Quantité chargée cumulée sur la fenêtre W-3 à W (4 semaines glissantes). Mesure additive."

      - name: qty_retiree_4wk
        description: "Quantité retirée cumulée sur la fenêtre W-3 à W (4 semaines glissantes). Mesure additive."

      - name: nb_ventes_4wk
        description: "Nombre d'events télémétrie cumulé sur la fenêtre W-3 à W. Mesure additive."

      - name: qty_invendus_4wk
        description: "Quantité d'invendus cumulée sur la fenêtre W-3 à W (4 semaines glissantes). Mesure additive."

      - name: taux_ecoulement_volume_4wk
        description: "Ratio nb_ventes_4wk / qty_chargee_4wk (non additif). Lisse les décalages chargement → vente."

      - name: taux_ecoulement_volume_net_4wk
        description: "Taux d'écoulement NET 4 sem. : nb_ventes_4wk / (qty_chargee_4wk − qty_retiree_4wk − qty_invendus_4wk). Déduit du dénominateur les DEUX canaux de retrait de stock vendable (retiré du chargement + invendus constatés). Mesure la part vendue du stock réellement resté disponible (ni retiré, ni invendu). NULL si (retiré + invendus) >= chargé (dénominateur <= 0, fenêtre de déstockage non interprétable)."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - device_id
              - week_start_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qty_chargee >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qty_retiree >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nb_ventes >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qty_invendus >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nb_passages_appro >= 0"

  - name: fct_lcdp__ca_mensuel
    description: |
      [QUOI MÉTIER] Chiffre d'affaires mensuel des machines LCDP télémétrées Nayax (DA FROID), consolidant le CA Nayax et le CA encaissé en espèces (machines à monnayeur). Vue revenue pure (sans marge).
      [COMMENT CONSTRUITE] Périmètre dim_lcdp__device.audit_type='1- AUDIT TELEMETRIE (NAYAX)' AND device_category='DA FROID' (machines AVEC et SANS monnayeur). CA Nayax = Σ sale_amount_net_eur (HT) / sale_amount_net_tax_eur (TTC) de int_oracle_lcdp__telemetry_tasks, agrégé au mois. CA cash = Σ ca_cash_ht_eur / ca_cash_eur de int_oracle_lcdp__comptage_tasks (pièces + billets, machines à monnayeur), au mois du comptage. FULL OUTER JOIN device × mois entre les deux flux ; CA total = Nayax + cash. has_monnayeur depuis currency_mode. Backfill depuis 2025-01-01.
      [GRAIN] 1 ligne par device_id × month_start_date (1er jour du mois).
      [NOTES] ATTRIBUTION TEMPORELLE — deux flux de CA à temporalités différentes, réconciliés par le grain mensuel. (1) CA Nayax : rattaché au MOIS EXACT de la vente (chaque event télémétrie est horodaté). (2) CA cash : rattaché au mois de la tâche REGL COMPTAGE, PAS au mois réel des ventes espèces. Un comptage relève le cash accumulé dans le monnayeur depuis le comptage précédent, à cadence IRRÉGULIÈRE (~1-2 sem) ; le CA d'un comptage couvre donc une fenêtre à cheval sur plusieurs jours/semaines, parfois deux mois. POURQUOI LE GRAIN MENSUEL : il absorbe cette irrégularité — à l'échelle du mois, le décalage de quelques jours d'un comptage en fin/début de mois reste marginal (fuite de bord faible), alors qu'un grain hebdo serait faussé par la cadence aléatoire des comptages. NE PAS descendre sous le mensuel. ca_total = CA Nayax (mois de vente) + CA cash (mois de comptage) : addition assumée malgré les temporalités légèrement différentes. Pour full Nayax (has_monnayeur=false), ca_cash_*=0 et le mois est exact. REVENUE PUR : aucun coût / marge / COGS n'est calculé ici (décision métier 2026-06-17). Le coût d'achat des chargements n'est volontairement PAS joint : son timing (mois de chargement) diffère de celui des ventes et brouillerait la lecture CA ; le suivi marge/écoulement vit dans fct_lcdp__chargement_sortie (full Nayax). Le COGS du cash serait de toute façon inconnu (produit vendu en espèces non détaillé). Pas de volume cash (pièces non comptées). Montants HT et TTC exposés. Backfill depuis 2025-01-01.
    config:
      contract:
        enforced: false
    columns:
      - name: month_start_date
        description: "Premier jour du mois (date_trunc month) de la mesure"
        tests:
          - not_null
      - name: device_id
        description: "Identifiant de la machine (FK vers dim_lcdp__device)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__device')
                field: device_id
      - name: company_id
        description: "Identifiant du client (FK vers dim_lcdp__company)"
      - name: has_monnayeur
        description: "TRUE si la machine a un monnayeur (currency_mode=AVEC MONNAIE) → CA cash présent ; FALSE = full Nayax"
      - name: nb_ventes_nayax
        description: "Nombre d'events de vente Nayax sur le mois (ventes carte/sans contact ; n'inclut pas les ventes espèces)"
      - name: ca_nayax_ht_eur
        description: "CA HT des ventes Nayax sur le mois (€)"
      - name: ca_nayax_ttc_eur
        description: "CA TTC des ventes Nayax sur le mois (€)"
      - name: ca_cash_ht_eur
        description: "CA HT encaissé en espèces (comptages du mois, €). 0 pour les machines sans monnayeur."
      - name: ca_cash_ttc_eur
        description: "CA TTC encaissé en espèces (pièces + billets des comptages du mois, €). 0 pour les machines sans monnayeur."
      - name: ca_total_ht_eur
        description: "CA HT total = ca_nayax_ht_eur + ca_cash_ht_eur (€)"
      - name: ca_total_ttc_eur
        description: "CA TTC total = ca_nayax_ttc_eur + ca_cash_ttc_eur (€)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - device_id
              - month_start_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ca_total_ht_eur >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ca_total_ttc_eur >= 0"

  - name: fct_lcdp__passage_appro
    description: |
      [QUOI MÉTIER] Passages APPRO des roadmen chez les clients LCDP, enrichis du pointage début/fin de journée du roadman.
      [COMMENT CONSTRUITE] Issu de int_oracle_lcdp__appro_tasks_enriched (tâches appro idtask_type=32 + roadman type 2 + référentiels company/device, statut ENCOURS reclassé FAIT) joint au pointage journalier dérivé de int_oracle_lcdp__pointage_tasks : date_pointage_debut = premier START_DAY ≥ 03:00 par roadman/jour, date_pointage_fin = dernier END_DAY postérieur au début le même jour.
      [GRAIN] 1 ligne par task_id (1 tâche APPRO).
      [NOTES] Périmètre restreint aux statuts PREVU / FAIT / ANOMALIE (ENCOURS déjà replié en FAIT en intermédiaire) ; ANNULE et VALIDE sont exclus au niveau de ce mart (l'intermédiaire conserve le périmètre complet). is_planned (PREVU/FAIT/ENCOURS) / is_done (FAIT/ENCOURS) / is_anomaly (ANOMALIE) : indicateurs binaires. ANOMALIE est exclu de is_planned (donc du dénominateur du taux, règle métier non figée) mais les lignes anomalie restent présentes et identifiables via is_anomaly. Taux de réalisation = sum(is_done)/sum(is_planned). pointage_missing_flag=1 si aucun début de journée trouvé pour le roadman ce jour. passage_duration_min calculée uniquement pour les passages FAIT.

    columns:
      - name: task_id
        description: Identifiant unique de la tâche de passage
        tests:
          - not_null
          - unique

      - name: device_id
        description: Identifiant de la machine concernée (FK vers dim_lcdp__device)
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__device')
                field: device_id

      - name: company_id
        description: Identifiant du client (FK vers dim_lcdp__company)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__company')
                field: company_id

      - name: resources_roadman_id
        description: Identifiant du roadman ayant effectué le passage (FK vers dim_lcdp__resource)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__resource')
                field: resources_id

      - name: product_source_id
        description: Identifiant du produit source (chargé). Polymorphe selon product_source_type ; pas de FK dim garantie.

      - name: product_destination_id
        description: Identifiant du produit destination (déchargé). Polymorphe selon product_destination_type ; pas de FK dim garantie.

      - name: company_code
        description: Code métier du client

      - name: company_name
        description: Nom du client

      - name: company_info
        description: Nom et code du client (format "Nom - Code")

      - name: device_code
        description: Code métier de la machine

      - name: device_name
        description: Nom de la machine

      - name: device_info
        description: Nom et code de la machine (format "Nom - Code")

      - name: roadman_code
        description: Code métier du roadman

      - name: roadman_name
        description: Nom du roadman

      - name: product_source_type
        description: Type du produit source (qualifie product_source_id)

      - name: product_destination_type
        description: Type du produit destination (qualifie product_destination_id)

      - name: task_location_info
        description: Informations de localisation de la tâche (access_info de la LOCATION Oracle)

      - name: task_status_code
        description: >
          Statut métier de la tâche. Les statuts ENCOURS sont reclassés FAIT après validation métier.

      - name: date_pointage_debut
        description: Début de journée du roadman (premier pointage START_DAY ≥ 03:00). NULL si absent.

      - name: date_pointage_fin
        description: Fin de journée du roadman (dernier pointage END_DAY postérieur au début, même jour). NULL si absent.


      - name: start_date_day
        description: Date de début du passage sans l'heure. Clé de rattachement au pointage journalier.

      - name: task_start_date
        description: Date et heure de début réel du passage
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= task_end_date"
                config:
                  severity: warn

      - name: task_end_date
        description: Date et heure de fin réelle du passage. NULL si passage en cours.

      - name: passage_duration_min
        description: Durée du passage en minutes (fin - début). NULL si passage non terminé.

      - name: is_planned
        description: >
          Indicateur binaire — tâche planifiée (1) si statut PREVU / FAIT / ENCOURS, sinon 0.
          ANOMALIE volontairement exclu : base du dénominateur du taux de réalisation (règle métier non figée).
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
              config:
                severity: warn

      - name: is_done
        description: Indicateur binaire indiquant si la tâche est réalisée (1, statut FAIT/ENCOURS) ou non (0)

      - name: is_anomaly
        description: Indicateur binaire indiquant si la tâche est en anomalie (1, statut ANOMALIE) ou non (0)
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
              config:
                severity: warn

      - name: pointage_missing_flag
        description: 1 = aucun début de journée (pointage) trouvé pour ce roadman ce jour-là

      - name: created_at
        description: Date de création de la tâche dans le système source

      - name: updated_at
        description: Date de dernière mise à jour de la tâche dans le système source

      - name: dbt_updated_at
        description: Horodatage de la dernière exécution du modèle dbt (trace le dernier refresh)

      - name: dbt_invocation_id
        description: Identifiant unique de l'exécution dbt

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - task_id
              - roadman_code
            config:
              severity: error


  - name: fct_lcdp__mouvement_produit
    description: >
      [QUOI MÉTIER]
      Mouvements de stock produit en machine LCDP : quantités chargées, retirées et
      constatées invendues, avec leur valorisation, au grain produit × machine × jour ×
      roadman. Répond au besoin BI « analyse produits LCDP » (chargements et invendus par
      référence produit, leur valorisation, et qui les a réalisés), sur TOUT le parc.

      [COMMENT CONSTRUITE]
      Tout le parc LCDP, sans filtre de type de machine : le périmètre (DA FROID, DA
      CHAUD, full Nayax…) se choisit en BI via la relation device_id →
      dim_lcdp__device. Seules sont écartées les tâches sans machine renseignée
      (retraits saisis au niveau du client, ~50 lignes, non rattachables). Deux flux
      agrégés au jour puis FULL OUTER JOIN sur (mouvement_date, device_id, product_id,
      roadman) : (1) chargement, depuis
      int_oracle_lcdp__chargement_tasks (task_type 13), réparti par movement_type —
      LOADING → qty_chargee, REMOVING → qty_retiree (le sens vient du SIGNE de la
      quantité, pas du label) ; (2) invendus, depuis int_oracle_lcdp__invendus_tasks
      (task_type 11, constat dédié de produits retirés car invendus). Le FULL OUTER
      JOIN est nécessaire : plus d'un tiers des constats d'invendus n'ont pas de
      chargement sur le même produit × machine × jour. Roadman = ressource PERSON de la
      tâche (la plus petite si binôme, règle des deux intermediates), exposé en
      resources_roadman_id + code/nom aplatis depuis dim_lcdp__resource. Statuts de tâche retenus :
      FAIT et VALIDE des deux côtés — le filtre est appliqué ici sur le chargement,
      dont l'intermediate remonte aussi ANNULE et ANOMALIE, pour que qty_chargee et
      qty_invendus partagent la même définition de « réalisé ». Quantités de retrait
      et d'invendus normalisées en POSITIF. Valorisation = quantité × prix d'achat
      courant de la fiche produit (dim_lcdp__product.purchase_unit_price via
      l'intermediate), méthode identique à fct_supply_chain__flux_neshu. Historique
      complet : chargements depuis 2023-12-13, invendus depuis 2024-12-11. Attributs d'affichage (device_code / device_name,
      product_code / product_name, roadman_code / roadman_name, company_code /
      company_name) aplatis
      depuis les dims parentes pour le confort BI ; les dims restent la source de
      vérité et les FK sont conservées.

      [GRAIN]
      1 ligne par product_id × device_id × mouvement_date × resources_roadman_id.
      ~357k lignes, ~620 machines. Le roadman est NULL-able (tâche sans ressource
      PERSON, ~0,15 % des lignes) et fait partie du grain.

      [NOTES]
      TROIS MESURES DE VOLUME, JAMAIS À CUMULER SANS DÉCISION MÉTIER : qty_chargee est
      une entrée ; qty_retiree et qty_invendus sont deux canaux de sortie DISTINCTS et
      sans double comptage (retrait saisi pendant le passage de chargement vs constat
      d'invendus dédié). 146 couples produit × machine × jour portent un chargement ET
      un retrait le même jour — les sommer masquerait les deux mouvements.
      AUCUN RATIO N'EST CALCULÉ ICI (taux de perte, taux d'écoulement) : une mesure non
      additive n'a pas sa place à ce grain, et la question « un retrait compte-t-il
      comme une perte ? » est un arbitrage métier — à construire en BI. Attention au
      dénominateur : certaines lignes portent des invendus avec qty_chargee = 0
      (produit chargé avant la fenêtre, ou arrivé par une machine hors périmètre).
      PAS DE QUANTITÉ VENDUE PAR PRODUIT : la télémétrie Nayax ne résout pas le produit
      (99,9 % des events portent product_id = 1 'INDEFINI'), la comparaison chargé /
      vendu n'est donc possible qu'au niveau machine — c'est ce que fait
      fct_lcdp__chargement_sortie (grain device × semaine).
      VALORISATION AU PRIX COURANT : une valorisation passée se recalcule si un tarif
      produit évolue, ce n'est pas un chiffre comptable figé. Ce sont des prix d'ACHAT —
      les tâches de chargement et d'invendus ne portent aucun prix de vente, aucune
      valorisation en manque à gagner n'est possible depuis cette source. Un prix de
      fiche aberrant se propage tel quel dans les montants (constaté : LION BROWNIE,
      code 30018, à 15,62 € contre une médiane SNACK à 0,56 €). Inversement, un produit
      sans prix de fiche sort à 0 € et non à NULL : 12 lignes / 28 unités sont ainsi
      valorisées à 0 (produit 40048 SDW POULET OEUF, et le produit technique INDEFINI)
      — les quantités restent justes, les montants sont minorés d'autant.
      ROADMAN : chargement et invendus sont deux tâches distinctes, chacune avec son
      roadman ; sur un même passage c'est la même personne dans 99,4 % des cas, donc la
      même ligne. Quand deux personnes interviennent le même jour sur le même produit ×
      machine, chacune a sa ligne (~30 cas) : un slicer roadman filtre ainsi les trois
      mesures de façon cohérente. Roadman OBSERVÉ (qui a fait la tâche), à ne pas
      confondre avec le roadman AFFECTÉ à la machine (dim_lcdp__device). En binôme, seul
      le plus petit idresources est retenu.
      PÉRIMÈTRE EN BI : aucun filtre machine ici — un visuel sans filtre additionne DA
      FROID, DA CHAUD, SEMI-AUTO… Filtrer chaque page sur dim_lcdp__device. Le filtre
      porte sur l'état COURANT de la machine (une machine requalifiée déplace tout son
      historique). ~6 machines n'ont pas de catégorie dans l'ERP (label CATMACH manquant,
      ex. M8058 POINT P CANEJAN) et tombent en « (vide) » : exclues sans bruit d'une page
      filtrée sur une catégorie. Le taux d'écoulement (comparaison aux ventes) reste
      dans fct_lcdp__chargement_sortie, limité au full Nayax. Le filtre « produits
      vendables » de chargement_sortie n'est PAS repris : à filtrer en BI via
      dim_lcdp__product.product_group si besoin.
      CONVENTION MESURES : qty_ = quantité physique en unités de base ; montant_*_eur =
      valorisation au prix d'achat courant.
    columns:
      - name: mouvement_date
        description: "Jour du mouvement (date de réalisation de la tâche, real_start_date). Colonne de partitionnement."
        tests:
          - not_null

      - name: device_id
        description: "Identifiant de la machine (FK vers dim_lcdp__device)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__device')
                field: device_id
              config:
                severity: warn

      - name: product_id
        description: "Identifiant du produit (FK vers dim_lcdp__product)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__product')
                field: product_id
              config:
                severity: warn

      - name: resources_roadman_id
        description: "Roadman ayant réalisé la tâche (chargement ou constat d'invendus) — FK vers dim_lcdp__resource. Fait partie du grain. NULL si la tâche ne porte aucune ressource PERSON (~0,15 % des lignes). En binôme, le plus petit idresources."
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__resource')
                field: resources_id
              config:
                severity: warn

      - name: company_id
        description: "Identifiant du client servi au moment de la tâche (FK vers dim_lcdp__company). Porté par la tâche (company_peer), pas par la machine : une machine peut changer de client dans le temps."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lcdp__company')
                field: company_id
              config:
                severity: warn

      - name: device_code
        description: "Code de la machine — attribut d'affichage aplati depuis dim_lcdp__device."

      - name: device_name
        description: "Libellé de la machine — attribut d'affichage aplati depuis dim_lcdp__device."

      - name: product_code
        description: "Code du produit — attribut d'affichage aplati depuis dim_lcdp__product."

      - name: product_name
        description: "Libellé du produit — attribut d'affichage aplati depuis dim_lcdp__product."

      - name: roadman_code
        description: "Code du roadman — attribut d'affichage aplati depuis dim_lcdp__resource."

      - name: roadman_name
        description: "Nom du roadman — attribut d'affichage aplati depuis dim_lcdp__resource."

      - name: company_code
        description: "Code du client servi au moment de la tâche — attribut d'affichage aplati depuis dim_lcdp__company. À ne pas confondre avec le client courant de la machine, aplati sur dim_lcdp__device."

      - name: company_name
        description: "Libellé du client servi au moment de la tâche — attribut d'affichage aplati depuis dim_lcdp__company."

      - name: qty_chargee
        description: "Quantité chargée en machine sur le jour (movement_type='LOADING'), en unités de base. Mesure additive."
        tests:
          - not_null

      - name: qty_retiree
        description: "Quantité retirée de la machine pendant le passage de chargement (movement_type='REMOVING', saisie en négatif à la source), exprimée en POSITIF, en unités de base. Canal de sortie distinct de qty_invendus, sans double comptage. Mesure additive."
        tests:
          - not_null

      - name: qty_invendus
        description: "Quantité constatée invendue et retirée sur le jour (task_type 11 INVENDUS : péremption / casse), en unités de base. Constat dédié, distinct de qty_retiree. ATTENTION : seules 20 à 80 machines par mois déclarent des invendus — un volume par produit est exploitable, un TAUX rapporté à tout le parc serait trompeur. Mesure additive."
        tests:
          - not_null

      - name: montant_charge_eur
        description: "Valorisation de qty_chargee au prix d'achat courant de la fiche produit, en euros. Mesure additive."
        tests:
          - not_null

      - name: montant_retire_eur
        description: "Valorisation de qty_retiree au prix d'achat courant de la fiche produit, en euros (valeur positive). Mesure additive."
        tests:
          - not_null

      - name: montant_invendus_eur
        description: "Valorisation de qty_invendus au prix d'achat courant de la fiche produit, en euros — coût d'achat des pertes constatées, pas un manque à gagner. Mesure additive."
        tests:
          - not_null

      - name: updated_at
        description: "Date de dernière modification la plus récente parmi les tâches agrégées sur la ligne (chargement et invendus confondus)."

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mouvement_date
              - device_id
              - product_id
              - resources_roadman_id
          config:
            severity: error
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qty_retiree >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qty_invendus >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qty_chargee != 0 or qty_retiree != 0 or qty_invendus != 0"
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 50000
            max_value: 1000000
          config:
            severity: warn

  - name: fct_lcdp__appel_sav
    description: >
      [QUOI MÉTIER]
      Appels SAV reçus par LCDP (demandes client : approvisionnement, technique, commande,
      commerce…), avec leur catégorisation saisie dans l'ERP, le client, la machine et la
      personne à qui l'appel est affecté.

      [COMMENT CONSTRUITE]
      Issu de int_oracle_lcdp__appel_sav_tasks (tâches idtask_type 130, enregistrements actifs,
      labels catégorie FAPP01 / sous-catégorie SAPPxx / détail pivotés avec leurs libellés fr_FR).
      Code et nom de la ressource aplatis depuis dim_lcdp__resource. Aucune catégorisation n'est
      recalculée : seules les valeurs saisies dans l'ERP sont exposées.

      [GRAIN]
      1 ligne par task_id (1 appel SAV). ~340 lignes, surtout depuis juillet 2026.

      [NOTES]
      appel_date = date(appel_start_at) sans conversion de fuseau : l'ERP stocke l'heure locale
      (Paris) étiquetée UTC ; l'heure affichée correspond à celle des exports ERP.
      resources_id est NULL quand aucune personne n'est affectée à l'appel (~25 %). L'écran ERP
      affiche alors un libellé dérivé de la catégorie (TECHNIQUE, MAGASIN, COMMERCE…) : ce n'est
      pas une donnée en base, il n'est pas reproduit ici — la catégorie porte l'information.
      device_id est NULL pour les appels sans machine (commande, RH, commerce…).
      Un appel peut porter plusieurs sous-catégories : concaténées avec ' / ' (cf. intermediate).
      Les colonnes de l'Excel de suivi calculées par mots-clés sur le commentaire (catégorie appro,
      type technique) ne sont volontairement pas reproduites.
      appel_end_at est aujourd'hui toujours égale à appel_start_at : l'ERP n'enregistre pas de durée
      d'appel. Colonne conservée pour le jour où la fin sera saisie.
      Les 5 appels antérieurs à juillet 2026 (ASAV2 à ASAV6, sans catégorie) sont gardés : ce sont
      des saisies ERP réelles ; leur suppression éventuelle se fait dans l'ERP.
    columns:
      - name: appel_date
        description: "Date de l'appel (date de appel_start_at, heure locale)."
        tests:
          - not_null
      - name: task_id
        description: "Identifiant de l'appel (tâche Oracle LCDP). PK."
        tests:
          - unique
          - not_null
      - name: company_id
        description: "Client ayant appelé. FK → dim_lcdp__company. NULL si aucun tiers saisi."
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__company')
                field: company_id
              config:
                severity: warn
      - name: device_id
        description: "Machine concernée. FK → dim_lcdp__device. NULL si l'appel ne porte pas sur une machine."
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__device')
                field: device_id
              config:
                severity: warn
      - name: resources_id
        description: "Personne à qui l'appel est affecté (approvisionneur, technicien, magasin…). FK → dim_lcdp__resource. NULL si non affecté."
        tests:
          - relationships:
              arguments:
                to: ref('dim_lcdp__resource')
                field: resources_id
              config:
                severity: warn
      - name: appel_numero
        description: "N° de pièce de l'appel dans l'ERP (ex. ASAV280), colonne « N°Pièce » des exports."
        tests:
          - unique
          - not_null
      - name: appel_start_at
        description: "Date et heure de début de l'appel (heure locale, cf. [NOTES])."
        tests:
          - not_null
      - name: appel_end_at
        description: "Date et heure de fin de l'appel. Aujourd'hui toujours égale à appel_start_at (cf. [NOTES])."
      - name: company_code
        description: "Code du client (aplati depuis company)."
      - name: company_name
        description: "Nom du client (aplati depuis company)."
      - name: device_code
        description: "Code de la machine, ex. M6657 (aplati depuis device)."
      - name: device_name
        description: "Nom / modèle de la machine (aplati depuis device)."
      - name: resources_code
        description: "Code de la ressource affectée, ex. APPRO08 (aplati depuis dim_lcdp__resource)."
      - name: resources_name
        description: "Nom de la ressource affectée (aplati depuis dim_lcdp__resource)."
      - name: appel_categorie_code
        description: "Code de la catégorie d'appel (label FAPP01), APP01…APP09. NULL si non catégorisé."
        tests:
          - accepted_values:
              arguments:
                values: ['APP01', 'APP02', 'APP03', 'APP04', 'APP05', 'APP06', 'APP07', 'APP08', 'APP09']
      - name: appel_categorie_label
        description: "Libellé de la catégorie, préfixé de son numéro (ex. 07 TECHNIQUE, 08 APPROVISIONNEMENT)."
      - name: appel_sous_categorie_code
        description: "Code de la famille de sous-catégorie (SAPPxx). Concaténé avec ' / ' si plusieurs."
      - name: appel_sous_categorie_label
        description: "Libellé de la sous-catégorie (ex. PANNES, VIDE, AUTRE). Concaténé avec ' / ' si plusieurs."
      - name: appel_detail_label
        description: "Libellé du détail choisi dans la sous-catégorie (ex. NAYAX sous PANNES, VIDE LAIT sous VIDE)."
      - name: task_status_code
        description: "Statut de l'appel dans l'ERP : VALIDE (traité) ou PREVU."
        tests:
          - accepted_values:
              arguments:
                values: ['VALIDE', 'PREVU']
      - name: comments_self
        description: "Commentaire interne saisi sur l'appel (colonne « Commentaire » des exports ERP)."
      - name: comments_peer
        description: "Commentaire côté client / partenaire. Rarement renseigné."
      - name: created_at
        description: "Date de création de la tâche dans l'ERP."
      - name: updated_at
        description: "Date de dernière modification de la tâche dans l'ERP."
      - name: extracted_at
        description: "Date d'extraction de la ligne source."
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 100
            max_value: 50000
          config:
            severity: warn
