# models/_nesp_co__sources.yml
version: 2

sources:
  - name: nesp_co
    database: "{{ var('raw_project') }}"
    schema: "prod_raw"
    description: >
      Exports commerciaux Nespresso (CRM C4C), en classeurs Excel. Activités et opportunités :
      reçues chaque jour par mail, relevées et déposées sur le SFTP EVS par le pipeline dlt
      `nesp_co` (dépôt ingestion), puis chargées. Base clients : classeur déposé sur le SFTP
      EVS, chargé par le pipeline `nesp_client`, déclenché à la main.
    config:
      tags: ['nesp_co', 'source']
    tables:
      - name: nesp_co_activite
        description: >
          Activités commerciales Nespresso. Chaque journée (`snapshot_date`) est un export
          complet, et la table les empile. Clé d'une ligne dans une journée :
          (`activity_id`, `activity_type`).
        tests:
          # Le staging ne garde qu'une version par clé : un doublon dans une journée y serait
          # écarté sans bruit. Ce test est le seul à le montrer.
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - snapshot_date
                  - activity_id
                  - activity_type
        columns:
          - name: employee_responsible
            description: "Identifiant de l'employé responsable"
          - name: activity_id
            description: >
              Numéro de l'activité dans C4C. C4C numérote à part les appels et les rendez-vous :
              un même numéro peut désigner les deux, sans rapport entre eux.
          - name: unnamed_1
            description: "Id C4C du commercial"
          - name: activity_type
            description: "Type d'activité commerciale (Phone call, appointment, etc.)"
          - name: phone_call
            description: "Description de l'appel téléphonique si activity_type = Phone call"
          - name: created_by_phone_call
            description: "Identifiant du commercial responsable de l'appel téléphonique"
          - name: unnamed_5
            description: "Colonne inutile ignorée"
          - name: appointment
            description: "Description du rendez-vous si activity_type = appointment"
          - name: created_by_appointment
            description: "Identifiant du commercial responsable du rendez-vous"          
          - name: activity_category
            description: "Catégorie de l'activité commerciale"
          - name: week_calendar_year
            description: >
              Semaine de l'année, en texte. Le format des dates varie selon les exports
              (`JJ.MM.AAAA` ou `MM/JJ/AAAA`) : colonne non lue par dbt.
          - name: calendar_month
            description: "Mois du calendrier en format texte"
          - name: main_account
            description: "Nom du compte"
          - name: unnamed_12
            description: "ID C4C du nom du compte lié a main_account"
          - name: category
            description: "Catégorie du compte"
          - name: industry
            description: "Secteur d'activité du compte"
          - name: sales_potential
            description: "(COLONNE INUTILE) Potentiel de vente du compte"
          - name: role 
            description: "Prospect / Client"
          - name: nessoft_id_main_account 
            description: "Identifiant Nessoft du compte principal"
          - name: activity_unit
            description: "Unité de l'activité commerciale"
          - name: activity_life_cycle_status
            description: "Statut du cycle de vie de l'activité commerciale"
          - name: campaign_id_preceding_lead
            description: "Identifiant de la campagne précédant le lead"
          - name: unnamed_22
            description: "ID C4C de la campagne"
          - name: start_date_phone_call
            description: "Date de l'appel téléphonique"
          - name: start_date_appointment
            description: "Date du rendez-vous"
          - name: start_date_task
            description: "Date de la tâche"
          - name: notes
            description: "Notes supplémentaires sur l'activité commerciale"
          - name: _extracted_at
            description: >
              Date et heure du chargement. Un rattrapage charge plusieurs journées sous la même
              valeur : pour ordonner les versions d'une ligne, lire `snapshot_date`.
          - name: _fichier
            description: "Nom du fichier source d'où proviennent les données"
          - name: snapshot_date
            description: "Journée de l'export, lue dans le nom du classeur."

      - name: nesp_co_opportunite
        description: >
          Opportunités commerciales Nespresso. Chaque journée (`snapshot_date`) est un export
          complet, et la table les empile. Clé d'une ligne dans une journée : `opportunity`,
          hors lignes de sous-total `Result`.
        tests:
          # Le staging ne garde qu'une version par clé : un doublon dans une journée y serait
          # écarté sans bruit. Ce test est le seul à le montrer.
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - snapshot_date
                  - opportunity
              config:
                where: "opportunity != 'Result'"
        columns:
          - name: opportunity
            description: "Identifiant de l'opportunité commerciale, ou `Result` sur une ligne de sous-total"
          - name: employee_responsible
            description: "Nom de l'employé responsable"
          - name: employee_responsible_id
            description: "Identifiant de l'employé responsable"
          - name: unnamed_2
            description: "ID C4C du commercial"
          - name: created_by
            description: "Nom du créateur de l'opportunité"
          - name: unnamed_4
            description: "ID C4C du créateur de l'opportunité" 
          - name: unnamed_6
            description: "Nom de l'opportunite"
          - name: campaign
            description: "Nom de la campagne associée à l'opportunité"
          - name: unnamed_8
            description: "ID C4C de la campagne"
          - name: created_on
            description: "Date de création de l'opportunité"
          - name: source
            description: "Source de l'opportunité"
          - name: unnamed_11
            description: "Colonne inutile ignorée"
          - name: account
            description: "Nom du compte associé à l'opportunité"
          - name: unnamed_13
            description: "ID C4C du compte"
          - name: reason_for_status
            description: "Raison du statut de l'opportunité"
          - name: close_date
            description: "Date de clôture de l'opportunité"
          - name: calendar_month
            description: "Mois du calendrier en format texte"
          - name: calendar_year
            description: "Année du calendrier"
          - name: nessoft_id
            description: "Identifiant Nessoft du compte"
          - name: sales_unit
            description: "Unité de vente associée à l'opportunité"
          - name: role_account
            description: "Rôle du compte (Prospect / Client)"
          - name: lifecycle_status
            description: "Statut du cycle de vie de l'opportunité"
          - name: first_coffee_order
            description: "Nombre de capsules de la première commande de café"
          - name: expected_value
            description: "Valeur attendue de l'opportunité"
          - name: zeq_zenius_equivalent
            description: "Équivalent Zenius de l'opportunité"
          - name: chance_of_success
            description: "Chance de succès de l'opportunité en pourcentage"
          - name: days_in_sales_phase
            description: "Nombre de jours dans la phase de vente actuelle"
          - name: number_of_opportunities
            description: "Nombre d'opp"
          - name: machines
            description: "Nombre de machines associées à l'opportunité"
          - name: _extracted_at
            description: >
              Date et heure du chargement. Un rattrapage charge plusieurs journées sous la même
              valeur : pour ordonner les versions d'une ligne, lire `snapshot_date`.
          - name: _fichier
            description: "Nom du fichier source d'où proviennent les données"
          - name: snapshot_date
            description: "Journée de l'export, lue dans le nom du classeur."

      - name: nespresso_base_client
        description: "Table des bases clients Nespresso EVS importé depuis le SFTP EVS du fichier Base - Clients"
        # Freshness: tier Manuel — 60j warn / 90j error
        # Livraison manuelle uniquement (pipeline-sftp-evs-nesp-client). Cf. docs/freshness.md
        config:
          # `_extracted_at` est rempli par dlt : le test de fraîcheur peut se déclencher.
          loaded_at_field: _extracted_at
          freshness:
            warn_after: {count: 60, period: day}
            error_after: {count: 90, period: day}
        columns:
          - name: third
            description: "Identifiant unique du client."
          # Colonnes texte
          - name: third_name
            description: "Nom du client."
          - name: third_adr_ln1
            description: "Adresse du client - ligne 1."
          - name: third_adr_ln2
            description: "Adresse du client - ligne 2."
          - name: third_post_code
            description: "Code postal du client."
          - name: third_city
            description: "Ville du client."
          - name: third_status_descr
            description: "Description du statut du client."
          - name: segmentation_hypercare
            description: "Segmentation du client (SMALL MEDIUM GET)"
          - name: categorie_client
            description: "Catégorie du client."
          - name: region
            description: "Région du client."