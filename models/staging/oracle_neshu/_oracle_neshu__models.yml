# models/staging/_oracle_neshu__models.yml
version: 2

models:
  # COMPANY
  - name: stg_oracle_neshu__company
    description: "Clients transformés et nettoyés depuis la base Oracle"
    tests:
      # dbt_expectations: alerte si le nombre de lignes sort de la plage attendue
      # (detecte les loads vides ou les duplications massives)
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 100
            max_value: 100000
    columns:
      - name: idcompany
        description: "Identifiant unique de l'entreprise"
        tests:
          - unique
          - not_null
      - name: company_idcompany
        description: "Link to IDCOMPANY"
      - name: idcompany_type
        description: "Link to COMPANY_TYPE"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company_type')
                field: idcompany_type
      - name: created_at
        description: "Date creation de la ligne"
      - name: updated_at
        description: "Date de modification de la ligne"
      - name: extracted_at
        description: "Date d'extraction depuis la source"

  # COMPANY_HAS_LOCATION
  - name: stg_oracle_neshu__company_has_location
    description: "Association entre les entreprises et les localisations"
    columns:
      - name: idlocation
        description: "Identifiant de la localisation"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__location')
                field: idlocation
      - name: idcompany
        description: "Identifiant de l'entreprise"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: idlocation_type
        description: "Type de localisation (ex: siège, agence)"
        tests:
          - not_null

  - name: stg_oracle_neshu__company_type
    description: "Types d'entreprises transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idcompany_type
        tests:
          - unique
          - not_null
        description: "Identifiant unique du type l'entreprise"
      - name: code
        description: "Code type entreprise"

  # CONTACT
  - name: stg_oracle_neshu__contact
    description: "Contacts transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idcontact
        tests:
          - unique
          - not_null
        description: "Identifiant unique du contact"
      - name: idcompany
        description: "Link to IDCOMPANY"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany

  # CONTACT_HAS_DEVICE
  - name: stg_oracle_neshu__contact_has_device
    description: >
      Rattachement d'une machine au membre du personnel interne qui en a la charge
      (approvisionneur / technicien). Grain : 1 ligne par couple contact × device.
      Le contact se raccroche à une ressource via son `code` (aucune FK idresources
      dans la source).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idcontact
              - iddevice
    columns:
      - name: idcontact
        description: "Identifiant du contact (personnel interne — code aligné sur resources.code)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__contact')
                field: idcontact
      - name: iddevice
        description: "Identifiant du device rattaché"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__device')
                field: iddevice
      - name: extracted_at
        description: "Date d'extraction de la ligne"

  # CONTRACT
  - name: stg_oracle_neshu__contract
    description: "Contrats transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idcontract
        tests:
          - unique
          - not_null
        description: "Identifiant unique du contrat"
      - name: idcompany_peer
        description: "Link to IDCOMPANY for peer"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: idcontract_type
        description: "ATTENTION : link to LABEL from label_family.code = CONTRACT_TYPE" 
      - name: code
        description: "code du contrat"
      - name: name
        description: "nom du contrat"
      - name: engagement_raw
        description: "Engagement conso brut sans nettoyage (ex: '45 000', '2000', 'AUCUN', '0')"
      - name: engagement_clean
        description: "Engagement conso nettoyé en entier (ex: 45000, 2000, 0)"
      - name: nombre_collab
        description: "Nombre de collaborateurs, transformation en entier"
      - name: ORIGINAL_START_DATE
        description: "Date de debut original du contrat"
      - name: ORIGINAL_END_DATE
        description: "Date de fin original du contrat"
      - name: CURRENT_END_DATE
        description: "Date de fin courant du contrat"

  # DEVICE
  - name: stg_oracle_neshu__device
    description: "Devices transformés et nettoyés depuis la base Oracle"
    columns:
      - name: iddevice
        tests:
          - unique
          - not_null
        description: "Identifiant unique du device"
      - name: device_iddevice
        description: "Lien vers la machine parents/enfant => si pas d'id alors pas de machine parent"
      - name: idlocation
        description: "Link to LOCATION"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__location')
                field: idlocation
      - name: idcompany_customer
        description: "Link to IDCOMPANY for customer"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: idcompany_supplier
        description: "Link to IDCOMPANY for supplier"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: idcompany_owner
        description: "Link to IDCOMPANY for owner"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: code
        description: "Code device (Numéro de serie AS/MA)"
      - name: name
        description: "Nom device"

  # LABEL
  - name: stg_oracle_neshu__label
    description: "Labels transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idlabel
        description: "Identifiant de la statut de la tâche"
        tests:
          - unique
          - not_null
      - name: idlabel_family
        description: "Link to LABEL_FAMILY"

  - name: stg_oracle_neshu__label_family
    description: "Familles de labels transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idlabel_family
        description: "Identifiant de la famille de labels"
        tests:
          - unique
          - not_null
      - name: code
        description: "Code de la famille de labels"

  # LABEL_HAS_COMPANY
  - name: stg_oracle_neshu__label_has_company
    description: "Association entre les labels et les entreprises"
    columns:
      - name: idlabel
        description: "Identifiant du label"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__label')
                field: idlabel
      - name: idcompany
        description: "Identifiant de l'entreprise"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany

  - name: stg_oracle_neshu__label_has_contract
    description: "Association entre les labels et les contrats"
    columns:
      - name: idlabel
        description: "Identifiant du label"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__label')
                field: idlabel
      - name: idcontract
        description: "Identifiant du contract"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__contract')
                field: idcontract

  - name: stg_oracle_neshu__label_has_device
    description: "Association entre les labels et les devices"
    columns:
      - name: idlabel
        description: "Identifiant du label"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__label')
                field: idlabel
      - name: iddevice
        description: "Identifiant du device"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__device')
                field: iddevice

  - name: stg_oracle_neshu__label_has_product
    description: "Association entre les labels et les produits"
    columns:
      - name: idlabel
        description: "Identifiant du label"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__label')
                field: idlabel

      - name: idproduct
        description: "Identifiant du produit"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__product')
                field: idproduct

  - name: stg_oracle_neshu__label_has_resources
    description: "Association entre les labels et les ressources"
    columns:
      - name: idlabel
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__label')
                field: idlabel
        description: "Identifiant du label"
      - name: idresources
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__resources')
                field: idresources
        description: "Identifiant du resources"

  - name: stg_oracle_neshu__label_has_task
    columns:
      - name: idlabel
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__label')
                field: idlabel
        description: "Identifiant du label"
      - name: idtask
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task')
                field: idtask
        description: "Identifiant du task"


  # LOCATION
  - name: stg_oracle_neshu__location
    description: "Locations transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idlocation
        tests:
          - unique
          - not_null
        description: "Identifiant du location"
      - name: name
        description: "Nom de la localisation"

  # PRODUCT
  - name: stg_oracle_neshu__product
    description: "Produits transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idproduct
        tests:
          - unique
          - not_null
        description: "Identifiant unique du produit"
      - name: idproduct_type
        description: "Link to PRODUCT_TYPE"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__product_type')
                field: idproduct_type
      - name: code
        description: "Code produit"
      - name: name
        description: "Nom produit"
      - name: purchase_unit_price
        description: "Prix d'achat unitaire"
      - name: stock_management
        description: "1 = article géré en stock, 0 = non stocké (badges, crédits de badge…)"

  - name: stg_oracle_neshu__product_unit
    description: "Unités de conditionnement par produit depuis Oracle. idunit_type=1 = unité d'achat (conditionnement de commande fournisseur) ; coeff_multi = nb d'unités de base par conditionnement."
    columns:
      - name: idproduct_unit
        description: "Identifiant unique de l'unité de conditionnement"
        tests:
          - unique
          - not_null
      - name: idproduct
        description: "Identifiant du produit (FK vers stg_oracle_neshu__product)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__product')
                field: idproduct
              config:
                severity: warn
      - name: idunit_type
        description: "Type d'unité, référentiel UNIT_TYPE vérifié à la source Oracle : 1=ACHAT (PURCHASE), 2=VENTE (SALE), 3=STOCK (STORAGE), 4=COMPOSITION (COMPONENTS), 5=REAPPRO (RESUPPLY), 6=WEB"
      - name: code
        description: "Code de l'unité (ex. CARTON300, POCHE)"
      - name: coeff_multi
        description: "Nombre d'unités de base par conditionnement (multiplicateur)"
      - name: coeff_div
        description: "Coefficient diviseur vers l'unité de base"
      - name: base_unit
        description: "Flag unité de base (1 = unité de base du produit)"
      - name: isactive
        description: "Flag unité active (1 = active)"

  - name: stg_oracle_neshu__product_type
    description: "Types de produits transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idproduct_type
        tests:
          - unique
          - not_null
        description: "Identifiant unique du type de produit"
      - name: code
        description: "Code type produit"

  # RESOURCES
  - name: stg_oracle_neshu__resources
    description: "Ressources transformées et nettoyées depuis la base Oracle"
    columns:
      - name: idresources
        tests:
          - unique
          - not_null
        description: "Identifiant unique de la resources"
      - name: idcompany
        description: "Link to COMPANY"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: idlocation
        description: "Link to LOCATION"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__location')
                field: idlocation
      - name: RESOURCES_IDRESOURCES
        description: "Link to RESOURCES peer"
      - name: idresources_type
        description: "Link to RESOURCES_TYPE"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__resources_type')
                field: idresources_type
      - name: code
        description: "Code resource"
      - name: name
        description: "Nom resource"

  - name: stg_oracle_neshu__resources_type
    description: "Types de ressources transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idresources_type
        tests:
          - unique
          - not_null
        description: "Identifiant unique du type la resources"
      - name: code
        description: "Code type resource"

  # TASK
  - name: stg_oracle_neshu__task
    description: "TASK transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idtask
        description: "Identifiant unique de la tâche"
        tests:
          - unique
          - not_null
      - name: idcompany_peer
        description: "Référence vers l'entreprise propriétaire"
        tests:  
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: idtask_type
        description: "link to TASK_TYPE"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task_type')
                field: idtask_type
      - name: idtask_status
        description: "link to TASK_STATUS"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task_status')
                field: idtask_status
      - name: iddevice
        description: "Link to DEVICE"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__device')
                field: iddevice
      - name: idcontact
        description: "Link to CONTACT"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__contact')
                field: idcontact
      - name: idlocation
        description: "Link to LOCATION"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__location')
                field: idlocation
      - name: IDPRODUCT_SOURCE
        description: "ID de la source (IDDEVICE/IDCOMPANY etc)"
      - name: IDPRODUCT_DESTINATION
        description: "ID de la destination (IDDEVICE/IDCOMPANY etc)"
      - name: TYPE_PRODUCT_SOURCE
        description: "nom de la table de la source (DEVICE / COMPANY etc)"
      - name: TYPE_PRODUCT_DESTINATION
        description: "nom de la table de la destination (DEVICE / COMPANY etc)"
      - name: code_status_record
        description: "Code status de la tâche ( 1 = validé, 0 ou -1 = non validé)"
      - name: real_start_date
        description: "date demarrage de la tache"
      - name: real_end_date
        description: "date de fin de la tache"

  - name: stg_oracle_neshu__task_has_product
    description: "Task_has_product transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idtask_has_product
        description: "Identifiant unique de la tâche associée au produit"
        tests:
          - unique
          - not_null
      - name: idtask
        description: "link to task"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task')
                field: idtask
      - name: idproduct
        description: "ID du produit"
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__product')
                field: idproduct
      - name: idcompany_peer
        description: "Référence vers l'entreprise propriétaire"
        tests:  
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__company')
                field: idcompany
      - name: IDPRODUCT_SOURCE
        description: "ID de la source (IDDEVICE/IDCOMPANY etc)"
      - name: IDPRODUCT_DESTINATION
        description: "ID de la destination (IDDEVICE/IDCOMPANY etc)"
      - name: TYPE_PRODUCT_SOURCE
        description: "nom de la table de la source (DEVICE / COMPANY etc)"
      - name: TYPE_PRODUCT_DESTINATION
        description: "nom de la table de la destination (DEVICE / COMPANY etc)"
      - name: REAL_QUANTITY
        description: "Quantité réel produit"
      - name: NET_PRICE
        description: "sale unit price net without tax"
      - name: SALE_UNIT_PRICE
        description: "sale unit price brut without tax"
      - name: PURCHASE_UNIT_PRICE
        description: "product purchase unit price net without tax"

  - name: stg_oracle_neshu__task_has_resources
    description: "Association entre les tâches et les ressources"
    columns:
      - name: idtask
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task')
                field: idtask
        description: "Identifiant de la tâche"
      - name: idresources
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__resources')
                field: idresources
        description: "Identifiant de la resources"

  - name: stg_oracle_neshu__task_status
    description: "Statuts des tâches transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idtask_status
        tests:
          - unique
          - not_null
        description: "Identifiant de la statut de la tâche"
      - name: code
        description: "Code status"

  - name: stg_oracle_neshu__task_type
    description: "Types de tâches transformés et nettoyés depuis la base Oracle"
    columns:
      - name: idtask_type
        tests:
          - unique 
          - not_null
        description: "Identifiant unique du type de tâche"
  - name: stg_oracle_neshu__task_has_amount
    description: "Montants et taxes par tâche, nettoyés depuis la base Oracle. Porte le coût des produits chargés du P&L client."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idtask
              - tax_rate
              - idtax
              - idtax_region
    columns:
      - name: idtask
        description: "Identifiant de la tâche - composante de la clé"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task')
                field: idtask
      - name: tax_rate
        description: "Taux de taxe - composante de la clé, gardé en NUMERIC exact"
        tests:
          - not_null
      - name: idtax
        description: "Identifiant de la taxe - composante de la clé"
        tests:
          - not_null
      - name: idtax_region
        description: "Identifiant de la région de taxe - composante de la clé"
        tests:
          - not_null
      - name: amount_without_tax
        description: "Montant HT de la ligne - base du coût des produits chargés"
      - name: updated_at
        description: "Curseur emprunté au parent task : la table n'a pas de date propre"
        tests:
          - not_null

  - name: stg_oracle_neshu__label_has_thp
    description: "Labels par ligne de produit d'une tâche, nettoyés depuis la base Oracle. Porte le mode de paiement des ventes télémétrie."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idlabel
              - idtask_has_product
    columns:
      - name: idlabel
        description: "Identifiant du label - composante de la clé"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__label')
                field: idlabel
      - name: idtask_has_product
        description: "Identifiant de la ligne de produit - composante de la clé"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task_has_product')
                field: idtask_has_product
      - name: updated_at
        description: "Curseur emprunté au parent task_has_product : la table n'a pas de date propre"
        tests:
          - not_null

  - name: stg_oracle_neshu__task_type_has_config
    description: "Paramétrage par type de tâche, nettoyé depuis la base Oracle. Porte le coefficient de signe du CA."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idtask_type
              - idconfig
    columns:
      - name: idtask_type
        description: "Identifiant du type de tâche - composante de la clé"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task_type')
                field: idtask_type
      - name: idconfig
        description: "Nom du paramètre - composante de la clé"
        tests:
          - not_null
      - name: value
        description: "Valeur du paramètre, en texte. Pour idconfig='coefficient' : 1 sur FACT CLIENT, -1 sur AVOIR"

  - name: stg_oracle_neshu__string
    description: "Libellés traduits de l'ERP, nettoyés depuis la base Oracle. Résout les idstring en texte lisible."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idstring
              - langage_code
    columns:
      - name: idstring
        description: "Identifiant du libellé - composante de la clé"
        tests:
          - not_null
      - name: langage_code
        description: "Code langue - composante de la clé (fr_FR, en_US, ...)"
        tests:
          - not_null
      - name: text
        description: "Le libellé traduit, à lire avec langage_code = 'fr_FR'"

  - name: stg_oracle_neshu__task_historic
    description: "Historique des actions sur les tâches, nettoyé depuis la base Oracle : une ligne par action (création, changement de statut, de date, de produits, synchro EasyMobile, traitement par lot, suppression), avec la tâche telle qu'elle est après l'action. Ni clé ni déduplication : la source écrit des doublons exacts légitimes, regroupés en intermediate. Ajout seul : une ligne que l'ERP purge reste ici."
    columns:
      - name: idtask
        description: "Tâche concernée. Pas de test relationships vers stg_oracle_neshu__task : l'historique d'une tâche supprimée est conservé. NULL sur des synchros EasyMobile dont l'ERP porte un IDTASK corrompu (octets nuls)."
        tests:
          - not_null:
              config:
                where: "idhistoric_action not in (129, 130, 131)"
      - name: idhistoric_action
        description: "Action. FK → stg_oracle_neshu__historic_action."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__historic_action')
                field: idhistoric_action
              config:
                severity: warn
      - name: idtask_status
        description: "Statut de la tâche APRÈS l'action → stg_oracle_neshu__task_status. Des lignes anciennes portent des valeurs hors référentiel, d'où l'absence de test relationships."
      - name: idtask_type
        description: "Type de la tâche. FK → stg_oracle_neshu__task_type. NULL sur les lignes de synchro EasyMobile."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_neshu__task_type')
                field: idtask_type
              config:
                severity: warn
      - name: idtask_source
        description: "Tâche liée : l'origine pour un clonage, une transformation ou une création planifiée ; la CIBLE pour l'action TRANSFORM_TO."
      - name: iduser
        description: "Compte ERP auteur de l'action (table ihm_user, non répliquée)."
      - name: idtreatment_by_batch
        description: "Traitement par lot à l'origine de l'action. FK → stg_oracle_neshu__treatment_by_batch."
        tests:
          - relationships:
              arguments:
