version: 2

models:
  - name: stg_oracle_lcdp_gcs__stock_theorique
    description: >
      Stock théorique LCDP, une photo par jour et par couple entité/article.
      Chargé par le pipeline dlt `oracle_lcdp_stock` (dépôt ingestion) depuis Oracle.
      Les colonnes sont typées, et les deux horloges Oracle — nues côté
      source — sont déclarées en Europe/Paris.
    tests:
      # Freshness fallback (tier Standard — extract quotidien 23:15 Paris, gap typique
      # observé 23-24h ; cf. docs/freshness.md)
      - dbt_expectations.expect_row_values_to_have_recent_data:
          arguments:
            column_name: extracted_at
            datepart: hour
            interval: 26
          config:
            severity: warn
      - dbt_expectations.expect_row_values_to_have_recent_data:
          arguments:
            column_name: extracted_at
            datepart: hour
            interval: 48
          config:
            severity: error
    columns:
      - name: id_entity
        description: "Identifiant de l'entité (ressource ou dépôt)"
        tests:
          - not_null
      - name: entity_name
        description: "Nom de l'entité (en lowercase)"
      - name: entity_type
        description: "Type de l'entité (en lowercase)"
      - name: date_system
        description: >
          Instant du calcul du stock théorique côté Oracle (SYSDATE, 23:15 heure de
          Paris). L'horloge Oracle est nue, sans fuseau : le staging la déclare en
          Europe/Paris pour en faire un instant juste. NE PAS s'en servir comme jour
          métier — une lecture en heure locale la ferait basculer sur le lendemain.
          Utiliser `snapshot_date`.
        tests:
          - not_null
      - name: resources_code
        description: "Code de la ressource"
      - name: product_code
        description: "Code du produit"
        tests:
          - not_null
      - name: product_name
        description: "Nom du produit"
      - name: date_inventaire
        description: >
          Date du dernier inventaire physique, point de départ du calcul théorique.
          VARCHAR2 côté Oracle, parsé en Europe/Paris pour la même raison que
          `date_system`. NULL sur les produits sans inventaire physique récent.
      - name: stock_inventaire
        description: "Stock inventaire réel ou théorique à la date donnée"
      - name: plus
        description: "Quantité en plus par rapport au stock théorique"
      - name: moins
        description: "Quantité en moins par rapport au stock théorique"
      - name: stock_at_date
        description: "Stock théorique à la date donnée"
      - name: dpa
        description: "Dernier prix d'achat"
      - name: pump
        description: "Prix moyen pondéré ou autre information de prix"
      - name: purchase_price
        description: "Prix d'achat unitaire"
      - name: extracted_at
        description: >
          Horodatage du run dlt qui a chargé la ligne. Déjà daté avec son fuseau côté
          ingestion, donc juste tel quel. Sert de témoin de révision : un écart de plus
          de quelques minutes avec `date_system` signale une journée rechargée après coup.
      - name: snapshot_date
        description: >
          Jour métier du snapshot (DATE, sans heure ni fuseau). Clé de merge du pipeline
          dlt, et clé de filtre à privilégier en aval : contrairement à `date_system`,
          elle ne peut pas basculer d'un jour selon le fuseau de lecture.
