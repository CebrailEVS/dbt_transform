                severity: warn
      - name: idlabel
        description: "Étiquette."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__label')
                field: idlabel
      - name: extracted_at
        description: "Horodatage d'extraction par dlt (UTC)."
