  - name: stg_oracle_nayka__task
    columns:
      - name: idtask
        description: "Identifiant de la tâche (PK)."
        tests:
          - unique
          - not_null
      - name: task_idtask
        description: "Tâche mère (document d’origine d’une transformation, planification parente…)."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__task')
                field: idtask
      - name: idtask_type
        description: "Type de tâche ; le type fonctionnel est task_type.code_type."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__task_type')
                field: idtask_type
      - name: idtask_status
        description: "Statut de la tâche (PREVU, FAIT, VALIDE, ANNULE…)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__task_status')
                field: idtask_status
      - name: idcompany_self
        description: "Société émettrice, côté Nayka."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__company')
                field: idcompany
      - name: idcompany_peer
        description: "Société tierce : client ou fournisseur."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__company')
                field: idcompany
      - name: iddevice
        description: "Équipement concerné."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__device')
                field: iddevice
      - name: idcontact
        description: "Contact concerné. Clé non déclarée par Oracle."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__contact')
                field: idcontact
              config:
                severity: warn
      - name: idlocation
        description: "Adresse de la tâche."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__location')
                field: idlocation
      - name: idcurrency
        description: "Devise."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__currency')
                field: idcurrency
      - name: idcontact_creation
        description: "Utilisateur de l'ERP qui a créé la tâche."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__contact')
                field: idcontact
      - name: idcontact_modification
        description: "Utilisateur de l'ERP qui a modifié la tâche en dernier."
        tests:
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__contact')
                field: idcontact
      - name: idproduct_source
        description: "Source du mouvement : une société ou un équipement selon type_product_source (le préfixe idproduct_ est trompeur)."
      - name: type_product_source
        description: "Nature de idproduct_source : COMPANY ou DEVICE."
        tests:
          - accepted_values:
              arguments:
                values: ['COMPANY', 'DEVICE']
              config:
                severity: warn
      - name: idproduct_destination
        description: "Destination du mouvement : une société ou un équipement selon type_product_destination."
      - name: type_product_destination
        description: "Nature de idproduct_destination : COMPANY ou DEVICE."
        tests:
          - accepted_values:
              arguments:
                values: ['COMPANY', 'DEVICE']
              config:
                severity: warn
      - name: code
        description: "Code de la tâche, rarement renseigné."
      - name: prefix_document_number
        description: "Préfixe du numéro de pièce (BL, A26, CC…)."
      - name: document_number
        description: "Numéro de pièce affiché dans l'ERP. Unicité non déclarée par Oracle."
        tests:
          - unique:
              config:
                severity: warn
      - name: external_reference
        description: "Référence externe."
      - name: comments_self
        description: "Commentaire interne."
      - name: comments_peer
        description: "Commentaire destiné au tiers."
      - name: code_status_record
        description: "Validité de l'enregistrement : 1 = actif, 0 ou -1 = désactivé ou non validé. Indépendant du statut de la tâche (une tâche ANNULE reste à 1). Non filtré ici ; le filtre `= 1` se pose en intermediate."
        tests:
          - accepted_values:
              arguments:
                values: [-1, 0, 1]
                quote: false
              config:
                severity: warn
      - name: locked
        description: "1 si la tâche est verrouillée contre la modification."
      - name: isobligatory
        description: "1 si la tâche est obligatoire."
      - name: use_mois_comptable
        description: "1 si la tâche est rattachée à un mois comptable."
      - name: is_vat_paid
        description: "Vrai si la TVA est acquittée."
      - name: sequence
        description: "Ordre de la tâche dans sa série ou sa tournée."
      - name: realized_percentage
        description: "Pourcentage de réalisation."
      - name: planed_ref_value
        description: "Valeur de référence prévue."
      - name: real_ref_value
        description: "Valeur de référence réalisée : montant total du document calculé par l’ERP."
      - name: ht_price
        description: "Prix HT, champ personnalisé (balise HTPRICE du xml)."
      - name: ttc_price
        description: "Prix TTC, champ personnalisé (balise TTCPRICE du xml)."
      - name: receiver
        description: "Destinataire e-mail du document, champ personnalisé (balise RECEIVER du xml)."
      - name: planed_start_date
        description: "Début prévu (UTC)."
      - name: planed_end_date
        description: "Fin prévue (UTC)."
      - name: real_start_date
        description: "Début réel (UTC) : la date de référence d’une tâche."
      - name: real_end_date
        description: "Fin réelle (UTC). En 2099 sur une planification sans fin."
      - name: application_start_date
        description: "Premier jour de la période d’application."
      - name: application_end_date
        description: "Dernier jour de la période d’application."
      - name: validation_date
        description: "Validation de la tâche (UTC)."
      - name: conversion_date
        description: "Transformation en un autre document, commande en BL par exemple (UTC)."
      - name: created_at
        description: "Création dans l'ERP (UTC)."
      - name: updated_at
        description: "Dernière modification dans l'ERP (UTC). Curseur de l'extraction incrémentale."
      - name: extracted_at
        description: "Horodatage d'extraction par dlt (UTC). Ne bouge que sur les tâches modifiées : mesure l'activité, pas la santé du pipeline."

