  - name: stg_oracle_nayka__task_has_resources
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idtask
              - idresources
              - task_status
      # Une même affectation sous deux statuts trahit une ligne périmée (la jonction n'est jamais purgée).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idtask
              - idresources
          config:
            severity: warn
    columns:
      - name: idtask
        description: "Tâche (PK composite avec idresources et task_status). Clé déclarée par Oracle, testée en warn : la jonction n'est jamais purgée. Une tâche supprimée y laisse ses lignes, et une ligne dont la clé change dans l'ERP y reste à côté de la nouvelle. Joindre à task en aval ne retire que le premier cas."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__task')
                field: idtask
              config:
                severity: warn
      - name: idresources
        description: "Ressource affectée."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__resources')
                field: idresources
      - name: task_status
        description: "Statut de l'affectation, partie de la PK déclarée par Oracle."
        tests:
          - not_null
      - name: extracted_at
        description: "Horodatage d'extraction par dlt (UTC)."

  - name: stg_oracle_nayka__task_has_amount
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idtask
              - tax_rate
              - idtax
              - idtax_region
      # Une même taxe sous deux taux trahit une ligne périmée (la jonction n'est jamais purgée) :
      # la base HT de la tâche serait comptée deux fois.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idtask
              - idtax
              - idtax_region
          config:
            severity: warn
    columns:
      - name: idtask
        description: "Tâche (PK composite avec tax_rate, idtax et idtax_region). Clé déclarée par Oracle, testée en warn : la jonction n'est jamais purgée. Une tâche supprimée y laisse ses lignes, et une ligne dont la clé change dans l'ERP y reste à côté de la nouvelle. Joindre à task en aval ne retire que le premier cas."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__task')
                field: idtask
              config:
                severity: warn
      - name: idtax
        description: "Taxe, partie de la PK. Table tax non extraite."
        tests:
          - not_null
      - name: idtax_region
        description: "Région fiscale."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__tax_region')
                field: idtax_region
      - name: tax_rate
        description: "Taux de TVA, en pourcentage."
        tests:
          - not_null
      - name: tax_code
        description: "Code de la taxe, figé à la saisie, rarement renseigné."
      - name: tax_name
        description: "Libellé de la taxe, figé à la saisie, rarement renseigné."
      - name: amount_without_tax
        description: "Base HT soumise à ce taux."
      - name: tax_amount
        description: "Montant de TVA à ce taux."
      - name: percentage
        description: "Part de cette base dans le total HT de la tâche, en pourcentage."
      - name: extracted_at
        description: "Horodatage d'extraction par dlt (UTC)."

  - name: stg_oracle_nayka__label_has_task
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idtask
              - idlabel
    columns:
      - name: idtask
        description: "Tâche étiquetée (PK composite avec idlabel). Clé déclarée par Oracle, testée en warn : la jonction n'est jamais purgée. Une tâche supprimée y laisse ses lignes, et une ligne dont la clé change dans l'ERP y reste à côté de la nouvelle. Joindre à task en aval ne retire que le premier cas."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__task')
                field: idtask
