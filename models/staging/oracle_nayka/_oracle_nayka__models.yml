  - name: stg_oracle_nayka__label_has_contract
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - idcontract
              - idlabel
    columns:
      - name: idcontract
        description: "Contrat étiqueté (PK composite avec idlabel)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__contract')
                field: idcontract
      - name: idlabel
        description: "Étiquette."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_oracle_nayka__label')
                field: idlabel
      - name: extracted_at
        description: "Horodatage d'extraction par dlt (UTC)."
