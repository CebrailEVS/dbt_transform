# models/_mssql_sage__sources.yml
version: 2

sources:
  - name: mssql_sage
    description: "Source des données issues de Sage (MSSQL) — données brutes extraites vers BigQuery"
    database: "{{ var('raw_project') }}"
    schema: prod_raw
    config:
      tags: ['mssql_sage', 'source']  # Déplacé dans config

      # Freshness: tier Standard — 26h warn / 48h error
      # Cf. docs/freshness.md
      loaded_at_field: _extracted_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: dbo_f_ecriturea
        description: "Table des écritures analytiques (f_ecriturea) — détail des montants et quantités analytiques par écriture comptable"

        columns:
          - name: ec_no
            description: "Numéro d'écriture comptable"
          - name: n_analytique
            description: "Numéro de l'axe analytique"
          - name: ea_ligne
            description: "Numéro de ligne d'écriture analytique"
          - name: ca_num
            description: "Code du compte analytique (lisible)"
          - name: cb_ca_num
            description: "Code du compte analytique en hexadécimal (encodé)"
          - name: ea_montant
            description: "Montant de l'écriture analytique"
          - name: ea_quantite
            description: "Quantité associée à l'écriture analytique"
          - name: cb_prot
            description: "Indicateur de protection (technique Sage)"
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne). Unicité garantie par l'upsert (MERGE sur cbMarq) du loader."
            tests:
              - unique
              - not_null
          - name: cb_createur
            description: "Utilisateur ayant créé la ligne"
          - name: cb_modification
            description: "Horodatage de la dernière modification"
          - name: cb_replication
            description: "Indicateur de réplication"
          - name: cb_flag
            description: "Flag technique interne"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_creation_user
            description: "Utilisateur ayant créé la ligne (UUID)"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

        # PK testée sur cb_marq (cf. colonne). L'unicité de la clé métier
        # (ec_no, n_analytique, ea_ligne) reste testée au staging après dédup.

      # TABLE ECRITURE COMPTABLE
      - name: dbo_f_ecriturec
        description: "Table des écritures comptables (f_ecriturec) — enregistre les mouvements comptables avec leurs montants, comptes, dates et statuts"

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne). Unicité garantie par l'upsert (MERGE sur cbMarq) du loader."
            tests:
              - unique
              - not_null
          - name: ec_no
            description: "Numéro de l’écriture comptable (clé métier ; unicité et non-nullité gérées au staging)"

          - name: jo_num
            description: "Code du journal comptable"
          - name: cb_jo_num
            description: "Code journal comptable (encodé)"
          - name: ec_no_link
            description: "Numéro d’écriture liée (ex : écriture d’origine ou d’annulation)"
          - name: jm_date
            description: "Periode date facturation"
          - name: ec_jour
            description: "Jour date de facturation"
          - name: ec_date
            description: "Date de l’écriture"
          - name: ec_piece
            description: "Numéro de pièce comptable"
          - name: cb_ec_piece
            description: "Numéro de pièce comptable encodé"
          - name: ec_ref_piece
            description: "Référence de la pièce associée"
          - name: cb_ec_ref_piece
            description: "Référence de la pièce encodée"
          - name: ec_treso_piece
            description: "Pièce de trésorerie associée"
          - name: cg_num
            description: "Numéro du compte général"
          - name: cb_cg_num
            description: "Numéro du compte général encodé"
          - name: cg_num_cont
            description: "Compte général contrepartie"
          - name: ct_num
            description: "Code du tiers associé"
          - name: cb_ct_num
            description: "Code tiers encodé"
          - name: ec_intitule
            description: "Libellé de l’écriture"
          - name: n_reglement
            description: "Numéro de règlement associé"
          - name: ec_echeance
            description: "Date d’échéance"
          - name: ec_parite
            description: "Taux de parité utilisé pour conversion"
          - name: ec_quantite
            description: "Quantité associée à l’écriture"
          - name: n_devise
            description: "Code devise"
          - name: ec_sens
            description: "Sens comptable de l’écriture : 0 = débit, 1 = crédit."
          - name: ec_montant
            description: "Montant de l’écriture"
          - name: ec_lettre
            description: "Indicateur de lettrage"
          - name: ec_lettrage
            description: "Code de lettrage"
          - name: ec_point
            description: "Indicateur de pointage"
          - name: ec_pointage
            description: "Code de pointage"
          - name: ec_impression
            description: "Indicateur d’impression"
          - name: ec_cloture
            description: "Indicateur de clôture"
          - name: ec_c_type
            description: "Type de compte (client, fournisseur, etc.)"
          - name: ec_rappel
            description: "Indicateur de rappel"
          - name: ct_num_cont
            description: "Code du tiers contrepartie"
          - name: ec_lettre_q
            description: "Indicateur de lettrage quantitatif"
          - name: ec_lettrage_q
            description: "Code de lettrage quantitatif"
          - name: ec_an_type
            description: "Type analytique lié"
          - name: ec_r_type
            description: "Type de règlement"
          - name: ec_devise
            description: "Montant dans la devise"
          - name: ec_remise
            description: "Indicateur de remise"
          - name: ec_export_expert
            description: "Indicateur d’export vers Expert"
          - name: ta_code
            description: "Code de taxe associé"
          - name: cb_ta_code
            description: "Code de taxe encodé"
          - name: ec_norme
            description: "Norme comptable utilisée"
          - name: ta_provenance
            description: "Provenance de la taxe"
          - name: ec_penal_type
            description: "Type de pénalité"
          - name: ec_date_penal
            description: "Date de pénalité"
          - name: ec_date_relance
            description: "Date de relance"
          - name: ec_date_rappro
            description: "Date de rapprochement"
          - name: ec_reference
            description: "Référence libre de l’écriture"
          - name: ec_status_regle
            description: "Statut de règlement (0 = non réglé, 1 = réglé)"
          - name: ec_montant_regle
            description: "Montant réglé"
          - name: ec_date_regle
            description: "Date de règlement (supposé, non documenté Sage)"
          - name: ec_rib
            description: "Référence bancaire / RIB (supposé, non documenté Sage)"
          - name: ec_date_op
            description: "Date d'opération (supposé, non documenté Sage)"
          - name: ec_no_cloture
            description: "Numéro d'écriture de clôture (supposé, non documenté Sage)"
          - name: ec_export_rappro
            description: "Indicateur d'export rapprochement (supposé, non documenté Sage)"
          - name: ec_facture_guid
            description: "GUID de la facture associée (supposé, non documenté Sage)"
          - name: ec_date_cloture
            description: "Date de clôture (supposé, non documenté Sage)"
          - name: ec_facture_file
            description: "Chemin ou nom du fichier facture (supposé, non documenté Sage)"
          - name: ec_payment_id
            description: "Identifiant de paiement (supposé, non documenté Sage)"
          - name: ec_pay_now_url
            description: "URL de paiement en ligne (supposé, non documenté Sage)"
          - name: cb_hash
            description: "Hash technique interne Sage (non documenté)"
          - name: cb_hash_version
            description: "Version du hash technique Sage (non documenté)"
          - name: cb_hash_date
            description: "Date du hash technique Sage (non documenté)"
          - name: cb_hash_order
            description: "Ordre du hash technique Sage (non documenté)"
          - name: cle_acs
            description: "Clé ACS (non documenté Sage)"
          - name: ec_ext_provenance
            description: "Provenance externe (supposé, non documenté Sage)"
          - name: ec_ext_sequence
            description: "Séquence externe (supposé, non documenté Sage)"
          - name: sac_id
            description: "Identifiant SAC (non documenté Sage)"
          - name: cb_sac_id
            description: "Identifiant SAC encodé (non documenté Sage)"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"


      # NUNSHEN COMMERCE : TABLE COMPTE (overwrite)
      - name: dbo_f_comptet
        description: "Table brute des comptes clients de MSSQL Sage. Colonnes plates (nouvel extracteur, chargement overwrite) — plus de blob JSON."
        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne). Unicité garantie par l'overwrite (full refresh) du loader."
            tests:
              - unique
              - not_null
          - name: ct_num
            description: "Code unique du compte client"
          - name: ct_intitule
            description: "Intitulé / nom du compte client"
          - name: ct_type
            description: "Type de compte client"
          - name: co_no
            description: "Code comptable associé"
          - name: ct_e_mail
            description: "Email du compte client"
          - name: cb_creation
            description: "Horodatage de création (TIMESTAMP)"
          - name: cb_modification
            description: "Horodatage de dernière modification (TIMESTAMP)"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      # NUNSHEN COMMERCE : TABLE COLLABORATEUR (overwrite)
      - name: dbo_f_collaborateur
        description: "Table brute des collaborateurs de MSSQL Sage. Colonnes plates (nouvel extracteur, chargement overwrite) — plus de blob JSON."
        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne). Unicité garantie par l'overwrite (full refresh) du loader."
            tests:
              - unique
              - not_null
          - name: co_no
            description: "Code unique du collaborateur"
          - name: co_nom
            description: "Nom du collaborateur"
          - name: co_prenom
            description: "Prénom du collaborateur"
          - name: co_fonction
            description: "Fonction du collaborateur"
          - name: cb_creation
            description: "Horodatage de création (TIMESTAMP)"
          - name: cb_modification
            description: "Horodatage de dernière modification (TIMESTAMP)"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      # NUNSHEN COMMERCE : TABLE DOCLIGNE (incrémental)
      - name: dbo_f_docligne
        description: "Table brute des lignes de documents (ventes/achats/stock) de MSSQL Sage. Colonnes plates (nouvel extracteur, chargement incrémental) — plus de blob JSON."
        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne). Unicité garantie par l'upsert (MERGE sur cbMarq) du loader."
            tests:
              - unique
              - not_null
          - name: dl_no
            description: "Identifiant unique de la ligne de document"
          - name: cb_co_no
            description: "Code du collaborateur associé (FK vers f_collaborateur)"
          - name: do_domaine
            description: "Domaine Sage (0 = ventes, 1 = achats/autre, 2 = stock interne)"
          - name: do_type
            description: "Type de document Sage à l'intérieur d'un domaine"
          - name: ct_num
            description: "Code du compte client (ventes) ou code dépôt (stock)"
          - name: do_date
            description: "Date du document (TIMESTAMP)"
          - name: dl_montant_ht
            description: "Montant HT de la ligne"
          - name: dl_montant_ttc
            description: "Montant TTC de la ligne"
          - name: cb_creation
            description: "Horodatage de création (TIMESTAMP)"
          - name: cb_modification
            description: "Horodatage de dernière modification (TIMESTAMP)"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      # ---------------------------------------------------------------------
      # DIMENSIONS COMPTABLES ET ARTICLES (overwrite)
      #
      # Ajoutées le 2026-08-01. Les trois SEULES tables hors périmètre vers
      # lesquelles une clé étrangère de Sage part d'une colonne réellement
      # exposée en staging — les neuf autres cibles ne sont référencées que par
      # des colonnes techniques `cb*` que dbt ne sélectionne pas.
      # ---------------------------------------------------------------------
      - name: dbo_f_compteg
        description: "Plan comptable général (f_compteg) — un compte général par ligne avec son intitulé. 544 lignes."

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne)"
            tests:
              - unique
              - not_null
          - name: cg_num
            description: "Numéro de compte général. Clé métier, unique (contrainte UKA_F_COMPTEG_CG_Num)."
            tests:
              - unique
              - not_null
          - name: cg_intitule
            description: "Libellé du compte général"
          - name: cg_type
            description: "Type de compte (détail, total, centralisateur…)"
          - name: cg_sommeil
            description: "Compte mis en sommeil (inactif)"
          - name: ta_code
            description: "Code taxe rattaché au compte"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      - name: dbo_f_comptea
        description: "Sections analytiques (f_comptea) — une affaire / section par ligne avec son intitulé. 309 lignes."

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne)"
            tests:
              - unique
              - not_null
          - name: n_analytique
            description: "Numéro de plan analytique. Sage déclare l'unicité sur (n_analytique, ca_num), mais cette colonne ne porte qu'UNE valeur : il n'y a qu'un seul plan."
          - name: ca_num
            description: "Code de la section analytique. Unique à lui seul ici — 309 valeurs pour 309 lignes."
            tests:
              - unique
              - not_null
          - name: ca_intitule
            description: "Libellé de la section analytique"
          - name: ca_statut
            description: "Statut de l'affaire"
          - name: ca_sommeil
            description: "Section mise en sommeil (inactive)"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      - name: dbo_f_article
        description: "Référentiel articles (f_article) — une référence par ligne avec sa désignation. 3 589 lignes, 134 colonnes à la source dont seul un socle est exposé en staging."

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne)"
            tests:
              - unique
              - not_null
          - name: ar_ref
            description: "Référence article. Clé métier, unique (contrainte UKA_F_ARTICLE_AR_Ref)."
            tests:
              - unique
              - not_null
          - name: ar_design
            description: "Désignation de l'article"
          - name: fa_code_famille
            description: "Code de la famille d'articles"
          - name: ar_sommeil
            description: "Article mis en sommeil (inactif)"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      # ---------------------------------------------------------------------
      # NUNSHEN — VENTES, STOCK, ACHATS, PRODUCTION
      #
      # Ajoutées le 2026-09-28 (brief de passation ingestion). Seule
      # f_docentete est en `replace` POUR PURGER les documents transformés :
      # f_docligne étant en merge sans purge, une ligne de type 12 (commande
      # fournisseur) ou 24 (préparation de fabrication) n'est ouverte que si
      # son en-tête existe ici.
      # ---------------------------------------------------------------------
      - name: dbo_f_docentete
        description: "En-têtes de documents commerciaux (f_docentete) — un document par (do_type, do_piece). Chargement replace : ne contient que les documents existant dans Sage au dernier run ; un document transformé (commande → réception, PF → bon de fabrication) en disparaît."

        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - do_type
                  - do_piece

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne). Unicité garantie par le replace du loader."
            tests:
              - unique
              - not_null
          - name: do_domaine
            description: "Domaine Sage : 0 = vente, 1 = achat, 2 = stock"
          - name: do_type
            description: "Type de document dans le domaine (7 = facture comptabilisée, 12 = commande fournisseur, 13 = réception, 24 = préparation de fabrication, 26 = bon de fabrication…). Numérotation Sage 100 standard, supposée."
          - name: do_piece
            description: "Numéro de pièce. Unique avec do_type (index UNIQUE Sage)."
          - name: do_date
            description: "Date du document"
          - name: do_tiers
            description: "Tiers du document (client, fournisseur ou dépôt selon le domaine)"
          - name: de_no
            description: "Dépôt du document (FK vers f_depot)"
          - name: do_date_livr
            description: "Date de livraison prévue. Sage écrit 1753-01-01 quand elle est vide."
          - name: do_total_ht
            description: "Total HT du document"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      - name: dbo_f_artstock
        description: "Stock par article × dépôt (f_artstock). Chargement APPEND : chaque run ajoute une photo complète, identifiée par _dlt_load_id. Pas de photo le week-end ; un run manuel en journée en ajoute une seconde le même jour. Historique disponible depuis le 2026-09-24."

        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - _dlt_load_id
                  - ar_ref
                  - de_no

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage. Unique DANS une photo seulement : la même ligne revient à chaque run."
            tests:
              - not_null
          - name: ar_ref
            description: "Référence article (FK vers f_article)"
          - name: de_no
            description: "Numéro de dépôt (FK vers f_depot)"
          - name: as_qte_sto
            description: "Quantité en stock, dans l'unité de l'article"
          - name: as_mont_sto
            description: "Valeur du stock. CMUP = as_mont_sto / as_qte_sto."
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt : date de la photo"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — identifie la photo"

      - name: dbo_f_nomenclat
        description: "Nomenclatures (f_nomenclat) — une ligne par composé → composant. Clé Sage composite (ar_ref, no_ref_det, gammes, no_operation)."

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne). Unicité garantie par le replace du loader."
            tests:
              - unique
              - not_null
          - name: ar_ref
            description: "Référence de l'article composé (FK vers f_article)"
          - name: no_ref_det
            description: "Référence du composant (FK vers f_article)"
          - name: no_qte
            description: "Quantité de composant pour une unité de composé"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      - name: dbo_f_depot
        description: "Dépôts de stock (f_depot) — un dépôt par ligne. 12 lignes."

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne)"
            tests:
              - unique
              - not_null
          - name: de_no
            description: "Numéro de dépôt. Clé métier, unique."
            tests:
              - unique
              - not_null
          - name: de_intitule
            description: "Libellé du dépôt"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      - name: dbo_f_famille
        description: "Familles d'articles (f_famille) — une famille par (fa_code_famille, fa_type). 110 lignes."

        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - fa_code_famille
                  - fa_type

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne)"
            tests:
              - unique
              - not_null
          - name: fa_code_famille
            description: "Code de la famille"
          - name: fa_type
            description: "Type de famille (détail, total, centralisateur…)"
          - name: fa_intitule
            description: "Libellé de la famille"
          - name: cb_creation
            description: "Horodatage de création de la ligne"
          - name: cb_modification
            description: "Horodatage de dernière modification"
          - name: _extracted_at
            description: "Horodatage du run dlt qui a chargé la ligne"
          - name: _dlt_load_id
            description: "Identifiant du paquet de chargement dlt — sert à l’audit"

      - name: dbo_f_artfourniss
        description: "Références article par fournisseur (f_artfourniss) — une ligne par (ar_ref, ct_num)."

        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - ar_ref
                  - ct_num

        columns:
          - name: cb_marq
            description: "Identifiant technique Sage (PK ligne)"
            tests:
              - unique
              - not_null
          - name: ar_ref
            description: "Référence article (FK vers f_article)"
