  - name: stg_mssql_sage__f_artfourniss
    description: "Références et tarifs d'achat par article × fournisseur Nunshen."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ar_ref
              - ct_num
    columns:
      - name: cb_marq
        description: "Identifiant technique Sage (PK ligne)"
        tests:
          - unique
          - not_null
      - name: ar_ref
        description: "Référence article"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mssql_sage__f_article')
                field: ar_ref
              config:
                severity: warn
          # Un seul fournisseur principal par article (vrai sur 1 669 / 1 669 au 2026-09-28)
          - unique:
              config:
                where: "af_principal = 1"
                severity: warn
      - name: ct_num
        description: "Compte fournisseur (tiers de type 1)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mssql_sage__f_comptet')
                field: ct_num
              config:
                severity: warn
      - name: af_principal
        description: "1 = fournisseur principal de l'article"
      - name: af_ref_fourniss
        description: "Référence de l'article chez le fournisseur (renseignée sur 8 % des lignes)"
      - name: af_code_barre
        description: "Code-barres fournisseur (quasi jamais renseigné)"
      - name: af_prix_ach
        description: "Prix d'achat unitaire chez ce fournisseur"
