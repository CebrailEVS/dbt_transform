  - name: stg_mssql_sage__f_docentete
    description: "En-têtes de documents Nunshen (ventes, achats, stock, fabrication). Replace : un document transformé en disparaît."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - do_type
              - do_piece
    columns:
      - name: cb_marq
        description: "Identifiant technique Sage (PK ligne)"
        tests:
          - unique
          - not_null
      - name: do_domaine
        description: "Domaine Sage : 0 = vente, 1 = achat, 2 = stock"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
              config:
                severity: warn
      - name: do_type
        description: "Type de document dans le domaine — vente : 0 devis, 1 commande, 2 préparation de livraison, 3 bon de livraison, 6 facture, 7 facture comptabilisée ; achat : 12 commande fournisseur, 13 réception ; stock : 20 entrée, 21 sortie, 23 virement de dépôt, 24 préparation de fabrication, 26 bon de fabrication. Numérotation Sage 100 standard, supposée."
        tests:
          - not_null
      - name: do_piece
        description: "Numéro de pièce (FN… facture, CF… commande fournisseur, BLF… réception…). Unique avec do_type."
        tests:
          - not_null
      - name: do_doc_type
        description: "Type de document « logique » Sage. Égal à do_type sauf pour la facture comptabilisée (do_type 7 → do_doc_type 6)."
      - name: do_date
        description: "Date du document (jamais 1753)"
        tests:
          - not_null
      - name: do_heure
        description: "Heure de saisie du document, chaîne Sage (format hhmmss préfixé)"
      - name: do_statut
        description: "Statut du document (0 ou 2 en vente, 2 en achat, 0 en stock ; code Sage)"
      - name: do_valide
        description: "Document validé (1 sur les factures comptabilisées)"
      - name: do_provenance
        description: "Provenance du document (0 = normale ; 1, 2 = autres provenances Sage : retour, avoir… — supposé)"
      - name: do_ref
        description: "Référence libre du document (vide sur la moitié)"
      - name: do_piece_orig
        description: "Numéro de la pièce d'origine"
      - name: do_ref_externe
        description: "Référence externe"
      - name: do_no_web
        description: "Numéro de commande web (site marchand), 11 % renseigné"
      - name: do_guid
        description: "GUID Sage du document (NULL partout)"
      - name: do_imprim
        description: "Document imprimé"
      - name: do_attente
        description: "Document en attente (0 partout)"
      - name: do_conversion
        description: "Indicateur de conversion Sage"
      - name: do_exclure
        description: "Document exclu (indicateur Sage)"
      - name: do_tiers
        description: "Tiers du document : client (vente) ou fournisseur (achat) → f_comptet.ct_num. En domaine stock : NUMÉRO DE DÉPÔT, pas un tiers."
        tests:
          - relationships:
              arguments:
                to: ref('stg_mssql_sage__f_comptet')
                field: ct_num
              config:
                where: "do_domaine in (0, 1)"
                severity: warn
      - name: ct_num_payeur
        description: "Tiers payeur (NULL en domaine stock)"
      - name: ct_num_centrale
        description: "Centrale d'achat"
      - name: co_no
