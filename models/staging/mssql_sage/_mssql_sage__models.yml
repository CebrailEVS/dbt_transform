        description: "Prix d'achat en devise (0 partout)"
      - name: af_devise
        description: "Devise du prix (0 = euro)"
      - name: af_prix_ach_nouv
        description: "Nouveau prix d'achat, applicable à af_date_application"
      - name: af_prix_dev_nouv
        description: "Nouveau prix en devise"
      - name: af_remise_nouv
        description: "Nouvelle remise"
      - name: af_date_application
        description: "Date d'application du nouveau tarif. NULL si non renseignée (Sage : 1753-01-01) ; 3 lignes datées."
      - name: af_unite
        description: "Unité d'achat (constante)"
      - name: af_conversion
        description: "Coefficient de conversion unité d'achat → unité de stock (constant)"
      - name: af_conv_div
        description: "Diviseur de conversion (constant)"
      - name: af_colisage
        description: "Colisage (constant)"
