  - name: stg_mssql_sage__f_nomenclat
    description: "Nomenclatures Nunshen — composition des articles fabriqués (composé → composants)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ar_ref
              - no_ref_det
              - ag_no1
              - ag_no2
              - no_operation
    columns:
      - name: cb_marq
        description: "Identifiant technique Sage (PK ligne)"
        tests:
          - unique
          - not_null
      - name: ar_ref
        description: "Référence de l'article composé (produit fabriqué)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mssql_sage__f_article')
                field: ar_ref
              config:
                severity: warn
      - name: no_ref_det
        description: "Référence de l'article composant (matière, emballage, sticker…)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mssql_sage__f_article')
                field: ar_ref
              config:
                severity: warn
      - name: ag_no1
        description: "Gamme 1 du composé (0 partout : gammes non utilisées)"
      - name: ag_no2
        description: "Gamme 2 du composé (0 partout)"
      - name: no_operation
        description: "Opération de fabrication (vide partout)"
      - name: no_qte
        description: "Quantité de composant pour UNE unité de composé, dans l'unité du composant"
        tests:
          - not_null
      - name: no_ordre
        description: "Ordre d'affichage du composant dans la nomenclature"
      - name: no_type
        description: "Type de ligne de nomenclature (1 partout ; code Sage non documenté ici)"
      - name: no_repartition
        description: "Pourcentage de répartition du coût (non utilisé)"
      - name: ag_no1_comp
        description: "Gamme 1 du composant (0 partout)"
      - name: ag_no2_comp
        description: "Gamme 2 du composant (0 partout)"
      - name: de_no
        description: "Dépôt de prélèvement du composant (0 partout : pas de dépôt imposé)"
      - name: no_sous_traitance
        description: "Composant sous-traité (2 lignes sur 5 132)"
      - name: no_commentaire
        description: "Commentaire de ligne (vide partout)"
      - name: created_at
        description: "Date de création de la ligne dans Sage"
