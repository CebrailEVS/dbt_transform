version: 2

# ============================================================
# Couche de service — application Suivi Tech
# Dataset prod : prod_app_suivi_tech. Conventions : docs/conventions/apps.md
# Exposure : models/exposures/suivi_tech.yml
# ============================================================

models:
  - name: app_suivi_tech__technique_piece_nespresso
    description: |
      [QUOI MÉTIER]
      Référentiel des pièces Nespresso qu'un manager peut ajouter à une
      intervention lors d'un retraitement de pièces détachées, avec leur prix
      catalogue. Exclut les lignes de saisie d'intervention (détartrage,
      « pas de pièce », préventives...) qui ne sont pas des pièces.

      [COMMENT CONSTRUITE]
      Articles Yuman (`stg_yuman__products`) dont la référence commence par
      `EVS_NESPRESSO_`, actifs et non interdits, hors pseudo-articles du seed
      `ref_yuman__pseudo_article`. `code_article` est la référence sans préfixe, en
      majuscules. Le prix vient du seed `ref_nesp_tech__articles_prix`, joint comme
      dans `fct_technique__piece_detachee_pricing_nespresso`
      (`lower(code_article) = lower(article_ref_nomad)`).

      [GRAIN]
      1 ligne par `code_article`.

      [NOTES]
      Lu par la page Retraitements Pièces Détachées de l'application Suivi Tech
      (liste des pièces ajoutables). Réservé à l'application, pas de rapport Power BI
      dessus. Yuman distingue la casse : si deux fiches ne diffèrent que par la casse
      du code, la référence en majuscules est conservée, à défaut la plus ancienne.
      `prix_unitaire` est null pour une pièce absente du seed de prix ou dont le
      tarif y vaut 0 (références « Non Référencé CORDON ») : un prix à 0 est un
      tarif inconnu, pas une pièce gratuite.
    columns:
      - name: code_article
        description: >
          Code de la pièce, sans préfixe `EVS_NESPRESSO_`, en majuscules (grain).
          Clé de jointure avec le seed de prix et avec `code_article` de
          `fct_technique__consommation_article_nespresso`.
        tests:
          - not_null

      - name: product_reference
        description: Référence de l'article dans Yuman (`EVS_NESPRESSO_<code_article>`).
        tests:
          - not_null

      - name: libelle
        description: Désignation de la pièce (nom de l'article Yuman).

      - name: prix_unitaire
        description: >
          Prix unitaire catalogue Nespresso (€), issu du seed de prix. Null si la
          pièce n'y figure pas ou si son tarif y vaut 0 (tarif inconnu).

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['code_article']
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 500
            max_value: 5000
          config:
            severity: warn

  - name: app_suivi_tech__technique_alerte_conso_aguila
    description: |
      [QUOI MÉTIER]
      Pour chaque intervention Nespresso à retraiter (alerte de consommation Aguila, pose
      sans stock ou stock van inconnu), le détail des pièces posées avec leur prix
      catalogue et le stock du van du technicien la veille de la pose. Sert à retraiter
      les pièces détachées d'une intervention signalée.

      [COMMENT CONSTRUITE]
      Union de trois populations. Alertes : interventions de
      `int_nesp_tech__alerte_conso_aguila` (les mêmes règles que
      `fct_technique__alerting_consommation_aguila`) dont `alerte_compile` n'est pas vide.
      Poses sans stock : interventions EVS non annulées ni en échec
      (`int_nesp_tech__interventions_dedup`) où la quantité posée d'une pièce du seed
      `ref_nesp_tech__piece_controle_stock` dépasse strictement son stock dans le van la
      veille ; `POSE SANS STOCK` s'ajoute alors à `alerte_compile`. Stocks van inconnus :
      même périmètre, pièce contrôlée posée alors que le van, connu, n'a aucune ligne dans
      l'export retenu (trou de données, pas un stock à 0) ; `STOCK VAN INCONNU` s'ajoute
      alors à `alerte_compile`. Pièces : articles Nespresso dédoublonnés (`sum(quantite)`
      par `code_article`), hors pseudo-articles du seed `ref_yuman__pseudo_article`. Van :
      `storehouses_name` de `stg_yuman__storehouses`, joint à la fiche Yuman du technicien
      (`stg_yuman__users`) sur `nomad_id`, une fiche par `nomad_id` (l'active, à défaut la
      plus récente). Stock : export de stock Yuman daté au plus tard du jour de fin
      d'intervention, au plus 3 jours avant (l'export daté J porte l'état du soir de J-1),
      sommé par van et référence (la source contient des lignes en double). Prix : seed
      `ref_nesp_tech__articles_prix`.

      [GRAIN]
      1 ligne par `n_planning` (intervention à retraiter).

      [NOTES]
      Lu par la page Retraitements Pièces Détachées de l'application Suivi Tech, jointe
      dans l'application aux interventions retraitées. Réservé à l'application, pas de
      rapport Power BI dessus. Le van est l'état courant de la fiche technicien (Type 1),
      pas celui du jour de la pose. `stock_van_veille` est null quand le van est inconnu,
      qu'aucun export n'existe dans la fenêtre ou que le van est absent de l'export
      retenu ; il vaut 0 quand le van est dans l'export sans ligne pour la pièce. Une pose
      sans export dans la fenêtre (début de l'historique, trou d'exports) ou sans van
      connu a un stock null et n'est jamais signalée. Seul le van absent de l'export
      retenu donne le libellé `STOCK VAN INCONNU`.
    columns:
      - name: n_planning
        description: Identifiant de l'intervention Nespresso (clé métier Nomad, grain).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_nesp_tech__interventions_dedup')
                field: n_planning
              config:
                severity: warn

      - name: alerte_compile
        description: >
          Alertes de l'intervention séparées par `-` : alertes de consommation Aguila
          (`int_nesp_tech__alerte_conso_aguila`), puis `POSE SANS STOCK` quand une pièce
          contrôlée est posée en quantité supérieure au stock du van la veille, ou
          `STOCK VAN INCONNU` quand une pièce contrôlée est posée alors que le van, connu,
          est absent de l'export de stock retenu. Les deux libellés s'excluent. Jamais vide.
        tests:
          - not_null

      - name: van_technicien
        description: >
          Nom du stock Yuman (van) du technicien, état courant de sa fiche. Null si le
          technicien n'a pas de fiche ou pas de van rattaché.

      - name: pieces
        description: >
          Pièces posées, tableau vide si l'intervention n'en compte aucune. Une entrée
          par `code_article` : `code_article` (majuscules), `libelle`, `quantite`,
          `prix_unitaire` (€, null si tarif inconnu), `montant` (`quantite` x
          `prix_unitaire`, null si prix inconnu), `stock_van_veille` (null si inconnu).

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['n_planning']
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 100
            max_value: 5000
          config:
            severity: warn
