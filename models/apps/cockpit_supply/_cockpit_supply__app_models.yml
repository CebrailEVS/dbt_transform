      [COMMENT CONSTRUITE] Lignes de bons de fabrication (type 26) de stg_mssql_sage__f_docligne qui entrent en stock (dl_mvt_stock = 1 ; 3 = composants consommés), hors références de service MANUFACT, quantités sommées par bon et référence.
      [GRAIN] 1 ligne par (n_piece, date_document, reference), depuis janvier 2024.
      [NOTES] Remplace l'import « Bons de fabrication » (table Supabase fabrication_lignes). Un produit fabriqué en plusieurs lots a une ligne par lot dans Sage : la somme corrige le sous-comptage de l'import (une seule ligne gardée par bon et référence). Réservé à l'application : pas de rapport Power BI dessus.
    columns:
      - name: n_piece
        description: "N° du bon de fabrication"
        tests:
          - not_null
      - name: date_document
        description: "Date du bon"
        tests:
          - not_null
      - name: reference
        description: "Produit fabriqué"
        tests:
          - not_null
      - name: code_famille
        description: "Famille du produit"
      - name: quantite
        description: "Quantité fabriquée (somme des lots)"
      - name: nb_lignes_lot
        description: "Nombre de lignes Sage (lots) sommées"
      - name: extracted_at
        description: "Horodatage de l'extraction Sage"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['n_piece', 'date_document', 'reference']

  - name: app_cockpit__nunshen_commande_fournisseur
    description: |
      [QUOI MÉTIER] Lignes de commandes fournisseurs Nunshen encore ouvertes : reste à livrer, date de livraison prévue, dépôt de réception, fournisseur. Alimente le stock projeté, les commandes Siti, le cash flow, les retards fournisseurs et le statut « en attente de validation matière ».
      [COMMENT CONSTRUITE] Lignes de commandes fournisseurs (type 12) de stg_mssql_sage__f_docligne ; dépôt et date de livraison de la ligne, sinon de l'en-tête ; fournisseur de stg_mssql_sage__f_comptet (intitulé sans espaces finaux) ; quantité déjà reçue sommée sur les réceptions de la même commande et de la même référence.
      [GRAIN] 1 ligne par ligne de commande ouverte (n_piece, reference, une ligne Sage).
      [NOTES] Remplace l'import « Commandes fournisseurs » (lignes « Bon de commande »). Sage supprime une ligne reçue de la commande : qte_restante = quantité de la ligne (règle nun_qte_restante de l'app). Réservé à l'application : pas de rapport Power BI dessus.
    columns:
      - name: type_document
        description: "Toujours « Bon de commande » (compatibilité avec l'import)"
      - name: n_piece
        description: "N° de commande fournisseur"
        tests:
          - not_null
      - name: reference
        description: "Référence commandée (MANUFACT = conditionnement Siti)"
        tests:
          - not_null
      - name: designation
        description: "Désignation"
      - name: qte_commandee
        description: "Quantité de la ligne ouverte"
      - name: qte_restante
        description: "Reste à livrer (= quantité de la ligne ouverte)"
      - name: qte_livree
        description: "Quantité déjà reçue sur cette commande et cette référence"
      - name: prix_unitaire_ht
        description: "Prix unitaire HT (€)"
      - name: date_piece_bc
        description: "Date de la commande"
      - name: date_livraison
        description: "Date de livraison prévue"
      - name: depot
        description: "Dépôt de réception"
      - name: code_fournisseur
        description: "Compte fournisseur"
      - name: intitule_fournisseur
        description: "Nom du fournisseur"
      - name: extracted_at
        description: "Horodatage de l'extraction Sage"

  - name: app_cockpit__nunshen_reception
    description: |
      [QUOI MÉTIER] Réceptions fournisseurs Nunshen (bons de réception) avec la commande d'origine et le lot reçu : achats, fiches et taux de service fournisseurs, flux, Audit Bio.
      [COMMENT CONSTRUITE] Lignes de bons de réception (type 13) de stg_mssql_sage__f_docligne ; dépôt et date de livraison de la ligne, sinon de l'en-tête ; fournisseur de stg_mssql_sage__f_comptet ; lot de la photo la plus récente de stg_mssql_sage__f_lotserie (ligne d'entrée liée par dl_no_in).
      [GRAIN] 1 ligne par ligne de réception Sage, depuis janvier 2024.
      [NOTES] Remplace l'import « Réceptions fournisseurs » (lignes « Bon de livraison »), qui écrasait les lignes d'un même produit reçu en plusieurs lots. Réservé à l'application : pas de rapport Power BI dessus.
    columns:
      - name: n_piece
        description: "N° du bon de réception"
        tests:
          - not_null
      - name: n_piece_bc
        description: "N° de la commande d'origine"
      - name: date_piece_bc
        description: "Date de la commande d'origine"
      - name: date_piece_bl
        description: "Date de la réception"
        tests:
          - not_null
      - name: date_livraison
        description: "Date de livraison prévue"
      - name: reference
        description: "Référence reçue"
        tests:
          - not_null
      - name: designation
        description: "Désignation"
      - name: qte_livree
        description: "Quantité reçue"
      - name: qte_commandee
        description: "Quantité de la commande d'origine"
      - name: prix_unitaire_ht
        description: "Prix unitaire HT (€)"
      - name: montant_ht
        description: "Montant HT de la ligne (€)"
      - name: depot
        description: "Dépôt de réception"
      - name: code_fournisseur
        description: "Compte fournisseur"
      - name: intitule_fournisseur
        description: "Nom du fournisseur"
      - name: n_serie_lot
        description: "N° du lot reçu"
      - name: date_fabrication
        description: "Date de fabrication du lot reçu"
      - name: date_peremption
        description: "Date de péremption du lot reçu"
      - name: extracted_at
        description: "Horodatage de l'extraction Sage"

  - name: app_cockpit__nunshen_inventaire
    description: |
      [QUOI MÉTIER] Sessions d'inventaire Nunshen (date × dépôt) : indicateur ISO « fréquence des inventaires ».
      [COMMENT CONSTRUITE] Pièces d'inventaire « i… » d'entrée et de sortie (do_domaine 2, types 20 et 21) de stg_mssql_sage__f_docligne, regroupées par date et dépôt (ligne, sinon en-tête) : nombre de pièces et de références, quantités et valeurs ajustées.
      [GRAIN] 1 ligne par (date_inventaire, depot_id).
      [NOTES] Remplace le proxy « nombre d'imports de stock » de l'ISO. Sage n'écrit une pièce que s'il y a un écart : un inventaire sans écart n'y figure pas (définition à valider par le pilote ISO). Réservé à l'application : pas de rapport Power BI dessus.
    columns:
      - name: date_inventaire
        description: "Date de la session d'inventaire"
        tests:
          - not_null
      - name: depot_id
        description: "N° de dépôt Sage"
      - name: depot
        description: "Intitulé du dépôt"
      - name: nb_pieces
        description: "Nombre de pièces d'inventaire"
      - name: nb_references
        description: "Nombre de références ajustées"
      - name: qte_entree
        description: "Quantités ajoutées"
      - name: qte_sortie
        description: "Quantités retirées"
      - name: valeur_entree
        description: "Valeur ajoutée (€)"
      - name: valeur_sortie
        description: "Valeur retirée (€)"
      - name: extracted_at
        description: "Horodatage de l'extraction Sage"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['date_inventaire', 'depot_id']
