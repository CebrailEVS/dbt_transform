  - name: app_cockpit__neshu_appro_passage
    description: |
      [QUOI MÉTIER] Passages des approvisionneurs Neshu chez les clients (une tâche d'approvisionnement validée). Alimente dans Cockpit Supply les heures de travail des approvisionneurs (premier et dernier passage du jour) et l'onglet Clients (passages chez un client sur une période).
      [COMMENT CONSTRUITE] int_oracle_neshu__appro_tasks_enriched filtrée sur les statuts FAIT et VALIDE (config.STATUS_VALIDES de l'app), avec approvisionneur et date renseignés. Colonnes reprises sans transformation.
      [GRAIN] 1 ligne par task_id (passage).
      [NOTES] task_start_date et task_end_date sont en heure locale française dans la source malgré l'étiquette UTC du type TIMESTAMP : l'app les lit comme des heures locales sans conversion (comportement historique, cf. api/neshu.py). Les bornes propres à l'app (passages depuis le 2026-01-01, pas de passage futur) sont appliquées par ses requêtes. Partition mensuelle sur task_start_date. Réservé à l'application.
    columns:
      - name: task_id
        description: "Identifiant du passage (clé)"
        tests:
          - not_null
          - unique
      - name: task_start_date
        description: "Début du passage, heure locale française (étiquette UTC sans conversion), colonne de partition"
        tests:
          - not_null
      - name: task_end_date
        description: "Fin du passage, heure locale française"
      - name: roadman_code
        description: "Approvisionneur"
        tests:
          - not_null
      - name: company_id
        description: "Client (identifiant)"
