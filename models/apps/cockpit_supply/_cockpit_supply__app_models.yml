  - name: app_cockpit__technique_rupture_depot_courant
    description: |
      [QUOI MÉTIER] Ruptures des dépôts TechCare au dernier jour connu : statut du jour des tuiles Dépôt, ISO et Vue d'ensemble de Cockpit Supply.
