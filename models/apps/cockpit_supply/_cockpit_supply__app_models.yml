version: 2

# ============================================================
# Couche de service — application Cockpit Supply (https://supply.evs-pro.com)
# Dataset prod : prod_app_cockpit_supply. Conventions : docs/conventions/apps.md
# Exposure : models/exposures/cockpit_supply.yml
# ============================================================

models:
  - name: app_cockpit__neshu_stock_photo
    description: |
      [QUOI MÉTIER] Photos de stock Neshu dont l'application Cockpit Supply a besoin : pour chaque série (entité × article) et chaque mois, la dernière photo (stock de fin de mois, ou photo courante pour le mois en cours) et la première (repli de l'app quand la photo de fin de mois manque).
      [COMMENT CONSTRUITE] Sous-ensemble de fct_supply_chain__stock_neshu : lignes dont snapshot_date est le min ou le max de la série (entity_type, id_entity, product_code) dans son mois. Colonnes reprises sans transformation, plus trois indicateurs de type de photo.
      [GRAIN] 1 ligne par (snapshot_date, entity_type, id_entity, product_code), comme la table source, sur environ 2 jours par série et par mois.
      [NOTES] Remplace dans l'app la lecture de tout l'historique journalier (~1 M lignes → ~70 k). L'app applique elle-même ses règles de fin de mois (api, stock_snapshot_fin_mois) : ce modèle ne fait que lui fournir les jours nécessaires, d'où des chiffres strictement identiques. Bornes calculées PAR SÉRIE et non par jour global : l'app cherche la photo d'un groupe dans les seules lignes de ce groupe, et une série arrêtée en cours de mois (cas réel : café torréfié au dépôt VERT) doit garder sa dernière ligne. date_system tombe toujours le jour de snapshot_date (vérifié le 2026-10-08 sur 984 416 lignes). Les véhicules inactifs ne sont pas filtrés (l'app applique son propre filtre). Réservé à l'application : ne pas brancher de rapport Power BI dessus.
    columns:
      - name: snapshot_date
        description: "Jour métier de la photo (DATE), colonne de partition"
        tests:
          - not_null
      - name: entity_type
        description: "Type d'entité : company (dépôt) ou resource (véhicule). Fait partie du grain (identifiants de séquences distinctes)"
        tests:
          - not_null
      - name: id_entity
        description: "Identifiant de l'entité, unique au sein d'un entity_type"
        tests:
          - not_null
      - name: product_code
        description: "Code article Neshu"
        tests:
          - not_null
      - name: entity_code
        description: "Code du dépôt ou du véhicule"
      - name: entity_name
        description: "Nom de l'entité (minuscules)"
      - name: product_name
        description: "Libellé article"
      - name: date_inventaire
        description: "Date du dernier inventaire physique de l'article dans l'entité"
      - name: date_system
        description: "Horodatage du batch de stock (même jour que snapshot_date)"
      - name: is_vehicle_active
        description: "Véhicule actif selon dim_neshu__resource (état COURANT, non historisé) ; NULL pour les dépôts"
      - name: is_derniere_photo_mois
        description: "Vrai si snapshot_date est la dernière photo de la série (entité × article) dans le mois"
      - name: is_premiere_photo_mois
        description: "Vrai si snapshot_date est la première photo de la série (entité × article) dans le mois"
      - name: is_photo_courante
        description: "Vrai pour la photo la plus récente de la table"
      - name: stock_at_date
        description: "Stock théorique à la date (peut être négatif)"
      - name: stock_inventaire
        description: "Quantité comptée au dernier inventaire"
      - name: plus
        description: "Cumul des entrées depuis le dernier inventaire"
      - name: moins
        description: "Cumul des sorties depuis le dernier inventaire"
      - name: dpa
        description: "Dernier prix d'achat (repli sur purchase_price dans la source)"
      - name: purchase_price
        description: "Prix d'achat de la fiche article"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['snapshot_date', 'entity_type', 'id_entity', 'product_code']

  - name: app_cockpit__lcdp_stock_photo
    description: |
      [QUOI MÉTIER] Photos de stock Cafés du Phare dont l'application Cockpit Supply a besoin : pour chaque série (entité × article) et chaque mois, la dernière et la première photo.
      [COMMENT CONSTRUITE] Sous-ensemble de fct_supply_chain__stock_lcdp : lignes dont snapshot_date est le min ou le max de la série (entity_type, id_entity, product_code) dans son mois (même construction que app_cockpit__neshu_stock_photo). Colonnes reprises sans transformation, plus trois indicateurs de type de photo.
      [GRAIN] 1 ligne par (snapshot_date, entity_type, id_entity, product_code), sur environ 2 jours par mois.
      [NOTES] Remplace dans l'app la lecture de tout l'historique journalier (~250 k lignes → ~19 k). Règles de fin de mois, prix effectif et kg appliqués par l'app (api/lcdp.py). date_system tombe toujours le jour de snapshot_date (vérifié le 2026-10-08). Réservé à l'application.
    columns:
      - name: snapshot_date
        description: "Jour métier de la photo (DATE), colonne de partition"
        tests:
          - not_null
      - name: entity_type
        description: "Type d'entité (company ou resource), fait partie du grain"
        tests:
          - not_null
      - name: id_entity
        description: "Identifiant de l'entité, unique au sein d'un entity_type"
        tests:
          - not_null
      - name: product_code
        description: "Code article Cafés du Phare"
        tests:
          - not_null
      - name: entity_code
        description: "Code du dépôt (LOG, VERT, FABRICATION, TORREFIEVRAC…) ou du véhicule"
      - name: entity_name
        description: "Nom de l'entité"
      - name: product_name
        description: "Libellé article"
      - name: date_inventaire
        description: "Date du dernier inventaire physique"
      - name: date_system
        description: "Horodatage du batch de stock (même jour que snapshot_date)"
      - name: is_vehicle_active
        description: "Véhicule actif (état courant) ; NULL pour les dépôts"
      - name: is_derniere_photo_mois
        description: "Vrai si dernière photo de la série dans le mois"
      - name: is_premiere_photo_mois
        description: "Vrai si première photo de la série dans le mois"
      - name: is_photo_courante
        description: "Vrai pour la photo la plus récente de la table"
      - name: stock_at_date
        description: "Stock théorique à la date"
      - name: stock_inventaire
        description: "Quantité comptée au dernier inventaire"
      - name: plus
        description: "Cumul des entrées depuis le dernier inventaire"
      - name: moins
        description: "Cumul des sorties depuis le dernier inventaire"
      - name: dpa
        description: "Dernier prix d'achat"
      - name: purchase_price
        description: "Prix d'achat de la fiche article"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['snapshot_date', 'entity_type', 'id_entity', 'product_code']

  - name: app_cockpit__neshu_inventaire_transition
    description: |
      [QUOI MÉTIER] Changements de date d'inventaire par entité Neshu et par article : chaque nouvel inventaire physique, avec le stock théorique de la veille. Alimente les indicateurs ISO « fréquence des inventaires » et « fiabilité des stocks » de Cockpit Supply.
      [COMMENT CONSTRUITE] Historique journalier de fct_supply_chain__stock_neshu (lignes à date_inventaire et date_system renseignées, véhicules marqués inactifs exclus comme dans l'app), ordonné par date_system au sein de (entity_code, product_code) ; on garde la première ligne de chaque série et chaque ligne où date_inventaire change, avec la date d'inventaire et le stock théorique de la ligne précédente (LAG).
      [GRAIN] 1 ligne par (entity_code, product_code, date_system), restreinte aux premières lignes et aux changements de date d'inventaire.
      [NOTES] Reproduit exactement le calcul pandas de l'app (api/processus.py) qui exigeait tout l'historique journalier en mémoire : fréquence = nombre de dates d'inventaire distinctes par entité et par mois ; fiabilité = écart entre stock_at_date_precedent et stock_inventaire sur les lignes où is_premiere_ligne est faux. Liste des véhicules hors motif ^V\d+ (ARKEMA, STRASBOURG, RATP) reprise de la config de l'app (DESTINATIONS_VEHICULES_EXTRA). Réservé à l'application.
    columns:
      - name: date_system
        description: "Horodatage de la photo où la nouvelle date d'inventaire apparaît"
        tests:
          - not_null
      - name: entity_code
        description: "Code du dépôt ou du véhicule"
        tests:
          - not_null
      - name: product_code
        description: "Code article Neshu"
        tests:
          - not_null
      - name: date_inventaire
        description: "Date d'inventaire portée par la ligne"
        tests:
          - not_null
      - name: date_inventaire_precedente
        description: "Date d'inventaire de la ligne précédente (NULL pour la première ligne)"
      - name: is_premiere_ligne
        description: "Vrai pour la première ligne de la série (pas de ligne précédente) : non comptée comme transition"
      - name: stock_at_date_precedent
        description: "Stock théorique de la ligne précédente (la veille de l'inventaire)"
      - name: stock_inventaire
        description: "Quantité comptée à l'inventaire"
      - name: stock_at_date
        description: "Stock théorique de la ligne"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['entity_code', 'product_code', 'date_system']

  - name: app_cockpit__neshu_chargement
    description: |
      [QUOI MÉTIER] Chargements machines Neshu validés (articles chargés par les approvisionneurs dans les distributeurs), avec le client et la machine. Alimente les écrans Cockpit Supply « Contrôle des conditionnements », « Clients », flux des véhicules et bilan mensuel.
      [COMMENT CONSTRUITE] int_oracle_neshu__chargement_tasks filtrée sur les statuts FAIT et VALIDE (config.STATUS_VALIDES de l'app), jointe à dim_neshu__company (company_name) et dim_neshu__device (device_name, device_brand) sur leurs identifiants. Colonnes reprises sans transformation.
      [GRAIN] 1 ligne par task_product_id (article d'un bordereau de chargement).
      [NOTES] Remplace dans l'app la lecture en mémoire de tout l'historique (1,25 M lignes) : l'app envoie des requêtes filtrées et ne reçoit que les résultats. Partition mensuelle sur task_start_date (UTC, comme les mois de l'app), clustering vehicle_code / task_id (filtre véhicule, détail d'un bordereau). Champs du bordereau (date, véhicule, approvisionneur, client, machine) constants par task_id (vérifié le 2026-10-08 sur 364 652 bordereaux). Réservé à l'application.
    columns:
      - name: task_product_id
        description: "Identifiant de la ligne article du bordereau (clé)"
        tests:
          - not_null
          - unique
      - name: task_id
        description: "Numéro de bordereau de chargement"
        tests:
          - not_null
      - name: task_start_date
        description: "Date et heure du chargement (UTC), colonne de partition"
        tests:
          - not_null
      - name: task_status_code
        description: "Statut de la tâche (FAIT ou VALIDE)"
      - name: load_type_code
        description: "Type de chargement Oracle"
      - name: task_location_info
        description: "Information d'emplacement saisie sur la tâche"
      - name: vehicle_code
        description: "Véhicule de tournée (NULL sur quelques lignes)"
      - name: roadman_code
        description: "Approvisionneur"
      - name: company_id
        description: "Client (identifiant dim_neshu__company)"
      - name: company_code
        description: "Code client"
      - name: company_name
        description: "Nom du client (dim_neshu__company)"
      - name: device_id
        description: "Machine (identifiant dim_neshu__device), NULL sur quelques lignes"
      - name: device_code
        description: "Code machine"
      - name: device_name
        description: "Nom de la machine (dim_neshu__device)"
      - name: device_brand
        description: "Marque de la machine (BLUPURA, NESTLE, ANIMO…), dim_neshu__device"
      - name: product_code
        description: "Code article chargé"
      - name: unit_coeff_multi
        description: "Coefficient de conditionnement (multiplicateur)"
      - name: unit_coeff_div
        description: "Coefficient de conditionnement (diviseur)"
      - name: base_unit_quantity
        description: "Quantité en unité de base"
      - name: load_quantity
        description: "Quantité chargée"
      - name: load_valuation
        description: "Valorisation du chargement (NULL possible, l'app la compte à 0)"

  - name: app_cockpit__lcdp_chargement
    description: |
      [QUOI MÉTIER] Chargements machines Cafés du Phare Distribution Auto validés (articles chargés par les approvisionneurs dans les distributeurs). Alimente le flux des véhicules de tournée Cafés du Phare dans Cockpit Supply.
      [COMMENT CONSTRUITE] int_oracle_lcdp__chargement_tasks filtrée sur les statuts FAIT et VALIDE (config.STATUS_VALIDES de l'app). Colonnes reprises sans transformation.
      [GRAIN] 1 ligne par task_product_id (article d'un bordereau de chargement).
      [NOTES] Remplace dans l'app la lecture en mémoire de tout l'historique (~370 k lignes) : l'app lit le seul mois affiché. Partition mensuelle sur task_start_date (UTC, comme les mois de l'app). Même construction que app_cockpit__neshu_chargement, sans jointure client / machine (aucun écran n'en a besoin). Réservé à l'application.
    columns:
