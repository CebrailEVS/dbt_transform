  - name: app_cockpit__technique_rupture_depot_jour_vide
    description: |
      [QUOI MÉTIER] Jours où un dépôt TechCare n'a plus une référence en stock (seuls jours susceptibles d'être une rupture de service) : numérateur des taux de disponibilité de Cockpit Supply (tendance dépôt, disponibilité par article, CODIR).
