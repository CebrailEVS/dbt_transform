      [GRAIN] 1 ligne par (stock_date, depot, reference).
      [NOTES] La règle de l'app (qualifier_rupture_tech) ne compte jamais en rupture un jour où le dépôt a du stock : ces jours ne servent qu'au dénominateur, compté dans app_cockpit__technique_rupture_depot_mois. L'app qualifie ces lignes (présence dans les vans actifs, filtre d'activité, pièces interdites). ~26 k lignes au lieu de ~130 k. Réservé à l'application.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['stock_date', 'depot', 'reference']

  - name: app_cockpit__technique_rupture_depot_mois
    description: |
      [QUOI MÉTIER] Nombre de jours de suivi par mois, dépôt et référence TechCare : dénominateur des taux de disponibilité de Cockpit Supply.
      [COMMENT CONSTRUITE] Mêmes lignes et mêmes règles que app_cockpit__technique_rupture_depot_jour_vide, sans le filtre qty_depot, agrégées par mois (FORMAT_DATE de stock_date), dépôt, fournisseur, code article et référence : COUNT(*) et dernier jour suivi.
      [GRAIN] 1 ligne par (mois, depot, reference).
      [NOTES] Taux de disponibilité = 1 − jours en rupture (parmi les jours à zéro) / nombre de jours, identique à la moyenne journalière que calculait l'app. ~6 k lignes. Réservé à l'application.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['mois', 'depot', 'reference']

