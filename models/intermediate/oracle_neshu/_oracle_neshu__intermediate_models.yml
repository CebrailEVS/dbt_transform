        data_type: int64
      - name: product_source_type
        description: "Type de l'entité source = table cible de product_source_id. Valeur : DEVICE (le distributeur)."
        data_type: string
      - name: product_destination_id
        description: >
          Identifiant de l'entité **destination** (où sont retournés les invendus). Référence
          polymorphe : table cible nommée par product_destination_type. Ici COMPANY → company (dépôt).
        data_type: int64
      - name: product_destination_type
        description: "Type de l'entité destination = table cible de product_destination_id. Valeur : COMPANY (dépôt de retour)."
        data_type: string

      # --- CODES ---
      - name: destination_code
        description: "Code du dépôt de retour (company.code), résolu via product_destination_type = COMPANY. Toujours renseigné (filtre du modèle)."
        data_type: string
        tests:
          - not_null
      - name: company_code
        description: "Code client de l'entreprise."
        data_type: string
      - name: product_code
        description: "Code métier du produit."
        data_type: string
      - name: vehicle_code
        description: "Code métier du véhicule collecteur."
        data_type: string
      - name: task_status_code
        description: >
          Code du statut de la tâche. Valeurs : FAIT (réalisé, très majoritaire), ANNULE,
          ANOMALIE, VALIDE.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: [FAIT, VALIDE, ANNULE, ANOMALIE]
              config:
                severity: warn

      # --- DATE ---
      - name: task_start_date
        description: "Date et heure réelle du retrait d'invendus."
        data_type: timestamp
        tests:
          - not_null

      # --- CONDITIONNEMENT & PRIX ---
      - name: unit_coeff_multi
        description: "Coefficient multiplicateur de conditionnement (passage en unités de base)."
      - name: unit_coeff_div
        description: "Coefficient diviseur de conditionnement."
      - name: base_unit_quantity
        description: "Quantité brute saisie (real_quantity), avant application des coefficients."
      - name: product_unit_price_task
        description: "Prix unitaire HT du produit au moment de la tâche (net_price)."
      - name: product_unit_price_latest
        description: "Dernier prix d'achat unitaire HT du produit (référentiel produit)."

      # --- MESURES ---
      - name: quantity
        description: "Quantité d'invendus en unités de base = real_quantity × coeff_multi / coeff_div. Mesure additive."
      - name: valuation
        description: "Valorisation des invendus en euros = quantity × prix d'achat unitaire. Mesure additive (pertes)."

      # --- MÉTADONNÉES ---
      - name: updated_at
        description: "Timestamp de dernière modification en source."
        data_type: timestamp
        tests:
          - not_null
      - name: created_at
        description: "Timestamp de création en source."
        data_type: timestamp
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp d'extraction depuis Oracle."
        data_type: timestamp
        tests:
          - not_null

  - name: int_oracle_neshu__appro_tasks
    description: >
      [QUOI MÉTIER]
      Passages d'approvisionnement (réassort) des distributeurs NESHU : une ligne par tâche
      de type « PASSAGE APPROVISIONNEURS ». Brique de base de la chaîne appro.

      [COMMENT CONSTRUITE]
      stg_oracle_neshu__task filtré sur idtask_type = 32, statut d'enregistrement actif
      (code_status_record = '1') et real_start_date renseignée ; jointures company (client),
      task_status (code statut) et location (info d'accès).

      [GRAIN]
      1 ligne par task_id (PK). ~555k lignes, depuis 2022.

      [NOTES]
      Modèle de base NON enrichi : roadman, véhicule, device normalisé et statut reclassé sont
      ajoutés en aval dans int_oracle_neshu__appro_tasks_enriched. task_status_code couvre tout
      le cycle (PREVU → FAIT/ANNULE…), pas seulement les passages réalisés.
    columns:
      - name: task_id
        description: "Identifiant de la tâche Oracle (EVS.TASK). PK."
        data_type: int64
        tests:
          - unique
          - not_null

      - name: device_id
        description: "Distributeur (machine) concerné. FK → dim_neshu__device."
        data_type: int64

      - name: company_id
        description: "Client (peer company) de la tâche. FK → dim_neshu__company."
        data_type: int64

      - name: product_source_id
        description: >
          Identifiant de l'entité **source** du flux. Référence **polymorphe** : la table cible est
          celle nommée par product_source_type — COMPANY → stg_oracle_neshu__company,
          RESOURCES → stg_oracle_neshu__resources, DEVICE → stg_oracle_neshu__device. Pour l'appro,
          type = RESOURCES (stock du véhicule/roadman). Malgré son nom, ce n'est pas une FK produit.
        data_type: int64

      - name: product_destination_id
        description: >
          Identifiant de l'entité **destination** du flux. Référence **polymorphe** : table cible
          nommée par product_destination_type (mêmes valeurs : COMPANY/RESOURCES/DEVICE…). Pour
          l'appro, type = DEVICE → le distributeur (machine remplie).
        data_type: int64

      - name: company_code
        description: "Code client de l'entreprise (company.code)."
        data_type: string

      - name: product_source_type
        description: "Type d'entité de la source produit. Valeurs : RESOURCES (stock véhicule/ressource), NULL."
        data_type: string

      - name: product_destination_type
        description: "Type d'entité de la destination produit. Valeurs : DEVICE (le distributeur), NULL."
        data_type: string

      - name: task_status_code
        description: >
          Code du statut de la tâche (task_status.code). Valeurs : FAIT (réalisé, majoritaire),
          ANNULE, PREVU (planifié), ENCOURS, ANOMALIE, VALIDE, ACQUITTE, ENATTENTE.
          Filtrer task_status_code = 'FAIT' pour les passages réellement réalisés.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: [FAIT, ANNULE, PREVU, ENCOURS, ANOMALIE, VALIDE, ACQUITTE, ENATTENTE]
              config:
                severity: warn

      - name: task_location_info
        description: "Informations de localisation de la tâche"
        data_type: string

      - name: task_start_date
        description: "Date et heure de début réel du passage appro"
        data_type: timestamp
        tests:
          - not_null

      - name: task_end_date
        description: "Date et heure de fin réel du passage appro"
        data_type: timestamp

      - name: updated_at
        description: "Timestamp de dernière modification (pour incrément)"
        data_type: timestamp
        tests:
          - not_null

      - name: created_at
        description: "Timestamp de création"
        data_type: timestamp
        tests:
          - not_null

      - name: extracted_at
        description: "Timestamp d'extraction depuis Oracle"
        data_type: timestamp
        tests:
          - not_null


  - name: int_oracle_neshu__appro_tasks_enriched
    description: >
      [QUOI MÉTIER]
      Passages d'approvisionnement enrichis : tâche appro + roadman affecté, référentiels
      company/device/GEA, statut normalisé et durée du passage. Base de fct_neshu__passage_appro
      (analyse roadman/jour avec pointage) et des faits dérivés au grain machine.

      [COMMENT CONSTRUITE]
      int_oracle_neshu__appro_tasks enrichi du roadman (stg_oracle_neshu__task_has_resources ×
      resources type=2 = PERSON), du GEA (ref_oracle_neshu__roadman_gea) et des libellés
      company/device. Statut normalisé : ENCOURS reclassé en FAIT (validation métier). Durée
      du passage calculée (fin − début) pour les tâches FAIT.

      [GRAIN]
      1 ligne par task_id (passage appro). ~555k lignes.

      [NOTES]
      Filtré aux passages ayant un roadman rattaché (resources_roadman_id non NULL) — ~327
      passages sans roadman exclus vs int_oracle_neshu__appro_tasks. Pas de véhicule ici :
      seul le roadman (resources type=2) est joint.
    columns:
      - name: task_id
        description: "ID de la tâche"
        tests:
          - unique
          - not_null
      - name: device_id
        description: "Distributeur (machine) concerné. FK → dim_neshu__device. NULL toléré (cf. task_id 11460408, source Oracle)."
      - name: company_id
        description: "Client (peer company). FK → dim_neshu__company."
        tests:
          - not_null
      - name: resources_roadman_id
        description: "Roadman (approvisionneur) affecté. FK → stg_oracle_neshu__resources (idresources, type=2 = PERSON)."
        tests:
          - not_null
      - name: roadman_code
        description: "Code métier du roadman."
      - name: gea_code
        description: "Code GEA du roadman (mappé depuis ref_oracle_neshu__roadman_gea)."
      - name: device_code
        description: "Code device"
      - name: device_name
        description: "Nom device"
      - name: device_info
        description: "Libellé concat 'nom - code'"
      - name: company_code
        description: "Code company"
      - name: company_name
        description: "Nom company"
      - name: company_info
        description: "Libellé concat 'nom - code'"
      - name: task_status_code
        description: >
          Statut de la tâche, **normalisé** : ENCOURS reclassé en FAIT (donc pas de ENCOURS ici,
          contrairement à int_oracle_neshu__appro_tasks). Valeurs : FAIT (réalisé, majoritaire),
          ANNULE, PREVU, ANOMALIE, VALIDE, ACQUITTE, ENATTENTE.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [FAIT, ANNULE, PREVU, ANOMALIE, VALIDE, ACQUITTE, ENATTENTE]
              config:
                severity: warn
      - name: is_done
        description: "Indicateur binaire : 1 si la tâche est réalisée (statut brut FAIT ou ENCOURS), sinon 0."
      - name: is_planned
        description: "Indicateur binaire : 1 si la tâche est planifiée, réalisée ou en anomalie (statut brut PREVU, FAIT, ENCOURS ou ANOMALIE), sinon 0."
      - name: is_anomaly
        description: "Indicateur binaire : 1 si la tâche est en anomalie (statut brut ANOMALIE), sinon 0."
      - name: task_start_date
        description: "Date début passage"
        tests:
          - not_null
      - name: task_end_date
        description: "Date fin passage"
      - name: start_date_day
        description: "task_start_date tronqué au jour"
      - name: passage_duration_min
        description: "Durée du passage en minutes (NULL si non FAIT ou dates manquantes)"
      - name: passage_duration_hours
        description: "Durée du passage en heures"
      - name: passage_duration_interval
        description: "Durée brute en INTERVAL (audit)"
      - name: product_source_id
        description: >
          Identifiant de l'entité **source** du flux. Référence **polymorphe** : la table cible est
          celle nommée par product_source_type — COMPANY → stg_oracle_neshu__company,
          RESOURCES → stg_oracle_neshu__resources, DEVICE → stg_oracle_neshu__device. Pour l'appro,
          type = RESOURCES (stock du véhicule/roadman). Malgré son nom, ce n'est pas une FK produit.
      - name: product_destination_id
        description: >
          Identifiant de l'entité **destination** du flux. Référence **polymorphe** : table cible
          nommée par product_destination_type (mêmes valeurs : COMPANY/RESOURCES/DEVICE…). Pour
          l'appro, type = DEVICE → le distributeur (machine remplie).
      - name: product_source_type
        description: "Type de l'entité source = table cible de product_source_id. Pour l'appro : RESOURCES (stock véhicule/roadman), ou NULL."
      - name: product_destination_type
        description: "Type de l'entité destination = table cible de product_destination_id. Pour l'appro : DEVICE (le distributeur), ou NULL."
      - name: task_location_info
        description: "Infos de localisation de la tâche"
      - name: created_at
        description: "Timestamp création source"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp dernière modif source"
        tests:
          - not_null


  - name: int_oracle_neshu__appro_machine_context
    description: |
      [QUOI MÉTIER]
      Contexte appro par machine : pour chaque device ayant eu au moins un
      passage appro, expose son dernier passage FAIT, son prochain PRÉVU, et
      des compteurs (total, à venir, 30j, 90j).

      [COMMENT CONSTRUITE]
      Agrégation de `int_oracle_neshu__appro_tasks_enriched` (grain task)
      vers le grain device. Utilise `row_number() over (partition by device_id
      order by task_start_date)` pour identifier le dernier FAIT et le
      prochain PRÉVU. Référentiel devices = uniquement les machines avec ≥ 1
      passage (pas de jointure sur `dim_neshu__device`).

      [GRAIN]
      1 ligne par device_id (PK).

      [NOTES]
      Pas de filtre temporel ni de filtre `is_active` ici — l'intermediate
      reste agnostique, les marts en aval filtrent. `company_id` est extrait
      via `any_value()` car normalement stable par device ; à surveiller via
      data quality. Pattern factorisé pour éviter de dupliquer la logique
      "dernier appro / prochain appro / compteurs" dans plusieurs marts
      consommateurs.
    columns:
      - name: device_id
        description: "Machine (distributeur). PK de ce modèle. FK → dim_neshu__device."
        tests:
          - unique
          - not_null
      - name: company_id
        description: "Client de la machine (any_value, normalement stable par device). FK → dim_neshu__company."
        tests:
          - not_null
      - name: last_appro_task_id
        description: "Tâche du dernier passage FAIT (NULL si jamais d'appro FAIT). FK → int_oracle_neshu__appro_tasks_enriched."
      - name: last_appro_date
        description: "Date du dernier passage FAIT"
      - name: last_appro_roadman_id
        description: "ID du roadman du dernier passage FAIT"
      - name: last_appro_roadman_code
        description: "Code du roadman du dernier passage FAIT"
      - name: last_appro_gea_code
        description: "Code GEA du dernier passage FAIT"
      - name: days_since_last_appro
        description: "Nombre de jours depuis le dernier passage FAIT (NULL si aucun)"
      - name: next_appro_task_id
        description: "ID du prochain passage PRÉVU à venir (NULL si rien de planifié)"
      - name: next_appro_date
        description: "Date du prochain passage PRÉVU"
      - name: next_appro_roadman_id
        description: "ID du roadman planifié sur le prochain passage"
      - name: next_appro_roadman_code
        description: "Code du roadman planifié"
      - name: next_appro_gea_code
        description: "Code GEA planifié"
      - name: days_until_next_appro
        description: "Nombre de jours jusqu'au prochain passage PRÉVU (NULL si aucun)"
      - name: nb_appros_realises_total
        description: "Compteur total des passages FAIT (toute période)"
        tests:
          - not_null
      - name: nb_appros_planifies_a_venir
        description: "Compteur des passages PRÉVU encore à venir"
        tests:
          - not_null
      - name: nb_appros_realises_30d
        description: "Compteur des passages FAIT sur les 30 derniers jours"
        tests:
          - not_null
      - name: nb_appros_realises_90d
        description: "Compteur des passages FAIT sur les 90 derniers jours"
        tests:
          - not_null


  - name: int_oracle_neshu__inter_techinique_tasks
    description: >
      [QUOI MÉTIER]
      Interventions de petite maintenance technique NESHU (préventif) : une ligne par intervention
      sur un distributeur, avec son statut et sa classification (labels). Orientées petites
      opérations ; les cas non résolus sur place sont escaladés à l'équipe technique
      (statut_inter = TOTECH).

      [COMMENT CONSTRUITE]
      stg_oracle_neshu__task (idtask_type = 131 INTERVENTION TECHNIQUE, statuts FAIT/VALIDE/ANNULE/
      ANOMALIE, code_status_record = '1') enrichi company/device/product, puis pivot des labels EAV
      (label_has_task × label × label_family) en colonnes : statut_inter, dc04, mission_type,
      objet_intervent. Filtré sur objet_intervent = 'OC04' (intervention préventive).

      [GRAIN]
      1 ligne par task_id (intervention). ~731 lignes, depuis mai 2025 (modèle récent).

      [NOTES]
      Pas de notion de flux produit (ni source/destination, ni quantité/valorisation) : c'est un
      modèle d'évènement/statut d'intervention. Les codes de labels (statut_inter, dc04…) sont des
      référentiels métier Oracle.
    columns:
      # --- IDENTIFIANTS ---
      - name: task_id
        description: "Identifiant de la tâche d'intervention Oracle (EVS.TASK). PK de ce modèle."
        tests:
          - unique
          - not_null
      - name: device_id
        description: "Distributeur (machine) concerné par l'intervention. FK → dim_neshu__device."
      - name: company_id
        description: "Client (peer company). FK → dim_neshu__company."
      - name: product_id
        description: "Produit / pièce liée à l'intervention (via task_has_product). FK → dim_neshu__product. Souvent NULL (ces interventions de petite maintenance n'ont en général pas de ligne produit)."

      # --- CODES ---
      - name: company_code
        description: "Code client de l'entreprise."
      - name: device_code
        description: "Code métier du device (numéro de série)."
      - name: product_code
        description: "Code métier du produit / pièce."
      - name: task_status_code
        description: >
          Code du statut de la tâche. Valeurs : FAIT (réalisé, très majoritaire), ANNULE
          (et, autorisés par le filtre, VALIDE / ANOMALIE).
        tests:
          - accepted_values:
              arguments:
                values: [FAIT, VALIDE, ANNULE, ANOMALIE]
              config:
                severity: warn

      # --- LABELS PIVOTÉS (référentiels métier) ---
      - name: statut_inter
        description: >
          Statut de traitement de l'intervention (label de famille 'Statut inter'). Valeurs :
          TERMINATED (traitée / clôturée sur place, majoritaire), TOTECH (non résolue sur place →
          renvoyée à l'équipe technique), NULL. La famille comporte aussi UNTREATED et
          WAITING_PIECE (absents de ce périmètre filtré).
      - name: dc04
        description: >
          Code de classification de l'intervention (label de famille 'DC04'). Valeurs :
          DC0404 (majoritaire), DC0401, DC0403, DC0402, NULL.
      - name: mission_type
        description: "Type de mission (label de famille 'MISSION_TYPE'). Quasi constant : INTER TECHNIQUE (ou NULL)."
      - name: objet_intervent
        description: "Objet de l'intervention (label de famille 'Objet intervent'). Toujours OC04 ici (filtre du modèle = préventif)."

      # --- DATES ---
      - name: task_start_date
        description: "Date et heure réelle de début de l'intervention."
        tests:
          - not_null
      - name: task_end_date
        description: "Date et heure réelle de fin de l'intervention."

      # --- MÉTADONNÉES ---
      - name: updated_at
        description: "Timestamp de dernière modification en source."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp de création en source."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp d'extraction depuis Oracle."
        tests:
          - not_null

  - name: int_oracle_neshu__commande_interne_tasks
    description: >
      [QUOI MÉTIER]
      Commandes / livraisons internes NESHU (type 132) : une ligne par produit d'une commande
      interne, avec son statut de livraison. Approvisionnement interne, typiquement dépôt → véhicule.

      [COMMENT CONSTRUITE]
      stg_oracle_neshu__task (idtask_type = 132, statuts FAIT/VALIDE/ANNULE/ANOMALIE,
      code_status_record = '1') croisé avec task_has_product (grain ligne produit), enrichi product.
      Source ET destination résolues selon leur type (COMPANY → company, RESOURCES → resources).
      Le statut de livraison vient du label de famille STATUT_LIVRAISON. Déduplication sur
      task_product_id en priorisant le label LIVRE.

      [GRAIN]
      1 ligne par task_product_id (ligne produit d'une commande interne). ~93k lignes (~8 360 tâches),
      depuis fin 2022.

      [NOTES]
      Distinct de int_oracle_neshu__livraison_interne_tasks (idtask_type 161) : ici type 132, avec
      suivi de statut de livraison (label_code). Flux dominant COMPANY (dépôt) → RESOURCES (véhicule).
      Seules les lignes dont source ET destination se résolvent sont conservées.
    columns:
      # --- IDENTIFIANTS ---
      - name: task_product_id
        description: "Clé primaire : ligne task_has_product (relation tâche↔produit). PK."
        data_type: int64
        tests:
          - unique
          - not_null
      - name: task_id
        description: "Tâche de commande interne Oracle (EVS.TASK)."
        data_type: int64
        tests:
          - not_null
      - name: company_id
        description: "Client (peer company) de la tâche. FK → dim_neshu__company."
        data_type: int64
      - name: product_id
        description: "Produit commandé. FK → dim_neshu__product."
        data_type: int64
        tests:
          - not_null
      - name: product_source_id
        description: >
          Identifiant de l'entité **source**. Référence polymorphe : table cible nommée par
          product_source_type — COMPANY → stg_oracle_neshu__company (dépôt),
          RESOURCES → stg_oracle_neshu__resources (véhicule). Pas une FK produit.
        data_type: int64
      - name: product_source_type
        description: "Type de l'entité source = table cible de product_source_id. Valeurs : COMPANY (dépôt, majoritaire), RESOURCES (véhicule)."
        data_type: string
      - name: product_destination_id
        description: >
          Identifiant de l'entité **destination**. Référence polymorphe : table cible nommée par
          product_destination_type (COMPANY → company, RESOURCES → resources).
        data_type: int64
      - name: product_destination_type
        description: "Type de l'entité destination = table cible de product_destination_id. Valeurs : RESOURCES (véhicule, majoritaire), COMPANY (dépôt)."
        data_type: string

      # --- CODES ---
      - name: source_code
        description: "Code de l'entité source, résolu selon product_source_type (company.code si COMPANY, resources.code si RESOURCES)."
        data_type: string
        tests:
          - not_null
      - name: destination_code
        description: "Code de l'entité destination, résolu selon product_destination_type (company.code si COMPANY, resources.code si RESOURCES)."
        data_type: string
        tests:
          - not_null
      - name: product_code
        description: "Code métier du produit."
        data_type: string
      - name: task_status_code
        description: >
          Code du statut de la tâche. Valeurs : FAIT (réalisé, majoritaire), VALIDE, ANNULE, ANOMALIE.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: [FAIT, VALIDE, ANNULE, ANOMALIE]
              config:
                severity: warn
      - name: label_code
        description: >
          Statut de livraison de la commande interne (label de famille STATUT_LIVRAISON). Valeurs :
          LIVRE (livré, majoritaire), LIVRE_PARTIEL (livraison partielle), EN_ATTENTE (en attente).
          La déduplication priorise la ligne LIVRE.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: [LIVRE, LIVRE_PARTIEL, EN_ATTENTE]
              config:
                severity: warn

      # --- DATE ---
      - name: task_start_date
        description: "Date et heure réelle de la commande interne."
        data_type: timestamp
        tests:
          - not_null

      # --- CONDITIONNEMENT & PRIX ---
      - name: unit_coeff_multi
        description: "Coefficient multiplicateur de conditionnement (passage en unités de base)."
      - name: unit_coeff_div
        description: "Coefficient diviseur de conditionnement."
      - name: base_unit_quantity
        description: "Quantité brute saisie (real_quantity), avant application des coefficients."
      - name: product_unit_price_task
        description: "Prix unitaire HT du produit au moment de la tâche (net_price)."
      - name: product_unit_price_latest
        description: "Dernier prix d'achat unitaire HT du produit (référentiel produit)."

      # --- MESURES ---
      - name: quantity
        description: "Quantité commandée en unités de base = real_quantity × coeff_multi / coeff_div. Mesure additive."
      - name: valuation
        description: "Valorisation de la commande en euros = quantity × prix d'achat unitaire. Mesure additive."

      # --- MÉTADONNÉES ---
      - name: updated_at
        description: "Timestamp de dernière modification en source."
        data_type: timestamp
        tests:
          - not_null
      - name: created_at
        description: "Timestamp de création en source."
        data_type: timestamp
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp d'extraction depuis Oracle."
        data_type: timestamp
        tests:
          - not_null

  - name: int_oracle_neshu__commande_fournisseur_tasks
    description: >
      [QUOI MÉTIER]
      Commandes fournisseur NESHU (type 120) : une ligne par produit commandé à un fournisseur
      externe (source) et livré dans un dépôt (destination), avec son statut de livraison.
      Approvisionnement externe, typiquement fournisseur → dépôt.

      [COMMENT CONSTRUITE]
      stg_oracle_neshu__task (idtask_type = 120, code_status_record = '1', real_start_date non nul,
      tous statuts de tâche conservés) croisé avec task_has_product (grain ligne produit), enrichi
      product et task_status. Source (fournisseur) et destination (dépôt) résolues sur company
      (type COMPANY dans 100 % des cas). Le statut de livraison est pivoté au grain tâche depuis le
      label de famille STATUT_LIVRAISON (max(case ...)), puis rattaché aux lignes produit — pas de
      déduplication. Seules les lignes dont source ET destination se résolvent sont conservées.

      [GRAIN]
      1 ligne par task_product_id (ligne produit d'une commande fournisseur). ~7 760 lignes
      (~1 670 tâches), depuis 2022.

      [NOTES]
      Jumeau structurel de int_oracle_neshu__commande_interne_tasks (flux COMPANY → COMPANY), mais
      la source est un fournisseur externe (NESPRESSO, NUNSHEN, LIDIS…) et non un dépôt interne ;
      logiquement en amont de int_oracle_neshu__reception_tasks (type 121, bon de réception).
      Contrairement à commande_interne, le label est pivoté au grain tâche (1 label STATUT_LIVRAISON
      par tâche aujourd'hui) plutôt que dédupliqué. Aucun filtre statut ici : le tri
      FAIT/VALIDE/ANNULE se fait en marts / couche métier.
    columns:
      # --- IDENTIFIANTS ---
      - name: task_product_id
        description: "Clé primaire : ligne task_has_product (relation tâche↔produit). PK."
        data_type: int64
        tests:
          - unique
          - not_null
      - name: task_id
        description: "Tâche de commande fournisseur Oracle (EVS.TASK)."
        data_type: int64
        tests:
          - not_null
      - name: company_id
        description: "Client (peer company) de la tâche. FK → dim_neshu__company."
        data_type: int64
      - name: product_id
        description: "Produit commandé. FK → dim_neshu__product."
        data_type: int64
        tests:
          - not_null
      - name: product_source_id
        description: >
          Identifiant de l'entité **source** (le fournisseur). Référence polymorphe : table cible
          nommée par product_source_type — COMPANY → stg_oracle_neshu__company. Pas une FK produit.
        data_type: int64
      - name: product_source_type
        description: "Type de l'entité source = table cible de product_source_id. Toujours COMPANY (fournisseur) sur ce type de tâche."
        data_type: string
      - name: product_destination_id
        description: >
          Identifiant de l'entité **destination** (le dépôt). Référence polymorphe : table cible
          nommée par product_destination_type — COMPANY → stg_oracle_neshu__company.
        data_type: int64
      - name: product_destination_type
        description: "Type de l'entité destination = table cible de product_destination_id. Toujours COMPANY (dépôt) sur ce type de tâche."
        data_type: string

      # --- CODES ---
      - name: source_code
        description: "Code du fournisseur (company.code de la source). Ex. NESPRESSO, NUNSHEN, LIDIS PARIS."
        data_type: string
        tests:
          - not_null
      - name: destination_code
        description: "Code du dépôt destinataire (company.code de la destination). Ex. DEPOTRUNGIS, DEPOTLYON."
        data_type: string
        tests:
          - not_null
      - name: product_code
        description: "Code métier du produit."
        data_type: string
      - name: task_status_code
        description: >
          Code du statut de la tâche. Valeurs observées : FAIT (réalisé, majoritaire), VALIDE, ANNULE.
          Aucun filtre appliqué ici (tri en marts / couche métier).
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: [FAIT, VALIDE, ANNULE, ANOMALIE]
              config:
                severity: warn
      - name: delivery_status_code
        description: >
          Statut de livraison de la commande fournisseur, pivoté au grain tâche depuis le label de
          famille STATUT_LIVRAISON. Valeurs : LIVRE (livré, majoritaire), LIVRE_PARTIEL (livraison
          partielle), EN_ATTENTE (en attente). Nul si la tâche ne porte aucun label.
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: [LIVRE, LIVRE_PARTIEL, EN_ATTENTE]
              config:
                severity: warn

      # --- DATE ---
      - name: task_start_date
        description: "Date et heure réelle de la commande fournisseur."
        data_type: timestamp
        tests:
          - not_null

      # --- CONDITIONNEMENT & PRIX ---
      - name: unit_coeff_multi
        description: "Coefficient multiplicateur de conditionnement (passage en unités de base)."
      - name: unit_coeff_div
        description: "Coefficient diviseur de conditionnement."
      - name: base_unit_quantity
        description: "Quantité brute saisie (real_quantity), avant application des coefficients."
      - name: product_unit_price_task
        description: "Prix unitaire HT du produit au moment de la tâche (net_price)."
      - name: product_unit_price_latest
        description: "Dernier prix d'achat unitaire HT du produit (référentiel produit)."

      # --- MESURES ---
      - name: quantity
        description: "Quantité commandée en unités de base = real_quantity × coeff_multi / coeff_div. Mesure additive."
      - name: valuation
        description: "Valorisation de la commande en euros = quantity × prix d'achat unitaire. Mesure additive."

      # --- MÉTADONNÉES ---
      - name: updated_at
        description: "Timestamp de dernière modification en source."
        data_type: timestamp
        tests:
          - not_null
      - name: created_at
        description: "Timestamp de création en source."
        data_type: timestamp
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp d'extraction depuis Oracle."
        data_type: timestamp
        tests:
          - not_null

  - name: int_oracle_neshu__valorisation_parc_machines
    description: >
      [QUOI MÉTIER]
      Valorisation théorique du parc machines NESHU : pour chaque modèle de machine (device_name)
      et son groupe, le nombre de machines actives et la valeur totale du stock théorique
      qu'elles devraient contenir (capacité × prix d'achat des produits).

      [COMMENT CONSTRUITE]
      Part des clients actifs NESHU (dim_neshu__company : is_active, company_type CLIENTNESHU,
      code 'CN' + 4 chiffres) et de leurs machines actives (dim_neshu__device). Chaque machine est
      rattachée à un device_group (ref_oracle_neshu__groupement_machine), valorisée via les capacités
      de référence (ref_oracle_neshu__valo_machine_capacite) et les prix d'achat produit
      (dim_neshu__product), puis agrégée par (device_name, device_group).

      [GRAIN]
      1 ligne par (device_name, device_group). ~27 lignes (9 groupes), couvrant ~970 machines
      actives pour ~101 k€ de stock théorique total.

      [NOTES]
      Modèle agrégé (pas de grain machine ni de FK device/company en sortie) : c'est une vue
      de référence du parc, reconstruite à chaque run (cf. dbt_updated_at / dbt_invocation_id).
      Valorisation = stock *théorique* (capacité de référence), pas le stock réel constaté.
    columns:
      # --- GRAIN ---
      - name: device_name
        description: "Modèle / désignation de la machine. Composante du grain."
        tests:
          - not_null
      - name: device_group
        description: "Groupe de machines (mapping ref_oracle_neshu__groupement_machine). Composante du grain."
        tests:
          - not_null

      # --- MESURES ---
      - name: nombre_machines
        description: "Nombre de machines actives de ce modèle/groupe (clients NESHU actifs). Mesure additive."
      - name: valorisation_totale_machine
        description: "Valeur totale du stock théorique (€) pour ce modèle/groupe = somme sur les machines de (capacité de référence × prix d'achat produit). Mesure additive."

      # --- MÉTADONNÉES D'EXÉCUTION ---
      - name: dbt_updated_at
        description: "Timestamp de calcul du modèle (current_timestamp au moment du run dbt). Le modèle est entièrement recalculé à chaque run."
      - name: dbt_invocation_id
        description: "Identifiant d'invocation dbt du run ayant produit la ligne (traçabilité)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [device_name, device_group]

  - name: int_oracle_neshu__pointage_tasks
    description: >
      [QUOI MÉTIER]
      Pointages des roadmen NESHU : une ligne par pointage de début (START_DAY) ou de fin
      (END_DAY) de journée. Sert au suivi du temps de travail / amplitude des tournées roadman.

      [COMMENT CONSTRUITE]
      stg_oracle_neshu__task (idtask_type = 194 POINTAGE, code_status_record = '1'), filtré aux
      labels START_DAY / END_DAY (idlabel 2685 / 2686), rattaché au roadman via task_has_resources
      × resources (type 2 = PERSON). Conservé uniquement si un roadman est rattaché.

      [GRAIN]
      1 ligne par task_id (un pointage). ~43k lignes, 91 roadmen, depuis 2022. Une journée de
      roadman = typiquement 2 pointages (un START_DAY + un END_DAY).

      [NOTES]
      Pas de notion de produit ni de flux. Pour reconstruire une amplitude de journée, apparier
      START_DAY et END_DAY d'un même roadman sur date_pointage_jour.
    columns:
      # --- IDENTIFIANTS ---
      - name: task_id
        description: "Identifiant de la tâche de pointage Oracle (EVS.TASK). PK de ce modèle."
        tests:
          - unique
          - not_null
      - name: company_id
        description: "Client (peer company) rattaché à la tâche. FK → dim_neshu__company."
      - name: resources_roadman_id
        description: "Roadman ayant pointé. FK → stg_oracle_neshu__resources (idresources, type 2 = PERSON). Toujours renseigné (filtre du modèle)."
        tests:
          - not_null
      - name: roadman_code
        description: "Code métier du roadman."

      # --- STATUT / TYPE ---
      - name: status_code
        description: >
          Code du statut de la tâche de pointage (task_status.code). En pratique toujours VALIDE
          (le modèle ne filtre pas le statut, mais seuls des pointages validés existent).
        tests:
          - accepted_values:
              arguments:
                values: [VALIDE, FAIT, ANNULE, ANOMALIE, PREVU, ENCOURS, ACQUITTE, ENATTENTE]
              config:
                severity: warn
      - name: label_code
        description: >
          Type de pointage. Valeurs : START_DAY (début de journée), END_DAY (fin de journée).
        tests:
          - accepted_values:
              arguments:
                values: [START_DAY, END_DAY]
              config:
                severity: warn

      # --- DATES ---
      - name: date_pointage
        description: "Date et heure réelle du pointage (real_start_date)."
        tests:
          - not_null
      - name: date_pointage_jour
        description: "Jour du pointage (date_pointage tronqué au jour) — clé d'appariement START_DAY/END_DAY par roadman."

      # --- MÉTADONNÉES ---
      - name: created_at
        description: "Timestamp de création en source."
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp de dernière modification en source."
        tests:
          - not_null
      - name: extracted_at
        description: "Timestamp d'extraction depuis Oracle."
        tests:
          - not_null


  - name: int_oracle_neshu__demande_mensuelle
    description: >
      [QUOI MÉTIER]
      Socle de demande NESHU : consommation mensuelle par dépôt et par article. Matière première
      commune à la chaîne de prévision/réapprovisionnement (classification ABC × Syntetos-Boylan,
      forecast, point de commande). "Demande" = ce qui sort réellement du dépôt.

      [COMMENT CONSTRUITE]
      Union de deux flux, statuts FAIT/VALIDE, agrégée par mois :
      - sorties clients : int_oracle_neshu__livraison_tasks (source = dépôt, toujours COMPANY) ;
      - chargements véhicules : int_oracle_neshu__livraison_interne_tasks (source COMPANY,
        destination ≠ COMPANY pour neutraliser les transferts inter-dépôts).
      Quantité = quantity (déconditionnée en unités de base). Reprend la définition de demande
      validée avec la logistique sur le mart de couverture. Les lignes à quantité nulle
      (mouvements fantômes) sont exclues ; aucune quantité négative n'existe en source, donc la
      demande agrégée est toujours strictement positive.
      Rattachement territoire réappro (macro neshu_depot_reappro) : la demande de Strasbourg (118)
      est attribuée à Lyon (116) — Strasbourg est réapprovisionné depuis Lyon, sa demande remonte
      donc sur Lyon qui commande pour les deux. Les autres dépôts sont inchangés.

      [GRAIN]
      1 ligne par (company_id, product_id, product_code, demande_mois). Représentation *sparse* :
      seuls les mois avec demande existent (pas de ligne à zéro) ; la densification calendaire
      (pour l'ADI) est faite en aval, dans la classification.

      [NOTES]
      company_id = dépôt source (product_source_id), sauf Strasbourg (118) rattaché à Lyon (116).
      Le périmètre (Neshu, hors accessoires non-consommables, articles arrêtés) est appliqué en
      aval, pas ici : hormis le rattachement Strasbourg→Lyon, le socle reste la demande brute
      observée. Ce socle n'est consommé que par la chaîne forecast/réappro.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - company_id
              - product_id
              - demande_mois
    columns:
      - name: company_id
        description: "Dépôt d'où part la demande (product_source_id). FK → dim_neshu__company."
        data_type: int64
        tests:
          - not_null
      - name: product_id
        description: "Produit consommé. FK → dim_neshu__product."
        data_type: int64
        tests:
          - not_null
      - name: product_code
        description: "Code métier du produit."
        data_type: string
        tests:
          - not_null
      - name: demande_mois
        description: "Mois de la demande (1er jour du mois, date_trunc month)."
        data_type: date
        tests:
          - not_null
      - name: quantite_demandee
        description: "Demande du mois en unités de base (somme de quantity déconditionnée). Toujours strictement positive (lignes nulles exclues, aucun négatif en source). Mesure additive."
      - name: nb_mouvements
        description: "Nombre de mouvements réels (quantité > 0) agrégés ce mois-là. Indicateur de fréquence, utile pour l'ADI."

  - name: int_oracle_neshu__facturation_tasks
    description: |
      [QUOI MÉTIER] Lignes de facturation client (FACT CLIENT, type 102) et d'avoir (AVOIR, type 106), porteuses de cinq des six composantes du chiffre d'affaires du P&L client.
      [COMMENT CONSTRUITE] stg_oracle_neshu__task joint à task_has_product et product, statuts 1/2/4 et code_status_record = '1'. Le coefficient de signe vient de stg_oracle_neshu__task_type_has_config (idconfig = 'coefficient').
      [GRAIN] 1 ligne par task_product_id.
      [NOTES] Le coefficient est LA règle de signe du CA : 1 sur FACT CLIENT, −1 sur AVOIR. Sans lui un avoir s'ajouterait au chiffre d'affaires. C'est la seule source de cette règle dans l'ERP. Les cinq catégories sont mutuellement exclusives : les trois codes de prestation sont des produits de type 1, donc hors vending (type 3), et le négoce les écarte explicitement. Une ligne dont le produit ne relève d'aucune catégorie garde ca_category à NULL — le rapport Distrilog l'ignore, elle reste visible ici. La sixième composante, le CA télémétrie, suit d'autres règles : voir int_oracle_neshu__ca_telemetrie.
    columns:
      - name: task_product_id
        description: "Ligne de produit d'une tâche. Grain du modèle."
        data_type: int64
        tests:
          - unique
          - not_null
      - name: company_id
        description: "Client facturé. FK → dim_neshu__company."
        data_type: int64
      - name: ca_category
        description: "VENDING, PRESTA_SERVICE, FONTAINES, LAVES_VERRES, NEGOCE, ou NULL si le produit ne relève d'aucune catégorie du P&L."
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: ['VENDING', 'PRESTA_SERVICE', 'FONTAINES', 'LAVES_VERRES', 'NEGOCE']
              config:
                severity: warn
      - name: sign_coefficient
        description: "1 sur une facture, −1 sur un avoir. Défaut 1 si le type n'est pas paramétré."
      - name: ca_ht_eur
        description: "sale_amount_net multiplié par le coefficient de signe. Mesure additive."

  - name: int_oracle_neshu__ca_telemetrie
    description: |
      [QUOI MÉTIER] Chiffre d'affaires des ventes relevées sur les machines par la télémétrie (Nayax), hors distributions gratuites. Sixième composante du CA du P&L client.
      [COMMENT CONSTRUITE] Tâches AUDITTELE (type 3), statuts 1/4, jointes à task_has_product puis au label de la LIGNE de produit via stg_oracle_neshu__label_has_thp, filtrées sur la famille PAYMENT_MODE avec un code différent de FREE.
      [GRAIN] 1 ligne par (mois, company_id).
      [NOTES] Deux écarts de règle avec les cinq autres composantes, repris tels quels de Distrilog : les statuts retenus sont 1 et 4 seulement (la facturation accepte aussi 2 ENCOURS), et aucun coefficient de signe ne s'applique. Le filtre sur le mode de paiement est ce qui distingue une vente d'une distribution gratuite ; ce lien n'existe que dans label_has_thp. NE PAS confondre avec int_oracle_neshu__telemetry_tasks, qui porte le même type de tâche mais filtre sur les labels TELEM_SOURCE de la TÂCHE. Validé au centime contre le rapport Distrilog.
    columns:
      - name: mois
        description: "Premier jour du mois."
        data_type: date
        tests:
          - not_null
      - name: company_id
        description: "Client. FK → dim_neshu__company."
        data_type: int64
        tests:
          - not_null
      - name: ca_nayax_ht_eur
        description: "CA HT des ventes télémétrie payantes. Mesure additive."

  - name: int_oracle_neshu__ca_client_mensuel
    description: |
      [QUOI MÉTIER] Chiffre d'affaires mensuel par client, ventilé en six composantes et totalisé.
      [COMMENT CONSTRUITE] Pivot de int_oracle_neshu__facturation_tasks sur ca_category, réuni par full outer join à int_oracle_neshu__ca_telemetrie.
      [GRAIN] 1 ligne par (mois, company_id).
      [NOTES] Le full outer join est nécessaire : un client peut n'avoir que de la facturation, ou que de la télémétrie. Les lignes de facturation sans catégorie sont ignorées ici, comme chez Distrilog ; elles restent visibles dans le modèle amont.
    columns:
      - name: mois
        data_type: date
        description: "Premier jour du mois."
        tests:
          - not_null
      - name: company_id
        data_type: int64
        description: "Client. FK → dim_neshu__company."
        tests:
          - not_null
      - name: ca_total_ht_eur
        description: "Somme des six composantes. Mesure additive."

  - name: int_oracle_neshu__cout_produits_mensuel
    description: |
      [QUOI MÉTIER] Coût des produits mis en machine et livrés en bon de livraison, par client et par mois.
      [COMMENT CONSTRUITE] Deux calculs réunis par full outer join. Chargé : somme de amount_without_tax de stg_oracle_neshu__task_has_amount sur les tâches CHARGEMENT MACHINE (type 13). Livré : real_quantity × unit_coeff_multi / unit_coeff_div × purchase_unit_price sur les tâches BL CLIENT (type 101). Statuts 1/4 dans les deux cas.
      [GRAIN] 1 ligne par (mois, company_id).
      [NOTES] POURQUOI ce modèle plutôt que int_oracle_neshu__chargement_tasks et __livraison_tasks, qui portent les mêmes types de tâche. D'abord leurs filtres de statut incluent 3 ANNULE et 5 ANOMALIE : ils servent le suivi d'activité, qui veut voir ce qui a été tenté, alors que le P&L ne compte que le réalisé. Ensuite, pour le chargement, la valorisation diffère à la racine : ces modèles estiment au prix d'achat courant du produit, le P&L lit le montant HT réellement constaté sur la tâche. Les deux colonnes sont validées contre le rapport Distrilog.
    columns:
      - name: mois
        data_type: date
        description: "Premier jour du mois."
        tests:
          - not_null
      - name: company_id
        data_type: int64
        description: "Client. FK → dim_neshu__company."
        tests:
          - not_null
      - name: cout_produits_charges_ht_eur
        description: "Montant HT constaté des produits mis en machine. Mesure additive."
      - name: cout_produits_livres_ht_eur
        description: "Coût d'achat des produits livrés, converti dans l'unité de la ligne. Mesure additive."

  - name: int_oracle_neshu__temps_appro_mensuel
    description: |
      [QUOI MÉTIER] Temps de présence des approvisionneurs chez le client et comptages de passages, par mois. Base de la répartition du coût de main-d'oeuvre du P&L.
      [COMMENT CONSTRUITE] Tâches PASSAGE APPRO (type 32), statuts 1/4, servies par une ressource de type PERSON. Amplitude calculée par jour et par client, puis sommée sur le mois.
      [GRAIN] 1 ligne par (mois, company_id).
      [NOTES] Le temps retenu est l'AMPLITUDE de la journée chez le client — de la première arrivée au dernier départ — et non la somme des durées de tâches : une pause entre deux machines est comptée comme du temps passé. Règle de Distrilog, reproduite telle quelle ; l'intention reste à confirmer côté métier. nb_passages_machine utilise un count DISTINCT volontaire : la jointure sur task_has_resources démultiplie une tâche si le raw porte des lignes que la source n'a plus. Une tâche d'appro n'ayant qu'un approvisionneur, le distinct ne change pas le résultat attendu — il le protège. Ne pas réutiliser int_oracle_neshu__appro_tasks, qui sert l'opérationnel et retient d'autres statuts.
    columns:
      - name: mois
        data_type: date
        description: "Premier jour du mois."
        tests:
          - not_null
      - name: company_id
        data_type: int64
        description: "Client. FK → dim_neshu__company."
        tests:
          - not_null
      - name: nb_min_rm
        description: "Amplitude de présence en minutes, sommée sur les jours du mois. Mesure additive."
      - name: nb_passages_machine
        description: "Nombre de tâches d'approvisionnement, une par machine servie. Mesure additive."
      - name: nb_passages_client
        description: "Nombre de jours distincts de visite. Mesure additive."

  - name: int_oracle_neshu__charges_sociales
    description: |
      [QUOI MÉTIER] Enveloppe mensuelle de charges sociales saisie dans l'ERP, à répartir entre les clients au prorata du temps passé.
      [COMMENT CONSTRUITE] Tâches CHARGES_SOCIALES (type 242), statuts 0/1/2/4, montant extrait de la zone XML au noeud /ZONE/COUTRM par la macro extraire_balise_xml.
      [GRAIN] 1 ligne par mois.
      [NOTES] La saisie est MANUELLE, une tâche par mois. Un mois non saisi n'a aucune ligne ici, et le coût de main-d'oeuvre de ce mois vaut zéro dans le P&L : donnée absente à la source, pas erreur de calcul. Le rapport Distrilog porte le même trou. La colonne nb_saisies expose une éventuelle double saisie, que le max du mois masquerait sinon.
    columns:
      - name: mois
        data_type: date
        description: "Premier jour du mois."
        tests:
          - unique
          - not_null
      - name: charges_sociales_eur
        description: "Montant du mois. Mesure additive dans le temps, mais unique par mois."
      - name: nb_saisies
        description: "Nombre de tâches de charges sociales trouvées pour ce mois. Devrait valoir 1."

  - name: int_oracle_neshu__contrat_client
    description: |
      [QUOI MÉTIER] Date du premier contrat de chaque client, qui date l'entrée en relation et fonde la typologie GET / OTHER du P&L.
      [COMMENT CONSTRUITE] Minimum de original_start_date par idcompany_peer sur stg_oracle_neshu__contract.
      [GRAIN] 1 ligne par company_id.
      [NOTES] Un client peut porter plusieurs contrats, d'où le minimum. La typologie elle-même n'est PAS calculée ici : elle dépend de l'année de référence, donc du mois analysé, et vit au grain (mois, client) dans le mart.
    columns:
      - name: company_id
        data_type: int64
        description: "Client. FK → dim_neshu__company."
        tests:
          - unique
          - not_null
      - name: first_contract_date
        description: "Date de début du contrat le plus ancien."
      - name: nb_contrats
        description: "Nombre de contrats du client."

  - name: int_oracle_neshu__telemetrie_parc
    description: |
      [QUOI MÉTIER] Coût mensuel de télémétrie par client, déduit du parc de terminaux de paiement observé chez lui.
      [COMMENT CONSTRUITE] Tâches DESTRUCTION (271) et INSTALL MACHINE (134) portant un device de type 4, jointes au produit du modèle (device.idmodel = product.idproduct, types 4 et 7 actifs). Coût unitaire lu dans la zone XML du produit au noeud /ZONE/CLOC, multiplié par le nombre de terminaux distincts. Client sous contrat avant le mois observé.
      [GRAIN] 1 ligne par (mois, company_id).
      [NOTES] Le parc est observé à travers des ÉVÉNEMENTS (destruction, installation) et non un inventaire : un client dont le parc n'a pas bougé dans le mois n'a aucun coût de télémétrie — 25 lignes sur 180 à zéro en août 2026. Comportement de Distrilog reproduit tel quel ; savoir s'il est voulu est une question ouverte côté métier. La vue Oracle `model` n'est pas répliquée : c'est `product` filtré sur les types 4 et 7 actifs, et device.idmodel pointe directement product.idproduct. Validé contre le rapport Distrilog.
    columns:
      - name: mois
        data_type: date
        description: "Premier jour du mois."
        tests:
          - not_null
      - name: company_id
        data_type: int64
        description: "Client. FK → dim_neshu__company."
        tests:
          - not_null
      - name: nb_terminaux
        description: "Nombre de terminaux de paiement observés. Mesure additive."
      - name: cout_telemetrie_eur
        description: "Coût mensuel du parc. Mesure additive."

  - name: int_oracle_neshu__amortissement_machines
    description: |
      [QUOI MÉTIER] Dotation aux amortissements mensuelle, par machine et par client : la machine elle-même et ses sous-équipements.
      [COMMENT CONSTRUITE] Machines (device de type 1) vues sur une tâche du mois aux statuts 1/4/5/7, chez un client sous contrat avant le mois. Dotation linéaire = purchase_cost / damping_duration, arrêtée quand l'amortissement est terminé avant le mois. Durées par défaut : 36 mois pour la machine, 60 pour un sous-équipement. Les sous-équipements sont agrégés AVANT jointure.
      [GRAIN] 1 ligne par (mois, company_id, device_id).
      [NOTES] ÉCART VOLONTAIRE avec Distrilog — détail dans le YAML de fct_finance__pnl_client_mensuel, note (2). En résumé : leur requête groupe les sous-équipements par la VALEUR de la dotation et non par leur identifiant, ce qui fusionne ceux qui coûtent pareil et démultiplie la dotation de la machine quand ils diffèrent. Ici chaque sous-équipement compte une fois et chaque machine une fois. La date de référence est le premier jour du mois de la ligne et non la date du calcul, ce qui rend le modèle rejouable. Une machine sans purchase_cost a une dotation nulle : donnée absente à la source.
    columns:
      - name: mois
        data_type: date
        description: "Premier jour du mois."
        tests:
          - not_null
      - name: company_id
        data_type: int64
        description: "Client chez qui la machine a été vue. FK → dim_neshu__company."
        tests:
          - not_null
      - name: device_id
        data_type: int64
        description: "Machine amortie. FK → dim_neshu__device."
        tests:
          - not_null
      - name: dotation_machine_eur
        description: "Dotation de la machine seule. Mesure additive."
      - name: dotation_accessoires_eur
        description: "Somme des dotations des sous-équipements encore en cours d'amortissement. Mesure additive."
      - name: montant_amortissement_eur
        description: "Machine + sous-équipements. Mesure additive."
