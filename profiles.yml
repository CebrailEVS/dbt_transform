# File: transform/profiles.yml
#
# Un seul projet GCP (evs-datastack-prod). L'isolation dev/prod se fait par
# DATASET, portée par l'IAM (infra/dbt_environments.tf) :
#   dev  -> dbt_<dev>        SA dbt-dev (clé locale), n'écrit jamais dans prod_*
#   ci   -> dbt_ci_pr_<N>    SA dbt-ci (WIF, pr-check), n'écrit jamais dans prod_*
#   prod -> prod_<couche>    Cloud Run (clé montée) ou cd (WIF, SA dbt-deployer)
# Hors prod, generate_schema_name met TOUT dans le dataset du target ; les ref()
# non construits partent en --defer vers prod_*.
dbt_warehouse:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_BIGQUERY_PROJECT', 'evs-datastack-prod') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET_DEV') }}"
      threads: 6
      location: europe-west1
      keyfile: "{{ env_var('DBT_BIGQUERY_KEYFILE_DEV') }}"

    # GitHub Actions : identifiants WIF posés en ADC par google-github-actions/auth.
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_BIGQUERY_PROJECT', 'evs-datastack-prod') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET_CI') }}"
      threads: 6
      location: europe-west1

    prod:
      type: bigquery
      # service-account : Cloud Run (clé montée). oauth : job cd (WIF, ADC).
      method: "{{ env_var('DBT_BIGQUERY_METHOD', 'service-account') }}"
      project: "{{ env_var('DBT_BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET_PROD') }}"
      threads: 6
      location: europe-west1
      keyfile: "{{ env_var('DBT_BIGQUERY_KEYFILE', '') }}"
      # 0 retirait le filet sur TOUTES les erreurs transitoires BigQuery, pas
      # seulement sur les collisions d'ecriture. 1 est le defaut de l'adaptateur.
      job_retries: 1
      job_execution_timeout_seconds: 600
