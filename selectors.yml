# =============================================================================
# selectors.yml — selecteurs nommes, appelables via DBT_SELECTOR_NAME
#
# VIDE a dessein depuis le 2026-09-21.
#
# Les deux selecteurs `passage_appro_fastlane*` ont ete supprimes : ils
# n'avaient plus aucun appelant depuis la bascule dlt, et la voie rapide
# intraday qu'ils devaient servir a ete abandonnee — le gain (~195
# constructions/jour) ne justifiait pas un 24e YAML dupliquant le nocturne,
# donc une 21e copie du bloc run_cloud_run_job (cf. regle 10 de la charte,
# infra/CLAUDE.md).
#
# Le full refresh manuel des passages appro se fait directement :
#   dbt build -s +fct_neshu__passage_appro
#   dbt build -s +fct_lcdp__passage_appro
#
# Regle 14 de la charte : un selecteur nomme a un appelant, ou il est supprime.
# `entrypoint.sh` continue de gerer DBT_SELECTOR_NAME : le mecanisme reste
# disponible, il n'a simplement plus d'utilisateur.
# =============================================================================
selectors: []
